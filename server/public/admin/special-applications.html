<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>특판 신청 관리 | 봉이모바일 어드민</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    background: #f5f6fa;
    color: #1a2744;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1680px; margin: 0 auto; padding: 24px 32px; }

  /* Header */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid #e5e7eb;
  }
  .topbar h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.6px; }
  .topbar h1 .pill {
    display: inline-block; margin-left: 10px; padding: 3px 10px;
    background: #FFD60A; color: #0a0a0a; font-size: 11px; font-weight: 800;
    border-radius: 999px; letter-spacing: -0.2px;
  }
  .top-actions { display: flex; gap: 8px; }
  .btn {
    padding: 10px 16px; border-radius: 10px; border: 1px solid #e5e7eb;
    background: #fff; color: #1a2744; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit; letter-spacing: -0.2px;
    transition: all 0.15s;
  }
  .btn:hover { border-color: #1a2744; }
  .btn-primary { background: #1a2744; color: #fff; border-color: #1a2744; }
  .btn-primary:hover { background: #0f1730; }
  .btn-sm { padding: 7px 12px; font-size: 12px; }

  /* Stats */
  .stats {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 22px;
  }
  .stat {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px 20px;
    cursor: pointer; transition: all 0.15s;
  }
  .stat:hover { border-color: #1a2744; transform: translateY(-2px); box-shadow: 0 8px 22px rgba(26, 39, 68, 0.06); }
  .stat.active { border: 2px solid #1a2744; }
  .stat .label { font-size: 12px; color: #767676; font-weight: 600; margin-bottom: 6px; }
  .stat .value { font-size: 26px; font-weight: 900; letter-spacing: -0.8px; }
  .stat .sub { font-size: 11px; color: #767676; margin-top: 2px; }
  .stat[data-status="pending"] .value { color: #d97706; }
  .stat[data-status="contacted"] .value { color: #2563eb; }
  .stat[data-status="completed"] .value { color: #059669; }
  .stat[data-status="cancelled"] .value { color: #888; }

  /* Filters */
  .filters {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 14px 18px; display: flex; gap: 10px; align-items: center;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .search {
    flex: 1; min-width: 240px; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 8px;
    font-size: 13px; font-family: inherit; background: #f9fafc;
  }
  .search:focus { outline: none; border-color: #1a2744; background: #fff; }
  .filters select {
    padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 8px;
    font-size: 13px; font-family: inherit; background: #fff;
    cursor: pointer; font-weight: 600;
  }
  .filters select:focus { outline: none; border-color: #1a2744; }
  .auto-refresh {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #767676; font-weight: 600;
  }
  .auto-refresh input { cursor: pointer; }
  .last-update { font-size: 11px; color: #888; }
  .filter-reset {
    padding: 8px 12px; font-size: 12px; font-weight: 700;
    background: #f5f6fa; border: 1px solid #e5e7eb; border-radius: 8px;
    cursor: pointer; font-family: inherit; color: #1a2744;
  }
  .filter-reset:hover { background: #ebedf3; }

  /* Table */
  .table-wrap {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; padding: 14px 12px; font-size: 12px; font-weight: 800;
    color: #767676; background: #fafbfc; border-bottom: 1px solid #e5e7eb;
    letter-spacing: -0.1px; white-space: nowrap;
  }
  tbody td {
    padding: 14px 12px; font-size: 13px; border-bottom: 1px solid #f0f1f5;
    letter-spacing: -0.2px; vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  .col-id { font-family: 'SF Mono', Menlo, monospace; font-size: 11px; color: #888; }
  .col-no { font-weight: 800; color: #1a2744; font-size: 14px; text-align: center; }

  /* Policy Drawer */
  .policy-section {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
    margin-bottom: 14px; overflow: hidden;
  }
  .policy-header {
    padding: 14px 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    background: #fafbfc; border-bottom: 1px solid #e5e7eb;
  }
  .policy-header:hover { background: #f0f1f5; }
  .policy-header h3 {
    font-size: 14px; font-weight: 800; letter-spacing: -0.3px; color: #1a2744;
  }
  .policy-header .toggle { font-size: 12px; color: #767676; font-weight: 700; }
  .policy-body { display: none; padding: 16px 18px; }
  .policy-body.open { display: block; }
  .policy-tabs {
    display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid #e5e7eb;
  }
  .policy-tab {
    padding: 10px 16px; cursor: pointer;
    font-size: 13px; font-weight: 700;
    color: #767676; border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .policy-tab.active { color: #1a2744; border-bottom-color: #1a2744; }
  .policy-tab .count {
    display: inline-block; margin-left: 6px;
    font-size: 11px; padding: 1px 8px; border-radius: 999px;
    background: #f0f1f5; color: #767676; font-weight: 800;
  }
  .policy-tab.active .count { background: #1a2744; color: #FFD60A; }
  .policy-table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  .policy-table thead th {
    text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 800;
    color: #767676; background: #fafbfc; border-bottom: 1px solid #e5e7eb;
    letter-spacing: -0.1px;
  }
  .policy-table tbody td {
    padding: 10px 12px; border-bottom: 1px solid #f0f1f5;
  }
  .policy-table tbody tr:hover { background: #fafbfc; }
  .policy-table .num { color: #888; font-family: 'SF Mono', Menlo, monospace; font-size: 11px; width: 32px; }
  .policy-table .gift-amount {
    color: #c2410c; font-weight: 800; font-family: 'SF Mono', Menlo, monospace;
    font-size: 13px; text-align: right; white-space: nowrap;
  }
  .policy-table .badge-solo {
    display: inline-block; padding: 2px 7px; background: #dbeafe; color: #1e40af;
    font-size: 10px; font-weight: 800; border-radius: 4px; margin-right: 6px;
  }
  .policy-table .badge-combo {
    display: inline-block; padding: 2px 7px; background: #fef3c7; color: #92400e;
    font-size: 10px; font-weight: 800; border-radius: 4px; margin-right: 6px;
  }

  /* Pagination */
  .pagination {
    display: flex; justify-content: center; align-items: center;
    gap: 4px; margin-top: 18px; flex-wrap: wrap;
  }
  .pagination button {
    padding: 8px 12px; min-width: 36px;
    border: 1px solid #e5e7eb; background: #fff;
    border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 700; font-family: inherit;
    transition: all 0.15s;
  }
  .pagination button:hover:not(:disabled) {
    border-color: #1a2744;
  }
  .pagination button.active {
    background: #1a2744; color: #fff; border-color: #1a2744;
  }
  .pagination button:disabled {
    opacity: 0.4; cursor: not-allowed;
  }
  .pagination .page-info {
    margin: 0 8px; font-size: 12px; color: #767676; font-weight: 600;
  }
  .col-name { font-weight: 700; }
  .col-phone { font-family: 'SF Mono', Menlo, monospace; font-size: 12px; }
  .col-empno { font-family: 'SF Mono', Menlo, monospace; font-size: 12px; color: #555; }

  .carrier-tag {
    display: inline-block; font-size: 10px; font-weight: 800;
    padding: 2px 7px; border-radius: 4px; letter-spacing: -0.1px;
  }
  .ct-SK { background: #ea002c; color: #fff; }
  .ct-KT { background: #1a2744; color: #fff; }
  .ct-LG { background: #a50034; color: #fff; }
  .ct-MVNO { background: #FFD60A; color: #0a0a0a; }
  .arrow { color: #aaa; margin: 0 5px; }

  .gift-cell { display: flex; align-items: center; gap: 8px; }
  .gift-cell img { width: 32px; height: 32px; object-fit: contain; background: #f5f6fa; border-radius: 6px; padding: 3px; }
  .gift-cell .gname { font-size: 12px; font-weight: 600; }

  .combo-yes { display: inline-block; padding: 3px 8px; background: linear-gradient(135deg, #ea580c, #f97316); color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px; }
  .combo-no { color: #aaa; font-size: 11px; }

  .status-badge {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 800; letter-spacing: -0.1px;
  }
  .sb-pending { background: #fef3c7; color: #92400e; }
  .sb-contacted { background: #dbeafe; color: #1e40af; }
  .sb-completed { background: #d1fae5; color: #065f46; }
  .sb-cancelled { background: #f3f4f6; color: #6b7280; }

  .date { font-size: 11px; color: #888; white-space: nowrap; }

  .row-actions { display: flex; gap: 4px; }
  .row-actions select {
    padding: 5px 8px; border: 1px solid #e5e7eb; border-radius: 6px;
    font-size: 11px; font-family: inherit; background: #fff; cursor: pointer;
  }
  .row-actions button {
    padding: 5px 10px; border: 1px solid #e5e7eb; border-radius: 6px;
    background: #fff; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .row-actions button.delete { color: #ef4444; border-color: #fecaca; }
  .row-actions button.detail { color: #1a2744; }
  .row-actions button.restore { color: #fff; background: #059669; border-color: #059669; }
  .mc-actions button.restore { color: #fff; background: #059669; border-color: #059669; }
  .stat[data-status="trash"] .value { color: #888; }

  .empty {
    padding: 60px 20px; text-align: center; color: #888; font-size: 14px;
  }

  /* Detail Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    padding: 24px; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; max-width: 560px; width: 100%;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-header {
    padding: 20px 24px; border-bottom: 1px solid #e5e7eb;
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h2 { font-size: 16px; font-weight: 800; }
  .modal-header button {
    background: #f5f6fa; border: none; border-radius: 8px; width: 32px; height: 32px;
    cursor: pointer; font-size: 16px;
  }
  .modal-body { padding: 24px; }
  .field-pair {
    display: grid; grid-template-columns: 130px 1fr; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid #f0f1f5; font-size: 13px;
  }
  .field-pair:last-child { border-bottom: none; }
  .field-pair .k { color: #767676; font-weight: 600; }
  .field-pair .v { color: #1a2744; font-weight: 700; }
  .modal-memo { width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-family: inherit; font-size: 13px; resize: vertical; min-height: 80px; }

  /* ===== Tablet & Smaller PC (≤ 1280px) ===== */
  @media (max-width: 1280px) {
    .wrap { padding: 20px 24px; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .table-wrap { overflow-x: auto; }
    table { min-width: 1100px; }
  }

  /* Tablet (≤ 1024px) */
  @media (max-width: 1024px) {
    .stats { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat .value { font-size: 22px; }
  }

  /* ===== Mobile Card View (≤ 720px) ===== */
  .mobile-cards { display: none; }
  /* ===== Password Lock Overlay ===== */
  .lock-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a2744 0%, #0f1730 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 24px;
  }
  .lock-card {
    background: #fff; border-radius: 20px; padding: 36px 32px;
    max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  }
  .lock-icon {
    width: 64px; height: 64px; margin: 0 auto 18px;
    background: linear-gradient(135deg, #FFD60A 0%, #FFE15C 100%);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }
  .lock-title { font-size: 20px; font-weight: 900; letter-spacing: -0.6px; margin-bottom: 6px; }
  .lock-desc { font-size: 13px; color: #767676; margin-bottom: 24px; }
  .lock-input {
    width: 100%; padding: 16px; border: 2px solid #e5e7eb; border-radius: 12px;
    font-size: 18px; font-family: inherit; letter-spacing: 4px; text-align: center;
    margin-bottom: 12px; -webkit-appearance: none;
  }
  .lock-input:focus { outline: none; border-color: #1a2744; }
  .lock-error {
    color: #ef4444; font-size: 12px; font-weight: 700;
    margin-top: -4px; margin-bottom: 12px; min-height: 18px;
  }
  .lock-btn {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    background: #1a2744; color: #fff; font-size: 15px; font-weight: 800;
    cursor: pointer; font-family: inherit; letter-spacing: -0.3px;
  }
  .lock-btn:active { transform: scale(0.98); }

  @media (max-width: 720px) {
    body { font-size: 14px; }
    .wrap { padding: 14px; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
    .topbar h1 { font-size: 18px; }
    .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat { padding: 14px 12px; }
    .stat .value { font-size: 22px; }
    .filters { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; }
    .filters .search { width: 100%; }

    /* 테이블 숨기고 카드 보여주기 */
    .table-wrap { display: none; }
    .mobile-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mc {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px 16px;
    }
    .mc-top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
      margin-bottom: 10px;
    }
    .mc-name {
      font-size: 16px; font-weight: 800; letter-spacing: -0.4px;
    }
    .mc-empno {
      font-size: 11px; color: #888; font-family: 'SF Mono', Menlo, monospace;
      margin-top: 2px;
    }
    .mc-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; font-size: 13px; gap: 10px;
    }
    .mc-row .k { color: #888; flex-shrink: 0; }
    .mc-row .v { color: #1a2744; font-weight: 600; text-align: right; }
    .mc-actions {
      display: flex; gap: 6px; margin-top: 12px; padding-top: 12px;
      border-top: 1px solid #f0f1f5;
    }
    .mc-actions select {
      flex: 1; padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 8px;
      font-size: 12px; font-family: inherit; background: #fff;
    }
    .mc-actions button {
      padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 8px;
      background: #fff; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .mc-actions button.detail { background: #1a2744; color: #fff; border-color: #1a2744; }
    .mc-actions button.delete { color: #ef4444; border-color: #fecaca; }

    .modal { max-width: 100%; }
    .modal-body { padding: 18px; }
    .field-pair { grid-template-columns: 110px 1fr; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- Password Lock -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">관리자 인증</div>
    <div class="lock-desc">파이어니 × 에이스휴먼파워 특판 관리</div>
    <input class="lock-input" id="lockUser" type="text" placeholder="아이디" autocomplete="username" autofocus style="margin-bottom:8px;">
    <input class="lock-input" id="lockInput" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div class="lock-error" id="lockError"></div>
    <button class="lock-btn" id="lockBtn">접속</button>
  </div>
</div>

<div class="wrap" style="display:none;" id="adminBody">

  <!-- Top -->
  <div class="topbar">
    <h1>특판 신청 관리 <span class="pill">파이어니 × 에이스휴먼파워</span></h1>
    <div class="top-actions">
      <button class="btn" id="exportBtn">📥 CSV 내보내기</button>
      <button class="btn btn-primary" id="refreshBtn">🔄 새로고침</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="stats"></div>

  <!-- Policy Drawer -->
  <div class="policy-section">
    <div class="policy-header" onclick="togglePolicy()">
      <h3>📋 상품 정책 카탈로그 (총 63개)</h3>
      <span class="toggle" id="policyToggle">▼ 펼치기</span>
    </div>
    <div class="policy-body" id="policyBody">
      <div class="policy-tabs" id="policyTabs"></div>
      <div id="policyContent"></div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <input class="search" id="search" placeholder="🔍 사번 / 이름 / 휴대폰 검색">
    <select id="filterStatus">
      <option value="all">상태: 전체</option>
      <option value="pending">대기</option>
      <option value="contacted">상담중</option>
      <option value="completed">완료</option>
      <option value="cancelled">취소</option>
    </select>
    <select id="filterCombo">
      <option value="all">결합: 전체</option>
      <option value="yes">결합: 인터넷+TV ✅</option>
      <option value="no">결합: 미신청</option>
    </select>
    <select id="filterGift">
      <option value="all">사은품: 전체</option>
      <option value="movingstyle-27">무빙스타일 27"</option>
      <option value="cooker-22">큐커 22L</option>
      <option value="cooker-oven-32">큐커 오븐 32L</option>
      <option value="vacuum-jet-150">제트 청소기</option>
      <option value="speaker-aura-studio-5">하만카돈 스피커</option>
      <option value="monitor-m5-32">스마트모니터 32"</option>
    </select>
    <select id="filterCarrier">
      <option value="all">이동 통신사: 전체</option>
      <option value="SK">SK</option>
      <option value="KT">KT</option>
      <option value="LG">LG U+</option>
    </select>
    <select id="filterPeriod">
      <option value="all">기간: 전체</option>
      <option value="today">오늘</option>
      <option value="week">최근 7일</option>
      <option value="month">최근 30일</option>
    </select>
    <button class="filter-reset" id="filterReset">필터 초기화</button>
    <label class="auto-refresh">
      <input type="checkbox" id="autoRefresh" checked>
      자동 새로고침 (30초)
    </label>
    <span class="last-update" id="lastUpdate"></span>
  </div>

  <!-- Table (Desktop) -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:50px;">순번</th>
          <th>접수일</th>
          <th>사번</th>
          <th>이름</th>
          <th>휴대폰</th>
          <th>통신사 이동</th>
          <th>사은품</th>
          <th>결합</th>
          <th>주소</th>
          <th>상태</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="11" class="empty">불러오는 중...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Mobile Cards -->
  <div class="mobile-cards" id="mobileCards"></div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2>신청서 상세</h2>
      <button onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  const GIFT_LABELS = {
    'movingstyle-27': { name: '무빙스타일 M5 라이트 27"', img: '/docs/images/gifts/movingstyle-27.png' },
    'cooker-22': { name: '비스포크 큐커 멀티 22L', img: '/docs/images/gifts/cooker-22.png' },
    'cooker-oven-32': { name: '비스포크 큐커 오븐 32L', img: '/docs/images/gifts/cooker-oven-32.png' },
    'vacuum-jet-150': { name: '제트 150W 무선청소기', img: '/docs/images/gifts/vacuum-jet-150.png' },
    'speaker-aura-studio-5': { name: '하만카돈 AURA STUDIO 5', img: '/docs/images/gifts/speaker-aura-studio-5.png' },
    'monitor-m5-32': { name: '2025 스마트모니터 M5 32"', img: '/docs/images/gifts/monitor-m5-32.png' },
  };
  const STATUS = ['pending', 'contacted', 'completed', 'cancelled'];
  const STATUS_LABEL = { pending: '대기', contacted: '상담중', completed: '완료', cancelled: '취소' };

  // === 상품 정책 카탈로그 ===
  const POLICIES = {
    SKT: {
      label: '🔴 SKT',
      tvBrand: 'B tv',
      tvPackages: ['이코노미', '스탠다드', '올', '스탠다드 플러스', '올 플러스', '스탠다드 넷플릭스', '올 넷플릭스', '스탠다드 넷플릭스 프리미엄', '올 넷플릭스 프리미엄'],
      gifts: { solo: { '100M': 110000, '500M': 170000, '1G': 170000 }, combo: { '100M': 400000, '500M': 430000, '1G': 490000 } },
    },
    KT: {
      label: '⚫ KT',
      tvBrand: '지니TV',
      tvPackages: ['베이직', '라이트', '에센스', '모든G', '디즈니+모든G'],
      gifts: { solo: { '100M': 90000, '500M': 140000, '1G': 140000 }, combo: { '100M': 370000, '500M': 450000, '1G': 450000 } },
    },
    'LG U+': {
      label: '🟣 LG U+',
      tvBrand: 'U+tv',
      tvPackages: ['실속형', '기본형', '프리미엄', '프리미엄 VOD'],
      gifts: { solo: { '100M': 200000, '500M': 230000, '1G': 230000 }, combo: { '100M': 400000, '500M': 470000, '1G': 470000 } },
    },
  };

  function buildPolicyList(carrier) {
    const p = POLICIES[carrier];
    const items = [];
    ['100M', '500M', '1G'].forEach(speed => {
      items.push({ speed, tv: '', tag: 'solo', gift: p.gifts.solo[speed] });
    });
    ['100M', '500M', '1G'].forEach(speed => {
      p.tvPackages.forEach(tv => {
        items.push({ speed, tv: `${p.tvBrand} ${tv}`, tag: 'combo', gift: p.gifts.combo[speed] });
      });
    });
    return items;
  }

  function renderPolicy(carrier) {
    const items = buildPolicyList(carrier);
    const html = `
      <table class="policy-table">
        <thead>
          <tr>
            <th>#</th>
            <th>상품 구성</th>
            <th style="text-align:right">사은품</th>
          </tr>
        </thead>
        <tbody>
          ${items.map((it, i) => `
            <tr>
              <td class="num">${i + 1}</td>
              <td>
                <span class="${it.tag === 'solo' ? 'badge-solo' : 'badge-combo'}">${it.tag === 'solo' ? '단독' : '결합'}</span>
                인터넷 ${it.speed}${it.tv ? ' + ' + it.tv : ''}
              </td>
              <td class="gift-amount">${it.gift.toLocaleString()}원</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    document.getElementById('policyContent').innerHTML = html;
  }

  function setPolicyTab(carrier) {
    document.querySelectorAll('.policy-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.carrier === carrier);
    });
    renderPolicy(carrier);
  }

  function togglePolicy() {
    const body = document.getElementById('policyBody');
    const toggle = document.getElementById('policyToggle');
    const open = body.classList.toggle('open');
    toggle.textContent = open ? '▲ 접기' : '▼ 펼치기';
    if (open && !document.querySelector('.policy-tab')) {
      // 첫 펼침 시 탭 렌더링
      const tabs = Object.keys(POLICIES).map(c => {
        const total = 3 + (POLICIES[c].tvPackages.length * 3);
        return `<div class="policy-tab" data-carrier="${c}" onclick="setPolicyTab('${c}')">${POLICIES[c].label}<span class="count">${total}</span></div>`;
      }).join('');
      document.getElementById('policyTabs').innerHTML = tabs;
      setPolicyTab('SKT');
    }
  }
  window.togglePolicy = togglePolicy;
  window.setPolicyTab = setPolicyTab;

  const PER_PAGE = 10;
  let currentFilter = 'all';
  let currentQuery = '';
  let cache = [];
  let currentPage = 1;
  let adminUser = sessionStorage.getItem('admin_user') || '';
  let adminPw = sessionStorage.getItem('admin_pw') || '';

  function authHeaders() {
    return {
      'X-Admin-Username': adminUser,
      'X-Admin-Password': adminPw,
      'Content-Type': 'application/json',
    };
  }

  // === Login Lock ===
  const lockOverlay = document.getElementById('lockOverlay');
  const lockUser = document.getElementById('lockUser');
  const lockInput = document.getElementById('lockInput');
  const lockError = document.getElementById('lockError');
  const lockBtn = document.getElementById('lockBtn');
  const adminBody = document.getElementById('adminBody');

  async function attemptLogin(user, pw) {
    try {
      const r = await fetch('/api/special-promo?_=' + Date.now(), {
        headers: { 'X-Admin-Username': user, 'X-Admin-Password': pw },
        cache: 'no-store',
        credentials: 'same-origin',
      });
      if (r.ok) {
        adminUser = user;
        adminPw = pw;
        sessionStorage.setItem('admin_user', user);
        sessionStorage.setItem('admin_pw', pw);
        document.cookie = `admin_user=${encodeURIComponent(user)}; path=/; max-age=43200; SameSite=Lax`;
        document.cookie = `admin_pw=${encodeURIComponent(pw)}; path=/; max-age=43200; SameSite=Lax`;
        lockOverlay.style.display = 'none';
        adminBody.style.display = 'block';
        load();
        setupAutoRefresh();
        return true;
      }
      console.warn('Login failed status:', r.status);
      return r.status;
    } catch (e) {
      console.error('Login network error:', e);
      return 'network:' + e.message;
    }
  }

  lockBtn.addEventListener('click', async () => {
    const user = lockUser.value.trim();
    const pw = lockInput.value.trim();
    if (!user) { lockError.textContent = '아이디를 입력하세요'; lockUser.focus(); return; }
    if (!pw) { lockError.textContent = '비밀번호를 입력하세요'; lockInput.focus(); return; }
    lockBtn.textContent = '확인 중...';
    lockError.textContent = '';
    const result = await attemptLogin(user, pw);
    lockBtn.textContent = '접속';
    if (result !== true) {
      if (typeof result === 'number') {
        lockError.textContent = result === 401 ? '아이디 또는 비밀번호가 올바르지 않습니다' : `인증 실패 (HTTP ${result})`;
      } else {
        lockError.textContent = '서버 연결 오류 — 새로고침 후 다시 시도';
      }
      lockInput.value = '';
      lockInput.focus();
    }
  });
  lockUser.addEventListener('keydown', (e) => { if (e.key === 'Enter') lockInput.focus(); });
  lockInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') lockBtn.click(); });

  // 자동 로그인 시도 (실패해도 조용히)
  if (adminUser && adminPw) {
    attemptLogin(adminUser, adminPw).then(result => {
      if (result !== true) {
        sessionStorage.removeItem('admin_user');
        sessionStorage.removeItem('admin_pw');
      }
    });
  }

  async function load() {
    const url = new URL(location.origin + '/api/special-promo');
    if (currentFilter === 'trash') {
      url.searchParams.set('trash', '1');
    } else if (currentFilter !== 'all') {
      url.searchParams.set('status', currentFilter);
    }
    if (currentQuery) url.searchParams.set('q', currentQuery);
    try {
      const r = await fetch(url, { headers: authHeaders() });
      if (r.status === 401) {
        sessionStorage.removeItem('admin_user');
        sessionStorage.removeItem('admin_pw');
        location.reload();
        return;
      }
      const d = await r.json();
      cache = d.applications || [];
      renderStats(d.stats || {});
      // 페이지가 데이터 범위를 넘으면 1페이지로
      const totalPages = Math.max(1, Math.ceil(cache.length / PER_PAGE));
      if (currentPage > totalPages) currentPage = 1;
      renderPage();
      document.getElementById('lastUpdate').textContent = '마지막 갱신: ' + new Date().toLocaleTimeString('ko-KR');
    } catch (e) {
      document.getElementById('tbody').innerHTML = `<tr><td colspan="11" class="empty">서버 연결 실패: ${e.message}</td></tr>`;
    }
  }

  function renderStats(s) {
    const items = [
      { key: 'all', label: '전체', value: s.total || 0, sub: '' },
      { key: 'pending', label: '대기', value: s.pending || 0, sub: '상담 필요' },
      { key: 'contacted', label: '상담중', value: s.contacted || 0, sub: '진행 중' },
      { key: 'completed', label: '완료', value: s.completed || 0, sub: '개통 완료' },
      { key: 'cancelled', label: '취소', value: s.cancelled || 0, sub: '' },
      { key: 'trash', label: '🗑 휴지통', value: s.trash || 0, sub: '복원 가능' },
    ];
    document.getElementById('stats').innerHTML = items.map(it => `
      <div class="stat ${currentFilter === it.key ? 'active' : ''}" data-status="${it.key}" onclick="setFilter('${it.key}')">
        <div class="label">${it.label}</div>
        <div class="value">${it.value}</div>
        <div class="sub">${it.sub}</div>
      </div>
    `).join('');
  }

  function applyFilters(list) {
    const status = document.getElementById('filterStatus')?.value || 'all';
    const combo = document.getElementById('filterCombo')?.value || 'all';
    const gift = document.getElementById('filterGift')?.value || 'all';
    const carrier = document.getElementById('filterCarrier')?.value || 'all';
    const period = document.getElementById('filterPeriod')?.value || 'all';
    const now = Date.now();
    const PERIOD_MS = { today: 86400000, week: 7*86400000, month: 30*86400000 };

    return list.filter(a => {
      if (status !== 'all' && a.status !== status) return false;
      if (combo === 'yes' && !a.combo) return false;
      if (combo === 'no' && a.combo) return false;
      if (gift !== 'all' && a.gift !== gift) return false;
      if (carrier !== 'all' && a.moveCarrier !== carrier) return false;
      if (period !== 'all') {
        const t = new Date(a.created_at).getTime();
        if (now - t > PERIOD_MS[period]) return false;
      }
      return true;
    });
  }

  function renderPage() {
    const filtered = applyFilters(cache);
    const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
    if (currentPage > totalPages) currentPage = 1;
    const start = (currentPage - 1) * PER_PAGE;
    const end = start + PER_PAGE;
    const pageList = filtered.slice(start, end);
    renderTable(pageList, start);
    renderPagination(filtered.length);
  }

  function renderTable(list, baseIdx = 0) {
    renderMobileCards(list, baseIdx);
    const tbody = document.getElementById('tbody');
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="11" class="empty">신청 내역이 없습니다</td></tr>';
      return;
    }
    tbody.innerHTML = list.map((a, i) => {
      const no = baseIdx + i + 1;
      const g = GIFT_LABELS[a.gift] || { name: a.gift, img: '' };
      const dt = new Date(a.created_at);
      const dateStr = `${dt.getMonth() + 1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      return `
        <tr>
          <td class="col-no">${no}</td>
          <td class="date">${dateStr}</td>
          <td class="col-empno">${a.empno}</td>
          <td class="col-name">${a.name}</td>
          <td class="col-phone">${a.phone}</td>
          <td>
            <span class="carrier-tag ct-${a.currentCarrier}">${a.currentCarrier}</span>
            <span class="arrow">→</span>
            <span class="carrier-tag ct-${a.moveCarrier}">${a.moveCarrier}</span>
          </td>
          <td>
            <div class="gift-cell">
              <img src="${g.img}" alt="">
              <div class="gname">${g.name}</div>
            </div>
          </td>
          <td>${a.combo ? '<span class="combo-yes">현금 추가</span>' : '<span class="combo-no">―</span>'}</td>
          <td title="${escapeHtml(a.address)}">${truncate(a.address, 16)}</td>
          <td><span class="status-badge sb-${a.status}">${STATUS_LABEL[a.status] || a.status}</span></td>
          <td>
            <div class="row-actions">
              ${currentFilter === 'trash' ? `
                <button class="restore" onclick="restoreApp('${a.id}')">복원</button>
                <button class="detail" onclick="openDetail('${a.id}')">상세</button>
                <button class="delete" onclick="permanentDelete('${a.id}')">영구삭제</button>
              ` : `
                <select onchange="updateStatus('${a.id}', this.value)">
                  ${STATUS.map(s => `<option value="${s}" ${a.status === s ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
                </select>
                <button class="detail" onclick="openDetail('${a.id}')">상세</button>
                <button class="delete" onclick="deleteApp('${a.id}')">삭제</button>
              `}
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function renderMobileCards(list, baseIdx = 0) {
    const el = document.getElementById('mobileCards');
    if (!list.length) {
      el.innerHTML = '<div class="empty" style="background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:40px 20px; text-align:center; color:#888;">신청 내역이 없습니다</div>';
      return;
    }
    el.innerHTML = list.map((a, i) => {
      const no = baseIdx + i + 1;
      const g = GIFT_LABELS[a.gift] || { name: a.gift, img: '' };
      const dt = new Date(a.created_at);
      const dateStr = `${dt.getMonth() + 1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      return `
        <div class="mc">
          <div class="mc-top">
            <div>
              <div class="mc-name"><span style="color:#999; font-weight:600; margin-right:6px;">#${no}</span>${a.name}</div>
              <div class="mc-empno">${a.empno} · ${dateStr}</div>
            </div>
            <span class="status-badge sb-${a.status}">${STATUS_LABEL[a.status] || a.status}</span>
          </div>
          <div class="mc-row"><span class="k">휴대폰</span><span class="v">${a.phone}</span></div>
          <div class="mc-row"><span class="k">통신사</span><span class="v">
            <span class="carrier-tag ct-${a.currentCarrier}">${a.currentCarrier}</span>
            <span class="arrow">→</span>
            <span class="carrier-tag ct-${a.moveCarrier}">${a.moveCarrier}</span>
          </span></div>
          <div class="mc-row"><span class="k">사은품</span><span class="v">${g.name}${a.color ? ' / ' + escapeHtml(a.color) : ''}</span></div>
          <div class="mc-row"><span class="k">결합</span><span class="v">${a.combo ? '<span class="combo-yes">현금 추가</span>' : '<span class="combo-no">미신청</span>'}</span></div>
          <div class="mc-actions">
            ${currentFilter === 'trash' ? `
              <button class="restore" onclick="restoreApp('${a.id}')">복원</button>
              <button class="detail" onclick="openDetail('${a.id}')">상세</button>
              <button class="delete" onclick="permanentDelete('${a.id}')">영구삭제</button>
            ` : `
              <select onchange="updateStatus('${a.id}', this.value)">
                ${STATUS.map(s => `<option value="${s}" ${a.status === s ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
              </select>
              <button class="detail" onclick="openDetail('${a.id}')">상세</button>
              <button class="delete" onclick="deleteApp('${a.id}')">삭제</button>
            `}
          </div>
        </div>
      `;
    }).join('');
  }

  function renderPagination(total) {
    const el = document.getElementById('pagination');
    const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
    if (total === 0) { el.innerHTML = ''; return; }

    let buttons = '';
    buttons += `<button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>«</button>`;
    buttons += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹ 이전</button>`;

    // 페이지 버튼들 (현재 ±2)
    const startP = Math.max(1, currentPage - 2);
    const endP = Math.min(totalPages, currentPage + 2);
    for (let p = startP; p <= endP; p++) {
      buttons += `<button onclick="goToPage(${p})" class="${p === currentPage ? 'active' : ''}">${p}</button>`;
    }

    buttons += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>다음 ›</button>`;
    buttons += `<button onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>»</button>`;
    buttons += `<span class="page-info">${currentPage} / ${totalPages} (총 ${total}건)</span>`;
    el.innerHTML = buttons;
  }

  function goToPage(p) {
    const totalPages = Math.max(1, Math.ceil(cache.length / PER_PAGE));
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setFilter(key) {
    currentPage = 1;
    currentFilter = key;
    // 통계 카드 클릭 시 상태 dropdown 동기화
    const ss = document.getElementById('filterStatus');
    if (ss) {
      if (key === 'all' || key === 'trash') ss.value = 'all';
      else if (['pending', 'contacted', 'completed', 'cancelled'].includes(key)) ss.value = key;
    }
    load();
  }
  window.goToPage = goToPage;

  document.getElementById('search').addEventListener('input', (e) => {
    currentQuery = e.target.value.trim();
    currentPage = 1;
    clearTimeout(window._st);
    window._st = setTimeout(load, 250);
  });

  // 필터 변경 시 클라이언트 사이드 즉시 적용
  ['filterStatus', 'filterCombo', 'filterGift', 'filterCarrier', 'filterPeriod'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      currentPage = 1;
      renderPage();
    });
  });
  document.getElementById('filterReset').addEventListener('click', () => {
    document.getElementById('filterStatus').value = 'all';
    document.getElementById('filterCombo').value = 'all';
    document.getElementById('filterGift').value = 'all';
    document.getElementById('filterCarrier').value = 'all';
    document.getElementById('filterPeriod').value = 'all';
    document.getElementById('search').value = '';
    currentQuery = '';
    currentPage = 1;
    load();
  });

  document.getElementById('refreshBtn').addEventListener('click', load);

  // Auto refresh
  let timer = null;
  function setupAutoRefresh() {
    if (timer) clearInterval(timer);
    if (document.getElementById('autoRefresh').checked) {
      timer = setInterval(load, 30000);
    }
  }
  document.getElementById('autoRefresh').addEventListener('change', setupAutoRefresh);

  async function updateStatus(id, status) {
    await fetch(`/api/special-promo/${id}`, {
      method: 'PATCH',
      headers: authHeaders(),
      body: JSON.stringify({ status })
    });
    load();
  }

  async function deleteApp(id) {
    if (!confirm('휴지통으로 이동하시겠습니까? (복원 가능)')) return;
    await fetch(`/api/special-promo/${id}`, { method: 'DELETE', headers: authHeaders() });
    load();
  }
  async function permanentDelete(id) {
    if (!confirm('영구 삭제됩니다. 복원할 수 없습니다. 계속하시겠습니까?')) return;
    await fetch(`/api/special-promo/${id}?permanent=1`, { method: 'DELETE', headers: authHeaders() });
    load();
  }
  async function restoreApp(id) {
    await fetch(`/api/special-promo/${id}/restore`, { method: 'POST', headers: authHeaders() });
    load();
  }

  function openDetail(id) {
    const a = cache.find(x => x.id === id);
    if (!a) return;
    const g = GIFT_LABELS[a.gift] || { name: a.gift };
    const ag = a.agreements || {};
    const yes = (v) => v ? '✅ 동의' : '❌ 미동의';
    const body = document.getElementById('modalBody');
    body.innerHTML = `
      <div class="field-pair"><span class="k">신청번호</span><span class="v">${a.id}</span></div>
      <div class="field-pair"><span class="k">접수일시</span><span class="v">${new Date(a.created_at).toLocaleString('ko-KR')}</span></div>
      <div class="field-pair"><span class="k">최종 수정일시</span><span class="v">${new Date(a.updated_at).toLocaleString('ko-KR')}</span></div>

      <div style="margin:18px 0 10px; font-size:11px; font-weight:800; letter-spacing:2px; color:#888;">신청 정보</div>
      <div class="field-pair"><span class="k">1. 현재 통신사</span><span class="v">${a.currentCarrier}</span></div>
      <div class="field-pair"><span class="k">2. 이동할 통신사</span><span class="v">${a.moveCarrier}</span></div>
      <div class="field-pair"><span class="k">3. 휴대폰 번호</span><span class="v">${a.phone}</span></div>
      <div class="field-pair"><span class="k">4. 이름</span><span class="v">${a.name}</span></div>
      <div class="field-pair"><span class="k">5. 사은품 종류</span><span class="v">${g.name} <small style="color:#888">(${a.gift})</small></span></div>
      <div class="field-pair"><span class="k">5-1. 색상</span><span class="v">${a.color || '<span style=\"color:#999\">미선택</span>'}</span></div>
      <div class="field-pair"><span class="k">6. 인터넷+TV 결합</span><span class="v">${a.combo ? '✅ 신청 (현금 사은품 별도, 가입 상품별 상이)' : '❌ 미신청'}</span></div>
      <div class="field-pair"><span class="k">6-1. 예금주</span><span class="v">${a.accountHolder ? escapeHtml(a.accountHolder) : '<span style=\"color:#999\">미입력</span>'}</span></div>
      <div class="field-pair"><span class="k">6-2. 은행</span><span class="v">${a.bank ? escapeHtml(a.bank) : '<span style=\"color:#999\">미입력</span>'}</span></div>
      <div class="field-pair"><span class="k">6-3. 계좌번호</span><span class="v">${a.account ? escapeHtml(a.account) : '<span style=\"color:#999\">미입력</span>'}</span></div>
      <div class="field-pair"><span class="k">7. 배송지 주소</span><span class="v">${a.zonecode ? '['+escapeHtml(a.zonecode)+'] ' : ''}${escapeHtml(a.address)}${a.addressDetail ? ' ' + escapeHtml(a.addressDetail) : ''}</span></div>
      <div class="field-pair"><span class="k">8. 사원번호</span><span class="v">${a.empno}</span></div>

      <div style="margin:18px 0 10px; font-size:11px; font-weight:800; letter-spacing:2px; color:#888;">개인정보 동의</div>
      <div class="field-pair"><span class="k">필수 - 개인정보 수집·이용</span><span class="v">${yes(ag.privacy)}</span></div>
      <div class="field-pair"><span class="k">필수 - 임직원 본인 명의</span><span class="v">${yes(ag.emp)}</span></div>
      <div class="field-pair"><span class="k">필수 - 제3자 제공</span><span class="v">${yes(ag.thirdparty)}</span></div>
      <div class="field-pair"><span class="k">선택 - 마케팅 활용</span><span class="v">${yes(ag.marketing)}</span></div>

      <div style="margin:18px 0 10px; font-size:11px; font-weight:800; letter-spacing:2px; color:#888;">상태 / 메모</div>
      <div class="field-pair"><span class="k">현재 상태</span><span class="v">${STATUS_LABEL[a.status] || a.status}</span></div>
      <div class="field-pair"><span class="k">메모</span><span class="v"><textarea class="modal-memo" id="memoEdit">${escapeHtml(a.memo || '')}</textarea><br><button class="btn btn-sm btn-primary" style="margin-top:8px" onclick="saveMemo('${a.id}')">메모 저장</button></span></div>
    `;
    document.getElementById('modal').classList.add('show');
  }

  async function saveMemo(id) {
    const memo = document.getElementById('memoEdit').value;
    await fetch(`/api/special-promo/${id}`, {
      method: 'PATCH',
      headers: authHeaders(),
      body: JSON.stringify({ memo })
    });
    closeModal();
    load();
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
  });

  // CSV export
  document.getElementById('exportBtn').addEventListener('click', () => {
    if (!cache.length) return alert('내보낼 데이터가 없습니다');
    const headers = ['접수일', '신청번호', '사번', '이름', '휴대폰', '현재', '이동', '사은품', '인터넷+TV', '배송지', '상태', '메모'];
    const rows = cache.map(a => [
      new Date(a.created_at).toLocaleString('ko-KR'),
      a.id, a.empno, a.name, a.phone,
      a.currentCarrier, a.moveCarrier,
      (GIFT_LABELS[a.gift] || {}).name || a.gift,
      a.combo ? '신청' : '',
      a.address,
      STATUS_LABEL[a.status],
      (a.memo || '').replace(/\n/g, ' '),
    ]);
    const csv = '﻿' + [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `special-applications_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
  });

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function truncate(s, n) { return (s || '').length > n ? (s.slice(0, n) + '…') : s; }

  // load() 와 setupAutoRefresh()는 attemptLogin 성공 시 호출됨
</script>
</body>
</html>
