<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>📞 상담사 도구</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#0e1320;height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:280px 1fr 360px;height:100vh}
.left{background:#fff;border-right:2px solid #e5e7eb;padding:14px 12px;overflow-y:auto;font-size:13px;color:#1a1a1a}
.left h2{font-size:14px;font-weight:900;margin-bottom:8px;color:#1a2744}
.left input,.left textarea{width:100%;padding:8px 10px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:6px}
.left textarea{min-height:60px;resize:vertical}
.left .lab{font-size:11px;color:#6b7280;font-weight:700;margin:6px 0 3px}
.left .sc{background:#f8f9fc;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.5;color:#1a2744;margin-bottom:6px}
.left .sc .ttl{font-weight:900;color:#2563eb;margin-bottom:3px}
.center{position:relative;background:#0a0f1a}
.center iframe{width:100%;height:100vh;border:0;display:block}
.right{background:#1a2744;color:#fff;padding:16px;overflow-y:auto;display:flex;flex-direction:column;border-left:2px solid #0a0f1a;font-size:13px}
.right h2{font-size:13px;font-weight:700;color:#a5c4f2;margin-bottom:10px;letter-spacing:0.5px}
.right .quote{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:14px;margin-bottom:10px;line-height:1.65;font-size:12.5px}
.right .quote .calc-line{display:flex;justify-content:space-between;padding:4px 0}
.right .quote .calc-line .l{color:#d4e6f7;flex:1}
.right .quote .calc-line .v{color:#fff;font-weight:700}
.right .quote .calc-line.discount .v{color:#86efac}
.right .quote .calc-line.sub{font-size:11px;color:#a5c4f2;padding:2px 0}
.right .quote .calc-line.sub .l{color:#a5c4f2}
.right .quote .calc-line.total{border-top:1.5px solid rgba(255,255,255,0.2);margin-top:6px;padding-top:8px;font-size:14px;font-weight:900}
.right .quote .calc-line.total .v{color:#4ade80;font-size:18px}
.right .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.right .acts .b{padding:11px 0;border-radius:8px;font-size:12.5px;font-weight:900;cursor:pointer;border:none}
.right .acts .b.cp{background:#fff;color:#1a2744}
.right .acts .b.pr{background:rgba(255,255,255,0.1);color:#d4e6f7;border:1px solid rgba(255,255,255,0.2)}
.right .acts .b.sd{background:#10b981;color:#fff;grid-column:span 2}
@media (max-width:1280px){.app{grid-template-columns:240px 1fr 320px}}
</style>
</head>
<body>
<div class="app">

<aside class="left">
  <h2>👤 고객 정보</h2>
  <div class="lab">이름 / 휴대폰</div>
  <input id="cn" placeholder="홍길동">
  <input id="cp" placeholder="010-0000-0000">
  <div class="lab">상담사</div>
  <input id="ca" placeholder="상담사">
  <h2 style="margin-top:10px;border-top:1px solid #e5e7eb;padding-top:8px">📜 상담 스크립트</h2>
  <div class="sc"><div class="ttl">① 인사</div>안녕하세요 봉이모바일입니다.<br>인터넷+TV 상담 도와드릴게요.</div>
  <div class="sc"><div class="ttl">② 정보 확인</div>현재 통신사? 휴대폰 결합 가능?<br>인터넷 가입 몇 년 되셨나요?</div>
  <div class="sc"><div class="ttl">③ 견적 안내</div>월 [금액]원, 페이백 [만원]만원 별도</div>
  <div class="sc"><div class="ttl">④ 마무리</div>이 상품으로 진행 도와드릴까요?<br>설치 주중/주말 (주말 +25%) 가능</div>
  <div class="lab">📝 메모</div>
  <textarea id="cm" placeholder="상담 메모..."></textarea>
</aside>

<main class="center">
  <iframe id="v1" src="calculator.html"></iframe>
</main>

<aside class="right">
  <h2>💰 실시간 견적 (v1 동기화)</h2>
  <div class="quote" id="q"><div style="opacity:0.5">왼쪽에서 옵션 선택</div></div>
  <div class="acts">
    <button class="b cp" onclick="cp()">📋 복사</button>
    <button class="b pr" onclick="window.print()">🖨️ 인쇄</button>
    <button class="b sd">📞 견적 발송</button>
  </div>
</aside>

</div>

<script>
(function(){
  var f = document.getElementById('v1');
  var q = document.getElementById('q');
  function mirror(){
    try{
      var src = f.contentWindow.document.getElementById('c-result');
      if (src && src.innerHTML.trim()) q.innerHTML = src.innerHTML;
    }catch(e){}
  }
  f.addEventListener('load', function(){
    setTimeout(mirror, 200);
    try{
      var src = f.contentWindow.document.getElementById('c-result');
      if (src) new MutationObserver(mirror).observe(src, {childList:true, subtree:true, characterData:true});
    }catch(e){}
    var n=0,iv=setInterval(function(){mirror();if(++n>40)clearInterval(iv);},250);
  });
})();
function cp(){
  var n=document.getElementById('cn').value||'',p=document.getElementById('cp').value||'',memo=document.getElementById('cm').value||'';
  var t=document.getElementById('q').textContent.replace(/\s+/g,' ').trim();
  var s='【봉이모바일 견적】\n고객: '+n+' '+p+'\n\n'+t+(memo?'\n\n메모: '+memo:'');
  navigator.clipboard.writeText(s).then(function(){alert('복사됨')}).catch(function(){alert(s)});
}
</script>
</body>
</html>
