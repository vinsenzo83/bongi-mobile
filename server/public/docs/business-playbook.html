<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>봉이모바일 비즈니스 플레이북</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e2a;
    --border: #252a38;
    --accent: #4f8ef7;
    --accent2: #f7c94f;
    --accent3: #4ff7a0;
    --danger: #f7634f;
    --text: #e2e6f0;
    --text2: #8a93aa;
    --text3: #5a6278;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans KR', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
  }

  /* SIDEBAR */
  #sidebar {
    width: 260px;
    min-height: 100vh;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    position: fixed;
    top: 0; left: 0;
    display: flex;
    flex-direction: column;
    z-index: 100;
    overflow-y: auto;
  }

  .sidebar-header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-logo {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .sidebar-title {
    font-size: 15px;
    font-weight: 900;
    color: var(--text);
    line-height: 1.3;
  }

  .sidebar-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 4px;
    font-family: var(--mono);
  }

  .sidebar-nav {
    padding: 12px 0;
    flex: 1;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 3px solid transparent;
    font-size: 13px;
    color: var(--text2);
    user-select: none;
  }

  .nav-item:hover {
    background: var(--bg3);
    color: var(--text);
  }

  .nav-item.active {
    background: rgba(79,142,247,0.08);
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 600;
  }

  .nav-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    width: 20px;
    flex-shrink: 0;
  }

  .nav-item.active .nav-num { color: var(--accent); }

  /* MAIN */
  #main {
    margin-left: 260px;
    flex: 1;
    min-height: 100vh;
  }

  /* TOP BAR */
  .topbar {
    position: sticky;
    top: 0;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 50;
  }

  .topbar-breadcrumb {
    font-size: 13px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .topbar-breadcrumb span {
    color: var(--text);
    font-weight: 600;
  }

  .progress-bar {
    height: 2px;
    background: var(--border);
    width: 160px;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    transition: width 0.3s;
    border-radius: 2px;
  }

  /* CONTENT */
  #content {
    padding: 48px 56px 80px;
    max-width: 920px;
  }

  /* SECTION */
  .section {
    display: none;
    animation: fadeIn 0.25s ease;
  }

  .section.visible { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* SECTION HEADER */
  .sec-header {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .sec-num {
    font-family: var(--mono);
    font-size: 48px;
    font-weight: 600;
    color: var(--border);
    line-height: 1;
    flex-shrink: 0;
    margin-top: -4px;
  }

  .sec-info h2 {
    font-size: 26px;
    font-weight: 900;
    line-height: 1.2;
    color: var(--text);
  }

  .sec-tag {
    display: inline-block;
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 4px;
    background: rgba(79,142,247,0.12);
    color: var(--accent);
    letter-spacing: 1px;
  }

  /* CARDS */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 16px;
  }

  /* DIAGRAM BOX */
  .diagram {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.8;
    color: var(--text2);
    white-space: pre;
    overflow-x: auto;
    margin-bottom: 20px;
  }

  /* KEY POINT */
  .keypoint {
    background: rgba(79,142,247,0.08);
    border: 1px solid rgba(79,142,247,0.2);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 16px 20px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 20px;
  }

  .keypoint strong {
    color: var(--accent);
  }

  /* LIST */
  .item-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }

  .item-list li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text2);
  }

  .item-list li::before {
    content: '▸';
    color: var(--accent);
    flex-shrink: 0;
    margin-top: 1px;
    font-size: 12px;
  }

  /* GRID */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }

  .stat-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }

  .stat-val {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--accent2);
    line-height: 1.2;
  }

  .stat-label {
    font-size: 12px;
    color: var(--text3);
    margin-top: 4px;
  }

  /* BADGE */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
  }

  .badge-blue { background: rgba(79,142,247,0.15); color: var(--accent); }
  .badge-yellow { background: rgba(247,201,79,0.15); color: var(--accent2); }
  .badge-green { background: rgba(79,247,160,0.15); color: var(--accent3); }
  .badge-red { background: rgba(247,99,79,0.15); color: var(--danger); }

  /* FLOW */
  .flow {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .flow-step {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }

  .flow-arrow {
    color: var(--text3);
    font-size: 16px;
  }

  /* TABLE */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 20px;
  }

  .data-table th {
    background: var(--bg3);
    color: var(--text2);
    font-weight: 600;
    padding: 10px 14px;
    text-align: left;
    border: 1px solid var(--border);
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  .data-table td {
    padding: 10px 14px;
    border: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
    line-height: 1.6;
  }

  .data-table tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

  /* NAV BTNS */
  .nav-btns {
    display: flex;
    justify-content: space-between;
    margin-top: 48px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text2);
    font-size: 13px;
    font-family: var(--sans);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }

  .btn:hover { background: var(--bg3); color: var(--text); border-color: var(--accent); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn:disabled:hover { background: var(--bg2); color: var(--text2); border-color: var(--border); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .btn-primary:hover { background: #6ba3fa; color: #fff; }

  /* H3 */
  .subsection-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent3);
    margin-bottom: 12px;
    margin-top: 28px;
    letter-spacing: 0.5px;
  }

  /* tag list */
  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .tag {
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--text2);
  }

  .highlight { color: var(--accent2); font-weight: 700; }
  .green { color: var(--accent3); }
  .red { color: var(--danger); }

  p { font-size: 14px; color: var(--text2); line-height: 1.8; margin-bottom: 14px; }

  /* SECTION 0 SPECIAL */
  .vision-hero {
    background: linear-gradient(135deg, rgba(79,142,247,0.06) 0%, rgba(79,247,160,0.04) 100%);
    border: 1px solid rgba(79,142,247,0.2);
    border-radius: 14px;
    padding: 36px 40px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .vision-hero::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(79,142,247,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .vision-hero-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .vision-hero-title {
    font-size: 28px;
    font-weight: 900;
    line-height: 1.4;
    color: var(--text);
    margin-bottom: 20px;
  }
  .vision-hero-title em {
    font-style: normal;
    color: var(--accent2);
  }
  .vision-hero-desc {
    font-size: 15px;
    color: var(--text2);
    line-height: 1.9;
  }

  .phase-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    margin-bottom: 28px;
  }
  .phase-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 22px 20px;
    position: relative;
  }
  .phase-card:first-child { border-radius: 10px 0 0 10px; }
  .phase-card:last-child { border-radius: 0 10px 10px 0; }
  .phase-card.active {
    background: rgba(79,142,247,0.07);
    border-color: rgba(79,142,247,0.3);
    z-index: 1;
  }
  .phase-card.future {
    background: rgba(79,247,160,0.04);
    border-color: rgba(79,247,160,0.2);
  }
  .phase-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text3);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .phase-card.active .phase-label { color: var(--accent); }
  .phase-card.future .phase-label { color: var(--accent3); }
  .phase-num {
    font-family: var(--mono);
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    margin-bottom: 6px;
  }
  .phase-unit {
    font-size: 12px;
    color: var(--text3);
    margin-bottom: 12px;
  }
  .phase-tags {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .phase-tag-item {
    font-size: 12px;
    color: var(--text2);
    padding: 4px 0;
    border-top: 1px solid var(--border);
  }
  .phase-card.active .phase-tag-item { border-color: rgba(79,142,247,0.15); }
  .phase-card.future .phase-tag-item { border-color: rgba(79,247,160,0.1); }

  .biz-expand {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .biz-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 14px;
    text-align: center;
    transition: all 0.2s;
  }
  .biz-item:hover { border-color: var(--accent); transform: translateY(-2px); }
  .biz-icon { font-size: 22px; margin-bottom: 8px; }
  .biz-name { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .biz-desc { font-size: 11px; color: var(--text3); line-height: 1.5; }
  .biz-item.core { border-color: rgba(247,201,79,0.35); background: rgba(247,201,79,0.04); }
  .biz-item.phase2 { border-color: rgba(79,142,247,0.25); }
  .biz-item.phase3 { border-color: rgba(79,247,160,0.2); }

  .why-box {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .why-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .why-icon {
    font-size: 20px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .why-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 5px;
  }
  .why-desc {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.7;
  }

  .moat-line {
    display: flex;
    align-items: stretch;
    gap: 0;
    margin-bottom: 28px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .moat-step {
    flex: 1;
    padding: 18px 16px;
    background: var(--bg3);
    border-right: 1px solid var(--border);
    position: relative;
  }
  .moat-step:last-child { border-right: none; }
  .moat-step-num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    margin-bottom: 6px;
  }
  .moat-step-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
  }
  .moat-step-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 4px;
    line-height: 1.5;
  }
  .moat-arrow {
    display: flex;
    align-items: center;
    padding: 0 2px;
    background: var(--bg3);
    color: var(--accent);
    font-size: 14px;
    border-right: 1px solid var(--border);
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">🐟 봉이모바일</div>
    <div class="sidebar-title">비즈니스<br>플레이북</div>
    <div class="sidebar-sub">v1.0 · 2026-03-20</div>
  </div>
  <div class="sidebar-nav" id="navList"></div>
</nav>

<!-- MAIN -->
<div id="main">
  <div class="topbar">
    <div class="topbar-breadcrumb">
      봉이모바일 / <span id="topbarTitle">개요</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span style="font-size:12px;color:var(--text3);font-family:var(--mono);" id="progressText">1 / 15</span>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:6.67%"></div>
      </div>
    </div>
  </div>

  <div id="content"></div>
</div>

<script>
const sections = [
  {
    id: 0,
    title: "한눈에 보기",
    tag: "INTRO",
    render: () => `
      <div class="vision-hero">
        <div class="vision-hero-label">봉이모바일 — 사업 개요</div>
        <div class="vision-hero-title">
          광주/전라에 <em>8개 직영 매장</em>을 가진<br>
          휴대폰 판매점이 <em>전국 생활 인프라</em>가 되는 이야기
        </div>
        <div class="vision-hero-desc">
          우리는 매년 <strong style="color:var(--text)">6만 명</strong>이 찾아오는 오프라인 거점을 이미 가지고 있다.<br>
          여기에 플랫폼과 AI를 얹으면, 통신을 넘어 <strong style="color:var(--text)">어떤 생활 서비스도 팔 수 있는 구조</strong>가 된다.<br>
          매장이 늘수록 플랫폼이 커지고, 플랫폼이 커질수록 매장이 늘어난다.
        </div>
      </div>

      <div class="subsection-title">📍 지금 → 중간 → 끝</div>
      <div class="phase-row">
        <div class="phase-card active">
          <div class="phase-label">▶ 지금 · START</div>
          <div class="phase-num">8</div>
          <div class="phase-unit">개 직영 매장</div>
          <div class="phase-tags">
            <div class="phase-tag-item">연 6만명 무료 유입</div>
            <div class="phase-tag-item">인터넷 · 렌탈 · 알뜰폰</div>
            <div class="phase-tag-item">AI + CRM + 플랫폼 구축</div>
            <div class="phase-tag-item">1년차 목표 매출 30억</div>
          </div>
        </div>
        <div class="phase-card">
          <div class="phase-label">→ 성장 · SCALE</div>
          <div class="phase-num">50+</div>
          <div class="phase-unit">개 매장 · 전라/충청 확장</div>
          <div class="phase-tags">
            <div class="phase-tag-item">플랫폼 고객 수십만명</div>
            <div class="phase-tag-item">생활 서비스 2차 확장</div>
            <div class="phase-tag-item">AI 정밀도 본격화</div>
            <div class="phase-tag-item">3년차 목표 매출 257억</div>
          </div>
        </div>
        <div class="phase-card future">
          <div class="phase-label">✦ 끝 · ENDGAME</div>
          <div class="phase-num">200<span style="font-size:18px;">~300</span></div>
          <div class="phase-unit">개 매장 · 전국 거점 네트워크</div>
          <div class="phase-tags">
            <div class="phase-tag-item">오프라인 인프라 자산화</div>
            <div class="phase-tag-item">금융 · 물류 · 헬스케어</div>
            <div class="phase-tag-item">어떤 사업도 가능한 구조</div>
            <div class="phase-tag-item">5년차 목표 매출 1,000억</div>
          </div>
        </div>
      </div>

      <div class="subsection-title">💡 왜 지금 가능한가</div>
      <div class="why-box">
        <div class="why-item">

// Build sidebar nav
const navList = document.getElementById('navList');
sections.forEach((s, i) => {
  const item = document.createElement('div');
  item.className = 'nav-item' + (i === 0 ? ' active' : '');
  item.dataset.idx = i;
  item.innerHTML = `<span class="nav-num">${String(s.id).padStart(2,'0')}</span>${s.title}`;
  item.addEventListener('click', () => showSection(i));
  navList.appendChild(item);
});

// Build content
const content = document.getElementById('content');
sections.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'section' + (i === 0 ? ' visible' : '');
  div.id = 'sec-' + i;
  div.innerHTML = `
    <div class="sec-header">
      <div class="sec-num">${String(s.id).padStart(2,'0')}</div>
      <div class="sec-info">
        <h2>${s.title}</h2>
        <span class="sec-tag">${s.tag}</span>
      </div>
    </div>
    ${s.render()}
    <div class="nav-btns">
      <button class="btn" onclick="showSection(${i-1})" ${i===0?'disabled':''}>← 이전</button>
      <button class="btn btn-primary" onclick="showSection(${i+1})" ${i===sections.length-1?'disabled':''}>다음 →</button>
    </div>
  `;
  content.appendChild(div);
});

let current = 0;

function showSection(idx) {
  if (idx < 0 || idx >= sections.length) return;
  document.querySelectorAll('.section').forEach(s => s.classList.remove('visible'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('sec-' + idx).classList.add('visible');
  document.querySelectorAll('.nav-item')[idx].classList.add('active');
  document.getElementById('topbarTitle').textContent = sections[idx].title;
  document.getElementById('progressText').textContent = `${idx+1} / ${sections.length}`;
  document.getElementById('progressFill').style.width = `${((idx+1)/sections.length)*100}%`;
  window.scrollTo(0, 0);
  current = idx;
}

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') showSection(current + 1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') showSection(current - 1);
});
</script>
