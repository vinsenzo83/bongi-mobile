<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>봉이모바일 — 인터넷 요금 계산기 v2</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans KR',-apple-system,sans-serif; background:#f8f9fc; color:#1a1a1a; line-height:1.6; padding-bottom:180px; }
.wrap { max-width:980px; margin:0 auto; padding:30px 24px; }
h1 { font-size:24px; font-weight:900; color:#1a2744; margin-bottom:6px; }
.subtitle { font-size:12px; color:#888; margin-bottom:28px; }
.field { margin-bottom:28px; }
.field-label { display:inline-block; font-size:14px; font-weight:800; color:#1a2744; min-width:72px; vertical-align:top; margin-right:16px; padding-top:28px; }
.field-body { display:inline-block; width:calc(100% - 100px); vertical-align:top; }
.card-row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.select-card { position:relative; background:#fff; border:1.5px solid #e2ddd6; border-radius:12px; padding:22px 20px; text-align:center; cursor:pointer; transition:all 0.15s; min-height:110px; display:flex; flex-direction:column; justify-content:center; }
.select-card:hover { border-color:#93c5fd; }
.select-card.selected { border:2px solid #2563eb; background:linear-gradient(135deg,#eff6ff,#fff); box-shadow:0 4px 12px rgba(37,99,235,0.12); }
.select-card .logo { font-size:20px; font-weight:900; color:#1a2744; margin-bottom:6px; }
.select-card .name { font-size:14px; font-weight:600; color:#555; }
.speed-card { text-align:left; padding:20px 22px; min-height:140px; }
.speed-card .big { font-size:24px; font-weight:900; color:#1a2744; margin-bottom:4px; }
.speed-card .big small { font-size:14px; font-weight:700; color:#2563eb; margin-left:4px; }
.speed-card .desc { font-size:13px; color:#555; margin-bottom:2px; }
.speed-card .desc-sub { font-size:11px; color:#999; margin-bottom:14px; }
.speed-card .price { font-size:16px; font-weight:700; color:#2563eb; margin-top:auto; }
.speed-card .badge-reco { position:absolute; top:10px; right:10px; background:#ef4444; color:#fff; font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; }
.option-row { display:flex; gap:24px; padding:16px 20px; background:#fff; border:1.5px solid #e2ddd6; border-radius:12px; margin-top:8px; flex-wrap:wrap; }
.option-row label { display:flex; align-items:center; gap:8px; font-size:13px; color:#333; cursor:pointer; }
.option-row input[type="checkbox"] { width:18px; height:18px; accent-color:#2563eb; cursor:pointer; }
.sub-field { margin-top:14px; background:#fff; border:1.5px solid #e2ddd6; border-radius:12px; padding:14px 18px; }
.sub-field-label { font-size:11px; font-weight:700; color:#888; margin-bottom:6px; letter-spacing:1px; }
.sub-select { width:100%; padding:10px 12px; border:1.5px solid #e2ddd6; border-radius:8px; font-size:13px; font-family:inherit; background:#fff; color:#1a1a1a; cursor:pointer; }
.card-grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }

/* 하단 고정 바 */
.bottom-bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid #e2ddd6; box-shadow:0 -4px 20px rgba(0,0,0,0.06); padding:14px 0; z-index:100; }
.bottom-inner { max-width:980px; margin:0 auto; padding:0 24px; display:flex; align-items:center; gap:16px; }
.bb-info { flex:1; display:flex; flex-direction:column; gap:3px; font-size:13px; }
.bb-line { display:flex; justify-content:space-between; }
.bb-line .l { color:#666; }
.bb-line .v { font-weight:600; color:#333; }
.bb-final { font-size:18px; font-weight:900; color:#2563eb; border-top:1.5px solid #e2ddd6; padding-top:6px; margin-top:4px; }
.bb-final .v { color:#ef4444; font-size:22px; }
.bb-gift { font-size:11px; color:#d97706; font-weight:700; margin-top:2px; }
.bb-btn { padding:14px 22px; border-radius:10px; font-size:14px; font-weight:800; cursor:pointer; border:none; white-space:nowrap; }
.bb-btn-line { background:#fff; border:1.5px solid #2563eb; color:#2563eb; }
.bb-btn-primary { background:#2563eb; color:#fff; }

.v2-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.v2-badge { background:#fef3c7; color:#d97706; font-size:11px; font-weight:800; padding:4px 10px; border-radius:12px; }
.v1-link { font-size:12px; color:#2563eb; text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">

<div class="v2-header">
  <div>
    <h1>원하시는 상품을 선택해주세요 <span class="v2-badge">v2 · BETA</span></h1>
    <div class="subtitle">카드 클릭 → 자동 계산 · 하단 요금 실시간 업데이트</div>
  </div>
  <a href="calculator.html" class="v1-link">← v1 (상세 모드)</a>
</div>

<!-- 통신사 -->
<div class="field">
  <div class="field-label">통신사</div>
  <div class="field-body">
    <div class="card-row" id="f-carrier"></div>
  </div>
</div>

<!-- 인터넷 속도 -->
<div class="field">
  <div class="field-label">인터넷</div>
  <div class="field-body">
    <div class="card-row" id="f-speed"></div>
  </div>
</div>

<!-- 옵션 체크 -->
<div class="field">
  <div class="field-label">옵션</div>
  <div class="field-body">
    <div class="option-row">
      <label><input type="checkbox" id="f-tv-on"> 📺 TV와 함께</label>
      <label><input type="checkbox" id="f-mobile-on" checked> 📱 휴대폰 결합 (⭐ 권장)</label>
      <label><input type="checkbox" id="f-wifi"> 📡 WiFi 추가</label>
    </div>

    <!-- TV 선택 (체크 시) -->
    <div class="sub-field" id="f-tv-field" style="display:none">
      <div class="sub-field-label">TV 상품</div>
      <select class="sub-select" id="f-tv"></select>
    </div>

    <!-- 휴대폰 결합 (체크 시) -->
    <div class="sub-field" id="f-mobile-field">
      <div class="sub-field-label">휴대폰 결합 상세</div>
      <div class="card-grid-2">
        <div>
          <div class="sub-field-label">결합 인원 / 회선수</div>
          <select class="sub-select" id="f-lines"></select>
        </div>
        <div id="f-range-wrap" style="display:none">
          <div class="sub-field-label">월 요금 합산</div>
          <select class="sub-select" id="f-range"></select>
        </div>
      </div>
    </div>
  </div>
</div>

</div>

<!-- 하단 고정 요금 바 -->
<div class="bottom-bar">
  <div class="bottom-inner">
    <div class="bb-info" id="bb-info"></div>
    <button class="bb-btn bb-btn-line">가입 신청</button>
    <button class="bb-btn bb-btn-primary">📞 전문상담 연결</button>
  </div>
</div>

<script>
// 데이터 (calculator.html D 객체 축약)
var D = {
  skt: {
    name:'SKT', logo:'SK', color:'#ef4444',
    internet:{'100M':22000,'500M':33000,'1G':38500},
    wifiCost:1100, setTop:4400, setTopName:'스마트3',
    tvInternetNoWifi:{'100M':19800,'500M':27500,'1G':33000},
    tvInternetWithWifi:{'100M':22000,'500M':28600,'1G':34100},
    tv:[
      {n:'TV 없음',p:0,dc:0},
      {n:'B tv 이코노미',p:12100,dc:2200},
      {n:'B tv 스탠다드',p:15400,dc:2200},
      {n:'B tv 올',p:18700,dc:2200},
      {n:'B tv 올 넷플릭스',p:30200,dc:2200}
    ],
    gift:{solo:{'100M':110000,'500M':170000,'1G':170000},combo:{'100M':400000,'500M':430000,'1G':490000}},
    bundle:{family:{internet:{'100M':4400,'500M':11000,'1G':13200},iptv:1100,
      mobilePerBySpeed:{
        '100M':{1:3500,2:3500,3:6000,4:4500,5:3600},
        '500M':{1:3500,2:3500,3:6000,4:6000,5:4800},
        '1G':{1:3500,2:3500,3:6000,4:4500,5:3600}
      }}}
  },
  kt: {
    name:'KT', logo:'kt', color:'#2563eb',
    internet:{'100M':22000,'500M':33000,'1G':38500},
    wifiPrice:{'100M':1100,'500M':1100,'1G':0},
    setTop:4400, setTopName:'기가지니3',
    tvInternetNoWifi:{'100M':22000,'500M':27500,'1G':33000},
    tvInternetWithWifi:{'100M':23100,'500M':28600,'1G':33000},
    tv:[
      {n:'TV 없음',p:0,dc:0},
      {n:'지니TV 베이직',p:14740,dc:2640},
      {n:'지니TV 라이트',p:15840,dc:2640},
      {n:'지니TV 에센스',p:20240,dc:3740},
      {n:'지니TV 모든G',p:21340,dc:4400}
    ],
    gift:{solo:{'100M':90000,'500M':140000,'1G':140000},combo:{'100M':370000,'500M':450000,'1G':450000}},
    bundle:{total:{
      internet:{'100M':[1650,3300,5500,5500,5500,5500],'500M':[2200,5500,5500,5500,5500,5500],'1G':[2200,5500,5500,5500,5500,5500]},
      mobile:{'100M':[0,0,3300,14300,18700,23100],'500M':[0,0,5500,16610,22110,27610],'1G':[0,0,5500,16610,22110,27610]}
    }, ranges:['22,000원 이하','22,000원 이상','64,900원 이상','108,900원 이상','141,900원 이상','174,900원 이상']}
  },
  lgu: {
    name:'LG U+', logo:'LG', color:'#e40981',
    internet:{'100M':22000,'500M':33000,'1G':38500},
    wifiCost:0, setTop:4400, setTopName:'U+tv UHD4',
    tvInternetNoWifi:{'100M':22000,'500M':27500,'1G':33000},
    tvInternetWithWifi:{'100M':22000,'500M':27500,'1G':33000},
    tv:[
      {n:'TV 없음',p:0,dc:0},
      {n:'U+tv 실속형',p:15400,dc:2200},
      {n:'U+tv 기본형',p:16500,dc:2200},
      {n:'U+tv 프리미엄',p:18700,dc:2200},
      {n:'U+tv 프리미엄 VOD',p:24200,dc:5500}
    ],
    gift:{solo:{'100M':200000,'500M':230000,'1G':230000},combo:{'100M':400000,'500M':470000,'1G':470000}},
    bundle:{chweyswun:{
      internet:{'100M':5500,'500M':9900,'1G':13200},
      planLabels:['69,000원 미만','69,000원 이상','88,000원 이상'],
      mobile:[[2200,3300,4400],[3300,5500,6600],[4400,6600,8800]]
    }}}
};

var speedInfo = {
  '100M':{title:'100 Mbps',desc:'1-2인가구',price:22000},
  '500M':{title:'500 Mbps',desc:'3-4인가구',price:33000,reco:true},
  '1G':{title:'1 Gbps',desc:'고화질 스트리밍',price:38500}
};

var state = { carrier:'kt', speed:'500M', tv:0, wifi:false, tvOn:false, mobileOn:true, lines:2, rangeIdx:2 };

function fmt(n){ return n.toLocaleString()+'원'; }

function renderCarriers(){
  var el=document.getElementById('f-carrier');
  el.innerHTML=['kt','lgu','skt'].map(function(k){
    var d=D[k];
    var sel=state.carrier===k?' selected':'';
    return '<div class="select-card'+sel+'" data-carrier="'+k+'"><div class="logo" style="color:'+d.color+'">'+d.logo+'</div><div class="name">'+d.name+'</div></div>';
  }).join('');
  el.querySelectorAll('.select-card').forEach(function(c){
    c.onclick=function(){ state.carrier=c.dataset.carrier; state.tv=0; buildTv(); refresh(); };
  });
}

function renderSpeeds(){
  var el=document.getElementById('f-speed');
  el.innerHTML=['100M','500M','1G'].map(function(sp){
    var info=speedInfo[sp];
    var sel=state.speed===sp?' selected':'';
    return '<div class="select-card speed-card'+sel+'" data-speed="'+sp+'">'+
      (info.reco?'<span class="badge-reco">추천</span>':'')+
      '<div class="big">'+info.title.split(' ')[0]+'<small>'+info.title.split(' ')[1]+'</small></div>'+
      '<div class="desc">'+info.desc+'</div>'+
      '<div class="desc-sub">슬림 / 기본형 / 프리미엄</div>'+
      '<div class="price">월 '+fmt(info.price)+'</div></div>';
  }).join('');
  el.querySelectorAll('.select-card').forEach(function(c){
    c.onclick=function(){ state.speed=c.dataset.speed; refresh(); };
  });
}

function buildTv(){
  var sel=document.getElementById('f-tv');
  var d=D[state.carrier];
  sel.innerHTML=d.tv.map(function(t,i){
    return '<option value="'+i+'">'+t.n+(t.p?' — '+fmt(t.p):'')+'</option>';
  }).join('');
  sel.value=state.tv||0;
}

function buildLinesRange(){
  var c=state.carrier;
  var linesSel=document.getElementById('f-lines');
  var rangeWrap=document.getElementById('f-range-wrap');
  var rangeSel=document.getElementById('f-range');
  if (c==='skt'){
    linesSel.innerHTML='<option value="1">1명 (요즘가족결합)</option><option value="2">2명</option><option value="3">3명</option><option value="4">4명</option><option value="5">5명</option>';
    rangeWrap.style.display='none';
  } else if (c==='kt'){
    linesSel.innerHTML='<option value="-">해당 없음 (구간으로 계산)</option>';
    rangeSel.innerHTML=D.kt.bundle.total.ranges.map(function(r,i){return '<option value="'+i+'">'+r+'</option>';}).join('');
    rangeWrap.style.display='';
  } else {
    linesSel.innerHTML='<option value="2">2회선 (참쉬운)</option><option value="3">3회선</option><option value="4">4회선+</option>';
    rangeSel.innerHTML=D.lgu.bundle.chweyswun.planLabels.map(function(p,i){return '<option value="'+i+'">휴대폰 월 '+p+'</option>';}).join('');
    rangeWrap.style.display='';
  }
  linesSel.value=state.lines;
  if(rangeSel) rangeSel.value=state.rangeIdx;
}

function calculate(){
  var d=D[state.carrier];
  var sp=state.speed;
  var hasTv=state.tvOn && state.tv>0;
  var wf=state.wifi;
  var wifiForSp=d.wifiPrice?d.wifiPrice[sp]:(typeof d.wifiCost==='number'?d.wifiCost:1100);

  var baseTotal;
  if (hasTv){
    var netCombo=wf?d.tvInternetWithWifi[sp]:d.tvInternetNoWifi[sp];
    var tvFinal=d.tv[state.tv].p - (d.tv[state.tv].dc||0);
    baseTotal=netCombo+tvFinal+(d.setTop||0);
  } else {
    baseTotal=d.internet[sp]+(wf?wifiForSp:0);
  }

  // 기본요금(무선결합 없음) = baseTotal
  var basicFee = baseTotal;
  var bundleFee = baseTotal;
  var mobileSide = 0;
  var benefitLabel = '';

  if (state.mobileOn){
    if (state.carrier==='skt' && d.bundle && d.bundle.family){
      var famInet=d.bundle.family.internet[sp];
      var famIptv=hasTv?d.bundle.family.iptv:0;
      var lines=parseInt(state.lines)||1;
      var netSingle=d.internet[sp]+(wf?wifiForSp:0);
      var inetAfter=netSingle-famInet;
      var tvBase=hasTv?d.tv[state.tv].p:0;
      var tvDc=hasTv?(d.tv[state.tv].dc||0)+famIptv:0;
      var tvAfter=hasTv?(tvBase-tvDc):0;
      bundleFee=inetAfter+tvAfter+(hasTv?d.setTop:0);
      var tbl=d.bundle.family.mobilePerBySpeed[sp];
      mobileSide=(tbl[lines]||0)*lines;
      benefitLabel='요즘가족결합 '+lines+'명';
    } else if (state.carrier==='kt' && d.bundle && d.bundle.total){
      var rIdx=parseInt(state.rangeIdx)||0;
      var inetDc=d.bundle.total.internet[sp][rIdx]||0;
      mobileSide=d.bundle.total.mobile[sp][rIdx]||0;
      bundleFee=baseTotal-inetDc;
      benefitLabel='총액 결합 ('+d.bundle.total.ranges[rIdx]+')';
    } else if (state.carrier==='lgu' && d.bundle && d.bundle.chweyswun){
      var pIdx=parseInt(state.rangeIdx)||0;
      var ln=parseInt(state.lines)||2;
      var idx=Math.min(ln,4)-2;
      var lguInet=d.bundle.chweyswun.internet[sp]||0;
      mobileSide=d.bundle.chweyswun.mobile[pIdx][idx]||0;
      var netS=d.internet[sp]+(wf?wifiForSp:0);
      var inetA=netS-lguInet;
      var tvB=hasTv?d.tv[state.tv].p:0;
      var tvD=hasTv?(d.tv[state.tv].dc||0):0;
      var tvA=hasTv?(tvB-tvD):0;
      bundleFee=inetA+tvA+(hasTv?d.setTop:0);
      benefitLabel='참쉬운 결합 '+ln+'회선';
    }
  }

  var finalFee = bundleFee - mobileSide; // 혜택가 (휴대폰 할인까지 반영)
  var giftAmt = hasTv ? (d.gift.combo[sp]||0) : (d.gift.solo[sp]||0);

  return { basicFee:basicFee, bundleFee:bundleFee, mobileSide:mobileSide, finalFee:finalFee, gift:giftAmt, benefit:benefitLabel };
}

function renderBottom(){
  var r=calculate();
  var h='';
  h+='<div class="bb-line"><span class="l">기본 요금 (휴대폰 X)</span><span class="v">'+fmt(r.basicFee)+'</span></div>';
  if (state.mobileOn){
    h+='<div class="bb-line"><span class="l">휴대폰 결합 요금 ('+r.benefit+')</span><span class="v">'+fmt(r.bundleFee)+'</span></div>';
    h+='<div class="bb-line"><span class="l">· 휴대폰 고지서 별도 할인</span><span class="v" style="color:#059669;font-weight:700">-'+fmt(r.mobileSide)+'</span></div>';
    h+='<div class="bb-line bb-final"><span class="l">💰 혜택가 (최종)</span><span class="v">'+fmt(r.finalFee)+'</span></div>';
  } else {
    h+='<div class="bb-line bb-final"><span class="l">💰 월 요금</span><span class="v">'+fmt(r.basicFee)+'</span></div>';
  }
  if (r.gift) h+='<div class="bb-gift">🎁 사은품 '+fmt(r.gift)+' + 추가혜택</div>';
  document.getElementById('bb-info').innerHTML=h;
}

function refresh(){
  renderCarriers();
  renderSpeeds();
  buildTv();
  buildLinesRange();
  document.getElementById('f-tv-field').style.display=state.tvOn?'':'none';
  document.getElementById('f-mobile-field').style.display=state.mobileOn?'':'none';
  renderBottom();
}

// 이벤트
document.getElementById('f-tv-on').addEventListener('change',function(e){ state.tvOn=e.target.checked; refresh(); });
document.getElementById('f-mobile-on').addEventListener('change',function(e){ state.mobileOn=e.target.checked; refresh(); });
document.getElementById('f-wifi').addEventListener('change',function(e){ state.wifi=e.target.checked; renderBottom(); });
document.getElementById('f-tv').addEventListener('change',function(e){ state.tv=parseInt(e.target.value); renderBottom(); });
document.getElementById('f-lines').addEventListener('change',function(e){ state.lines=e.target.value; renderBottom(); });
document.getElementById('f-range').addEventListener('change',function(e){ state.rangeIdx=parseInt(e.target.value); renderBottom(); });

refresh();
</script>

</body>
</html>
