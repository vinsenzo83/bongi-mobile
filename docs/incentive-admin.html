<script>
// 🚀 Service Worker — 옛 v1·v2 stuck 강제 정리 후 새 v3 등록
if ('serviceWorker' in navigator) {
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
    if (window.caches) caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  } else {
    // 🔑 v3 cleanup — 옛 SW(v1·v2) 잔존 시 한 번만 unregister + 캐시 삭제 + reload
    const SW_CLEANUP_KEY = 'sw-cleanup-2026-05-v3';
    if (!localStorage.getItem(SW_CLEANUP_KEY)) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        if (regs.length === 0) {
          // 첫 진입 — 옛 SW 없음, 바로 새 등록
          localStorage.setItem(SW_CLEANUP_KEY, '1');
          navigator.serviceWorker.register('/docs/sw.js', { scope: '/docs/' }).catch(() => {});
        } else {
          Promise.all(regs.map(r => r.unregister())).then(() => {
            const c = window.caches ? caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))) : Promise.resolve();
            return c;
          }).then(() => {
            localStorage.setItem(SW_CLEANUP_KEY, '1');
            location.reload(); // 새 페이지 로드 → 다음 진입 시 v3 등록
          });
        }
      });
    } else {
      navigator.serviceWorker.register('/docs/sw.js', { scope: '/docs/' }).catch(() => {});
    }
  }
}

// ═══════════════════════════════ 공용 인증 + iframe 컨트롤러 ═══════════════════════════════
const G_API = '/api/incentive';
const G_AUTH = '/api/auth';
const G_TOKEN_KEY = 'incentive-auth-token-v1';
const G_REFRESH_KEY = 'incentive-refresh-token-v1';
const G_LAST_TAB_KEY = 'incentive-admin-last-tab';
const G_MENUS_CACHE_KEY = 'incentive-admin-my-menus-v3';
// 옛 v1·v2 캐시 정리 — 큐콜 v2 원복으로 메뉴 매트릭스 재정렬
try { localStorage.removeItem('incentive-admin-my-menus-v1'); localStorage.removeItem('incentive-admin-my-menus-v2'); } catch(e) {}
const gGetToken = () => localStorage.getItem(G_TOKEN_KEY);
const gSetToken = (t) => localStorage.setItem(G_TOKEN_KEY, t);
const gClearToken = () => { localStorage.removeItem(G_TOKEN_KEY); localStorage.removeItem(G_REFRESH_KEY); localStorage.removeItem(G_MENUS_CACHE_KEY); };
window.G_currentAgent = null;

async function gLogin(email, password) {
  const res = await fetch(G_AUTH + '/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  if (!res.ok) throw new Error((await res.json()).error || '로그인 실패');
  const data = await res.json();
  gSetToken(data.access_token);
  if (data.refresh_token) localStorage.setItem(G_REFRESH_KEY, data.refresh_token);
  // 로그인 응답에 동봉된 role_menus 즉시 캐싱 (사이드바 fetch round-trip 1회 절약)
  if (Array.isArray(data.role_menus)) {
    try { localStorage.setItem(G_MENUS_CACHE_KEY, JSON.stringify(data.role_menus)); } catch(e) {}
  }
  return data;
}

async function gTryRefreshToken() {
  const rt = localStorage.getItem(G_REFRESH_KEY);
  if (!rt) return false;
  try {
    const res = await fetch(G_AUTH + '/refresh', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ refresh_token: rt })
    });
    if (!res.ok) return false;
    const data = await res.json();
    gSetToken(data.access_token);
    if (data.refresh_token) localStorage.setItem(G_REFRESH_KEY, data.refresh_token);
    return true;
  } catch { return false; }
}

async function gFetchAgent() {
  const tk = gGetToken(); if (!tk) return null;
  let res = await fetch(G_API + '/agents/me', {headers: {Authorization: 'Bearer ' + tk}});
  if (res.status === 401) {
    // refresh 시도
    if (await gTryRefreshToken()) {
      res = await fetch(G_API + '/agents/me', {headers: {Authorization: 'Bearer ' + gGetToken()}});
      if (res.ok) return (await res.json()).agent;
    }
    gClearToken();
    return null;
  }
  if (!res.ok) return null;
  return (await res.json()).agent;
}

// 세션 만료 → 즉시 로그인 화면 전환 + 안내 토스트
function gShowSessionExpired() {
  if (!window.G_currentAgent) return; // 이미 로그아웃 상태
  window.G_currentAgent = null;
  document.getElementById('g-main').style.display = 'none';
  document.getElementById('g-user-info').style.display = 'none';
  const overlay = document.getElementById('g-auth-overlay');
  overlay.style.display = '';
  const msg = document.getElementById('g-auth-msg');
  if (msg) { msg.style.color = '#fbbf24'; msg.textContent = '⏰ 세션이 만료되어 자동 로그아웃되었습니다. 다시 로그인하세요.'; }
  gShowToast('⏰ 세션 만료 — 다시 로그인 필요');
}

// 3분마다 토큰 헬스체크 + storage 이벤트 (다른 탭 로그아웃 감지)
function gStartSessionWatch() {
  if (window._gSessionTimer) return;
  window._gSessionTimer = setInterval(async () => {
    if (!window.G_currentAgent) return;
    if (!gGetToken()) { gShowSessionExpired(); return; }
    const agent = await gFetchAgent();
    if (!agent) gShowSessionExpired();
  }, 3 * 60 * 1000);
  // 다른 탭에서 로그아웃 시 즉시 반응
  window.addEventListener('storage', (e) => {
    if (e.key === G_TOKEN_KEY && !e.newValue && window.G_currentAgent) gShowSessionExpired();
  });
}

async function gFetchMyPermissions() {
  const tk = gGetToken(); if (!tk) return [];
  try {
    const r = await fetch(G_API + '/role-permissions/me', { headers: { Authorization: 'Bearer ' + tk } });
    if (!r.ok) return [];
    return (await r.json()).menus || [];
  } catch { return []; }
}

function gApplyMenuVisibility(allowedKeys) {
  const set = new Set(Array.isArray(allowedKeys) ? allowedKeys : []);
  document.querySelectorAll('.tab-btn[data-key]').forEach(btn => {
    btn.style.display = set.has(btn.dataset.key) ? 'flex' : 'none';
  });
}

// ═══════════════════════════════════════════════════════════════
// 2FA 기능 제거됨 — IP 화이트리스트로 보안 처리 (콜 DB 관리 페이지 [🔐 보안] 메뉴)

function gShowToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._gToastTimer);
  window._gToastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// 사이드바 카테고리 바 접기/펼치기
function toggleSidebar() {
  document.body.classList.toggle('sidebar-collapsed');
  const collapsed = document.body.classList.contains('sidebar-collapsed');
  const btn = document.getElementById('sidebar-toggle-btn');
  if (btn) btn.textContent = collapsed ? '▶' : '◀ 접기';
  try { localStorage.setItem('admin-sidebar-collapsed', collapsed ? '1' : '0'); } catch(e) {}
}
// 페이지 로드 시 상태 복원
(function(){
  if (localStorage.getItem('admin-sidebar-collapsed') === '1') {
    document.documentElement.classList.add('sidebar-collapsed-pre');
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('sidebar-collapsed');
      const btn = document.getElementById('sidebar-toggle-btn');
      if (btn) btn.textContent = '▶';
    });
  }
})();

// ─── iframe 전환 (keep-alive — path 기반 풀 key) ───
const _iframePool = new Map(); // path(query 제외) → iframe element
function gLoadTab(btn) {
  if (!btn) return;
  const src = btn.dataset.src;
  if (!src) return;
  const path = src.split('?')[0];
  // 🔑 mode·customer_id 등 query string에 따라 별도 iframe key
  // (예: tm-counselor.html vs tm-counselor.html?mode=manual은 별도 iframe)
  let modeKey = '';
  try {
    const u = new URL(src, location.origin);
    modeKey = u.searchParams.get('mode') || '';
  } catch {}
  const poolKey = modeKey ? (path + '|' + modeKey) : path;
  const container = document.querySelector('.content-area');
  const loading = document.getElementById('g-iframe-loading');
  // active 표시
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  try { localStorage.setItem(G_LAST_TAB_KEY, poolKey); } catch(e) {}
  // 모든 풀 iframe 숨김
  _iframePool.forEach(f => { f.style.display = 'none'; });
  // 이미 로드한 iframe 재사용 (poolKey 기준)
  let iframe = _iframePool.get(poolKey);
  if (iframe) {
    iframe.style.display = 'block';
    loading.style.display = 'none';
    return;
  }
  // 신규
  iframe = document.createElement('iframe');
  iframe.style.cssText = 'width:100%;height:100%;border:none;background:#0f172a;display:block';
  iframe.src = src + (src.includes('?') ? '&' : '?') + '_t=' + Date.now();
  loading.style.display = 'flex';
  iframe.onload = () => { loading.style.display = 'none'; };
  container.appendChild(iframe);
  _iframePool.set(poolKey, iframe);
  const legacy = document.getElementById('g-iframe');
  if (legacy && legacy !== iframe) legacy.style.display = 'none';
}

async function gOnLoggedIn(agent) {
  window.G_currentAgent = agent;
  // 2FA 기능 제거됨 — IP 화이트리스트로 보안 처리 (콜 DB 관리 페이지에서 등록)
  const name = agent.name || '-';
  document.getElementById('g-user-name').textContent = name;
  document.getElementById('g-user-avatar').textContent = name.trim().charAt(0).toUpperCase() || '?';
  document.getElementById('g-user-center').textContent = agent.center || '-';
  const badge = document.getElementById('g-role-badge');
  const roleLabel = ({admin:'ADMIN', manager:'MANAGER', agent:'AGENT', contract:'CONTRACT'})[agent.role] || agent.role;
  badge.textContent = roleLabel;
  badge.className = 'role-badge role-' + agent.role;
  document.getElementById('g-user-info').style.display = '';
  document.getElementById('g-main').style.display = '';
  document.getElementById('g-auth-overlay').style.display = 'none';

  // DB-driven 메뉴 가시성: 캐시 즉시 적용 → 백그라운드 갱신
  let cached = [];
  try { cached = JSON.parse(localStorage.getItem(G_MENUS_CACHE_KEY) || '[]'); } catch(e) {}
  if (cached.length) gApplyMenuVisibility(cached);
  // 백그라운드 fetch — 변경됐으면 갱신
  gFetchMyPermissions().then(menus => {
    if (Array.isArray(menus) && menus.length) {
      try { localStorage.setItem(G_MENUS_CACHE_KEY, JSON.stringify(menus)); } catch(e) {}
      // 캐시와 다르면 갱신
      if (JSON.stringify(menus) !== JSON.stringify(cached)) gApplyMenuVisibility(menus);
    }
  });
  const allowedMenus = cached.length ? cached : await gFetchMyPermissions();
  if (!cached.length) gApplyMenuVisibility(allowedMenus);

  // 첫 진입: 마지막 본 메뉴 또는 첫 가시 메뉴
  let initialBtn = null;
  try {
    const lastSrc = localStorage.getItem(G_LAST_TAB_KEY);
    if (lastSrc) {
      const candidates = Array.from(document.querySelectorAll('.tab-btn[data-src]'));
      initialBtn = candidates.find(b => b.dataset.src === lastSrc) || null;
      // 권한 없으면 무시
      if (initialBtn) {
        const cs = window.getComputedStyle(initialBtn);
        if (cs.display === 'none') initialBtn = null;
      }
    }
  } catch(e) {}
  if (!initialBtn) {
    initialBtn = Array.from(document.querySelectorAll('.tab-btn[data-src]'))
      .find(b => window.getComputedStyle(b).display !== 'none') || null;
  }
  if (initialBtn) gLoadTab(initialBtn);
  // 세션 헬스체크 시작
  gStartSessionWatch();
}

async function gInit() {
  const tk = gGetToken();
  if (tk) {
    const agent = await gFetchAgent();
    if (agent) { gOnLoggedIn(agent); return; }
  }
  document.getElementById('g-auth-overlay').style.display = '';
}

document.getElementById('g-auth-login-btn').addEventListener('click', async () => {
  const email = document.getElementById('g-auth-email').value.trim();
  const password = document.getElementById('g-auth-pass').value;
  const msg = document.getElementById('g-auth-msg');
  msg.textContent = '';
  if (!email || !password) { msg.textContent = '이메일/비밀번호 입력'; return; }
  try {
    await gLogin(email, password);
    const agent = await gFetchAgent();
    if (!agent) { msg.textContent = '권한 확인 실패'; gClearToken(); return; }
    gOnLoggedIn(agent);
  } catch (e) { msg.textContent = e.message; }
});
document.getElementById('g-auth-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('g-auth-login-btn').click();
});
document.getElementById('g-logout-btn').addEventListener('click', () => {
  gClearToken();
  location.reload();
});

// 비밀번호 변경 모달
document.getElementById('g-changepw-btn').addEventListener('click', () => {
  document.getElementById('g-pw-modal').style.display = 'flex';
  document.getElementById('g-pw-current').value = '';
  document.getElementById('g-pw-new').value = '';
  document.getElementById('g-pw-confirm').value = '';
  document.getElementById('g-pw-msg').textContent = '';
  setTimeout(() => document.getElementById('g-pw-current').focus(), 50);
});
document.getElementById('g-pw-cancel').addEventListener('click', () => {
  document.getElementById('g-pw-modal').style.display = 'none';
});
document.getElementById('g-pw-submit').addEventListener('click', async () => {
  const cur = document.getElementById('g-pw-current').value;
  const nw = document.getElementById('g-pw-new').value;
  const cf = document.getElementById('g-pw-confirm').value;
  const msg = document.getElementById('g-pw-msg');
  msg.style.color = '#dc2626';
  if (!cur || !nw || !cf) { msg.textContent = '모두 입력하세요'; return; }
  if (nw.length < 8) { msg.textContent = '새 비밀번호는 8자 이상'; return; }
  if (nw !== cf) { msg.textContent = '새 비밀번호 확인 불일치'; return; }
  if (cur === nw) { msg.textContent = '새 비밀번호가 현재와 동일'; return; }
  const tk = gGetToken();
  try {
    const res = await fetch(G_AUTH + '/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tk },
      body: JSON.stringify({ current_password: cur, new_password: nw }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { msg.textContent = data.error || '변경 실패'; return; }
    msg.style.color = '#16a34a';
    msg.textContent = '✅ 변경 완료';
    setTimeout(() => {
      document.getElementById('g-pw-modal').style.display = 'none';
      gShowToast('🔐 비밀번호 변경 완료');
    }, 800);
  } catch (e) { msg.textContent = e.message; }
});

// 🆕 자식 iframe → 부모(통합 어드민)으로 메뉴 전환 신호 (same-origin만)
window.addEventListener('message', (e) => {
  if (e.origin !== window.location.origin) return;
  if (e.data?.type === 'switch-menu' && e.data.key) {
    const tgt = document.querySelector(`.tab-btn[data-key="${e.data.key}"]`);
    if (tgt) {
      // sale_id 같은 deep-link 파라미터 전달
      if (e.data.sale_id) {
        const baseSrc = tgt.dataset.src.split('?')[0];
        tgt.dataset.src = baseSrc + '?sale_id=' + encodeURIComponent(e.data.sale_id);
      }
      gLoadTab(tgt);
    }
    return;
  }
  if (e.data?.type === 'open-call-screen' && e.data.customer_id) {
    const tmBtn = document.querySelector('.tab-btn[data-key="tm-counselor"]');
    if (tmBtn) {
      // 콜 모드 src로 강제 변경
      const newSrc = '/docs/tm-counselor.html?customer_id=' + encodeURIComponent(e.data.customer_id);
      // 기존 풀에서 tm-counselor iframe 제거 (재로드 강제)
      const oldIframe = _iframePool.get('/docs/tm-counselor.html');
      if (oldIframe) { oldIframe.remove(); _iframePool.delete('/docs/tm-counselor.html'); }
      // 새로 로드
      tmBtn.dataset.src = newSrc;
      gLoadTab(tmBtn);
      // dataset.src 원복 (다음 사용자가 일반 모드로 진입할 수 있게)
      setTimeout(() => { tmBtn.dataset.src = '/docs/tm-counselor.html'; }, 1000);
    }
  } else if (e.data?.type === 'call-queue-empty') {
    gShowToast('🎉 모든 콜 처리 완료');
    // 콜 list로 복귀
    const listBtn = document.querySelector('.tab-btn[data-key="call-list"]');
    if (listBtn) gLoadTab(listBtn);
  } else if (e.data?.type === 'distribution-request-updated') {
    // 자식 페이지가 요청 변경(생성·승인·거부·취소)을 알릴 때 즉시 배지 갱신
    pollDistributionRequests();
  }
});

// 사이드바 메뉴 바인딩
document.querySelectorAll('.tab-btn[data-src]').forEach(btn => {
  btn.addEventListener('click', () => gLoadTab(btn));
});

// ═══════════════════════════════════════════════════════════════
// 📥 분배 요청 — 사이드바 배지 + 알림 (manager·admin 전용)
// ═══════════════════════════════════════════════════════════════
let _drLastSeenIds = new Set();
let _drFirstPoll = true;
async function pollDistributionRequests() {
  const me = window.G_currentAgent;
  if (!me || (me.role !== 'manager' && me.role !== 'admin')) return;
  const tk = localStorage.getItem('incentive-auth-token-v1');
  if (!tk) return;
  try {
    const r = await fetch('/api/customer-db/requests?status=pending&limit=100', {
      headers: { Authorization: 'Bearer ' + tk }
    });
    if (!r.ok) return;
    const d = await r.json();
    const reqs = (d.requests || []).filter(rq => rq.agent_id !== me.id); // 본인이 만든 요청 제외
    const badge = document.getElementById('dr-badge');
    if (badge) {
      if (reqs.length > 0) {
        badge.textContent = reqs.length;
        badge.style.display = '';
      } else {
        badge.style.display = 'none';
      }
    }
    // 새 요청 감지 → 푸시 알림 (첫 폴링 시는 무시: 기존 pending 알림 폭주 방지)
    if (!_drFirstPoll) {
      const newOnes = reqs.filter(rq => !_drLastSeenIds.has(rq.id));
      newOnes.forEach(rq => {
        const title = `📥 새 분배 요청 — ${rq.agent?.name || '?'} (${rq.requested_count}건)`;
        const body = `${rq.center || '-'} · ${rq.reason || '사유 없음'}`;
        // 브라우저 알림
        if ('Notification' in window) {
          if (Notification.permission === 'granted') {
            try { new Notification(title, { body, icon:'/logo192.png', tag:'dr-' + rq.id }); } catch {}
          } else if (Notification.permission !== 'denied') {
            Notification.requestPermission();
          }
        }
        // 사운드
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator(); const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = 720; g.gain.value = 0.08;
          o.start(); o.stop(ctx.currentTime + 0.2);
        } catch {}
        // 토스트
        gShowToast(title);
      });
    }
    _drLastSeenIds = new Set(reqs.map(rq => rq.id));
    _drFirstPoll = false;
  } catch (e) { console.warn('[pollDistributionRequests]', e); }
}
// gInit이 끝난 뒤 폴링 시작 (window.G_currentAgent 채워진 후)
setInterval(() => {
  if (window.G_currentAgent) pollDistributionRequests();
}, 30000);
setTimeout(() => { if (window.G_currentAgent) pollDistributionRequests(); }, 1500);

// 페이지 로드 후 init
setTimeout(gInit, 50);
</script>
