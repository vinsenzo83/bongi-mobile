<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인센티브 어드민 (통합 V5)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
* { box-sizing: border-box; margin:0; padding:0; }
html, body { height:100%; overflow:hidden; }
body { font-family: 'Pretendard Variable', sans-serif; background:#0f172a; color:#e2e8f0; display:flex; flex-direction:column; }

/* ─── 상단 바 ─── */
.top-bar { background:linear-gradient(135deg,#0f172a,#1e293b); border-bottom:1.5px solid #334155; padding:10px 20px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; height:56px; }
.top-bar h1 { font-size:16px; color:#f8fafc; font-weight:800; letter-spacing:-0.02em; }
.top-bar h1 .v { background:#3b82f6; color:#fff; padding:2px 8px; border-radius:4px; font-size:10px; margin-left:6px; }
.top-bar .user { display:flex; gap:10px; align-items:center; }
.top-bar .user-name { font-size:12px; color:#f8fafc; font-weight:700; }
.top-bar .user-meta { font-size:10px; color:#94a3b8; }
.top-bar .role-badge { padding:2px 8px; border-radius:4px; font-size:10px; font-weight:800; }
.top-bar .role-manager { background:#16a34a; color:#fff; }
.top-bar .role-admin { background:#dc2626; color:#fff; }
.top-bar .role-agent { background:#3b82f6; color:#fff; }
.top-bar .role-contract { background:#8b5cf6; color:#fff; }
.top-bar button { background:#475569; color:#fff; border:none; padding:5px 11px; border-radius:5px; cursor:pointer; font-size:11px; font-weight:700; }
.top-bar button:hover { background:#64748b; }

/* ─── 메인 레이아웃 ─── */
.main { flex:1; display:flex; min-height:0; }
aside.sidebar { width:200px; background:#1e293b; border-right:1.5px solid #334155; padding:14px 0; display:flex; flex-direction:column; gap:2px; flex-shrink:0; overflow-y:auto; }
.tab-btn { background:transparent; border:none; color:#cbd5e1; padding:11px 18px; text-align:left; cursor:pointer; font-size:12.5px; font-weight:700; letter-spacing:0.02em; display:flex; align-items:center; gap:10px; border-left:3px solid transparent; transition:all 0.15s; font-family:inherit; width:100%; }
.tab-btn:hover { background:rgba(59,130,246,0.1); color:#f8fafc; }
.tab-btn.active { background:rgba(59,130,246,0.15); color:#60a5fa; border-left-color:#3b82f6; font-weight:800; }
.tab-btn .icon { font-size:14px; }

/* role-based 가시성은 JS-driven (DB의 incentive_role_permissions 기반) — 초기엔 숨김 */
.tab-btn[data-key] { display:none; }

.sidebar-divider { border-top:1px solid #334155; margin:14px 14px; }

/* ─── 콘텐츠 영역 (iframe 컨테이너) ─── */
.content-area { flex:1; min-width:0; background:#0f172a; position:relative; }
#g-iframe { width:100%; height:100%; border:none; background:#0f172a; display:block; }
.iframe-loading { position:absolute; inset:0; display:flex; justify-content:center; align-items:center; color:#64748b; font-size:13px; pointer-events:none; }

/* ─── 인증 오버레이 ─── */
.auth-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.95); display:flex; justify-content:center; align-items:center; z-index:9999; }
.auth-box { background:linear-gradient(135deg,#1e293b,#334155); border:1.5px solid #475569; border-radius:12px; padding:24px 28px; width:380px; box-shadow:0 20px 60px rgba(0,0,0,0.6); }
.auth-box h2 { font-size:16px; color:#60a5fa; font-weight:800; margin-bottom:14px; }
.auth-box input { width:100%; background:#0f172a; border:1px solid #475569; color:#e2e8f0; padding:10px 12px; border-radius:6px; font-size:13px; margin-bottom:8px; font-family:inherit; }
.auth-box input:focus { outline:none; border-color:#3b82f6; background:#1e293b; }
.auth-box button { width:100%; background:#3b82f6; color:#fff; border:none; padding:11px; border-radius:6px; font-weight:800; cursor:pointer; font-size:13px; font-family:inherit; }
.auth-box button:hover { background:#2563eb; }
.auth-msg { font-size:11px; margin-top:8px; min-height:16px; color:#dc2626; }
.auth-hint { font-size:10px; color:#94a3b8; margin-top:10px; line-height:1.5; }
.auth-hint code { background:#0f172a; padding:1px 5px; border-radius:3px; }

/* ─── 토스트 ─── */
#toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#16a34a; color:#fff; padding:14px 24px; border-radius:10px; font-size:14px; font-weight:800; box-shadow:0 6px 24px rgba(22,163,74,0.5); z-index:99999; opacity:0; transition:opacity 0.2s; pointer-events:none; }
#toast.show { opacity:1; }

/* 다크 테마 - 달력 아이콘 강제 표시 */
input[type="date"], input[type="month"] { color-scheme: dark; }
</style>
</head>
<body>

<header class="top-bar">
  <h1>⚡ 인센티브 어드민<span class="v">V5</span></h1>
  <div class="user" id="g-user-info" style="display:none">
    <div>
      <div class="user-name" id="g-user-name">-</div>
      <div class="user-meta"><span class="role-badge" id="g-role-badge">-</span> · <span id="g-user-center">-</span></div>
    </div>
    <button id="g-changepw-btn" style="background:#0891b2;margin-right:4px">🔐 비번변경</button>
    <button id="g-logout-btn">로그아웃</button>
  </div>
</header>

<!-- 비밀번호 변경 모달 -->
<div id="g-pw-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.85);z-index:99998;justify-content:center;align-items:center">
  <div style="background:linear-gradient(135deg,#1e293b,#334155);border:1.5px solid #475569;border-radius:12px;padding:24px 28px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.6)">
    <h2 style="font-size:16px;color:#60a5fa;font-weight:800;margin-bottom:14px">🔐 비밀번호 변경</h2>
    <input type="password" id="g-pw-current" placeholder="현재 비밀번호" style="width:100%;background:#0f172a;border:1px solid #475569;color:#e2e8f0;padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:8px">
    <input type="password" id="g-pw-new" placeholder="새 비밀번호 (8자 이상)" style="width:100%;background:#0f172a;border:1px solid #475569;color:#e2e8f0;padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:8px">
    <input type="password" id="g-pw-confirm" placeholder="새 비밀번호 확인" style="width:100%;background:#0f172a;border:1px solid #475569;color:#e2e8f0;padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:8px">
    <div id="g-pw-msg" style="font-size:11px;min-height:16px;color:#dc2626;margin-bottom:8px"></div>
    <div style="display:flex;gap:8px">
      <button id="g-pw-cancel" style="flex:1;background:#475569;color:#fff;border:none;padding:10px;border-radius:6px;font-weight:700;cursor:pointer">취소</button>
      <button id="g-pw-submit" style="flex:1;background:#3b82f6;color:#fff;border:none;padding:10px;border-radius:6px;font-weight:800;cursor:pointer">변경</button>
    </div>
  </div>
</div>

<div class="main" id="g-main" style="display:none">
  <aside class="sidebar">
    <button class="tab-btn" data-key="dashboard" data-src="/docs/incentive-dashboard.html"><span class="icon">📊</span> 대시보드</button>
    <button class="tab-btn" data-key="contract" data-src="/docs/incentive-contract.html"><span class="icon">📋</span> 계약 처리</button>
    <button class="tab-btn" data-key="agents" data-src="/docs/incentive-agents.html"><span class="icon">👥</span> 상담사 관리</button>
    <button class="tab-btn" data-key="products" data-src="/docs/incentive-products.html"><span class="icon">📦</span> 상품 관리</button>
    <button class="tab-btn" data-key="rules" data-src="/docs/incentive-rules.html"><span class="icon">⚙️</span> 정책 관리</button>
    <button class="tab-btn" data-key="db-sources" data-src="/docs/incentive-db-sources.html"><span class="icon">🗂️</span> DB 출처</button>
    <div class="sidebar-divider"></div>
    <button class="tab-btn" data-key="tm-counselor" data-src="/docs/tm-counselor.html"><span class="icon">📞</span> TM 상담</button>
    <button class="tab-btn" data-key="tm-data" data-src="/docs/calculator.html?admin=1"><span class="icon">🧮</span> TM 데이터 관리</button>
    <button class="tab-btn" data-key="guide" data-src="/docs/incentive-guide.html"><span class="icon">📖</span> 급여 안내</button>
    <div class="sidebar-divider"></div>
    <button class="tab-btn" data-key="permissions" data-src="/docs/incentive-permissions.html"><span class="icon">🔐</span> 권한 관리</button>
  </aside>
  <div class="content-area">
    <div class="iframe-loading" id="g-iframe-loading">불러오는 중…</div>
    <iframe id="g-iframe" src="" title="콘텐츠"></iframe>
  </div>
</div>

<div id="toast"></div>

<div class="auth-overlay" id="g-auth-overlay" style="display:none">
  <div class="auth-box">
    <h2>🔐 인센티브 어드민 로그인</h2>
    <input type="email" id="g-auth-email" placeholder="email" autocomplete="username">
    <input type="password" id="g-auth-pass" placeholder="비밀번호" autocomplete="current-password">
    <button id="g-auth-login-btn">로그인</button>
    <div class="auth-msg" id="g-auth-msg"></div>
    <div class="auth-hint">
      manager / admin / agent / contract 권한.<br>
      테스트: <code>manager1@bongi.test</code> / <code>admin1@bongi.test</code> / <code>agent1@bongi.test</code> (비번 <code>pass1234!</code>)
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════ 공용 인증 + iframe 컨트롤러 ═══════════════════════════════
const G_API = '/api/incentive';
const G_AUTH = '/api/auth';
const G_TOKEN_KEY = 'incentive-auth-token-v1';
const G_REFRESH_KEY = 'incentive-refresh-token-v1';
const G_LAST_TAB_KEY = 'incentive-admin-last-tab';
const G_MENUS_CACHE_KEY = 'incentive-admin-my-menus-v1';
const gGetToken = () => localStorage.getItem(G_TOKEN_KEY);
const gSetToken = (t) => localStorage.setItem(G_TOKEN_KEY, t);
const gClearToken = () => { localStorage.removeItem(G_TOKEN_KEY); localStorage.removeItem(G_REFRESH_KEY); localStorage.removeItem(G_MENUS_CACHE_KEY); };
window.G_currentAgent = null;

async function gLogin(email, password) {
  const res = await fetch(G_AUTH + '/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  if (!res.ok) throw new Error((await res.json()).error || '로그인 실패');
  const data = await res.json();
  gSetToken(data.access_token);
  if (data.refresh_token) localStorage.setItem(G_REFRESH_KEY, data.refresh_token);
  // 로그인 응답에 동봉된 role_menus 즉시 캐싱 (사이드바 fetch round-trip 1회 절약)
  if (Array.isArray(data.role_menus)) {
    try { localStorage.setItem(G_MENUS_CACHE_KEY, JSON.stringify(data.role_menus)); } catch(e) {}
  }
  return data;
}

async function gTryRefreshToken() {
  const rt = localStorage.getItem(G_REFRESH_KEY);
  if (!rt) return false;
  try {
    const res = await fetch(G_AUTH + '/refresh', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ refresh_token: rt })
    });
    if (!res.ok) return false;
    const data = await res.json();
    gSetToken(data.access_token);
    if (data.refresh_token) localStorage.setItem(G_REFRESH_KEY, data.refresh_token);
    return true;
  } catch { return false; }
}

async function gFetchAgent() {
  const tk = gGetToken(); if (!tk) return null;
  let res = await fetch(G_API + '/agents/me', {headers: {Authorization: 'Bearer ' + tk}});
  if (res.status === 401) {
    // refresh 시도
    if (await gTryRefreshToken()) {
      res = await fetch(G_API + '/agents/me', {headers: {Authorization: 'Bearer ' + gGetToken()}});
      if (res.ok) return (await res.json()).agent;
    }
    gClearToken();
    return null;
  }
  if (!res.ok) return null;
  return (await res.json()).agent;
}

// 세션 만료 → 즉시 로그인 화면 전환 + 안내 토스트
function gShowSessionExpired() {
  if (!window.G_currentAgent) return; // 이미 로그아웃 상태
  window.G_currentAgent = null;
  document.getElementById('g-main').style.display = 'none';
  document.getElementById('g-user-info').style.display = 'none';
  const overlay = document.getElementById('g-auth-overlay');
  overlay.style.display = '';
  const msg = document.getElementById('g-auth-msg');
  if (msg) { msg.style.color = '#fbbf24'; msg.textContent = '⏰ 세션이 만료되어 자동 로그아웃되었습니다. 다시 로그인하세요.'; }
  gShowToast('⏰ 세션 만료 — 다시 로그인 필요');
}

// 3분마다 토큰 헬스체크 + storage 이벤트 (다른 탭 로그아웃 감지)
function gStartSessionWatch() {
  if (window._gSessionTimer) return;
  window._gSessionTimer = setInterval(async () => {
    if (!window.G_currentAgent) return;
    if (!gGetToken()) { gShowSessionExpired(); return; }
    const agent = await gFetchAgent();
    if (!agent) gShowSessionExpired();
  }, 3 * 60 * 1000);
  // 다른 탭에서 로그아웃 시 즉시 반응
  window.addEventListener('storage', (e) => {
    if (e.key === G_TOKEN_KEY && !e.newValue && window.G_currentAgent) gShowSessionExpired();
  });
}

async function gFetchMyPermissions() {
  const tk = gGetToken(); if (!tk) return [];
  try {
    const r = await fetch(G_API + '/role-permissions/me', { headers: { Authorization: 'Bearer ' + tk } });
    if (!r.ok) return [];
    return (await r.json()).menus || [];
  } catch { return []; }
}

function gApplyMenuVisibility(allowedKeys) {
  const set = new Set(Array.isArray(allowedKeys) ? allowedKeys : []);
  document.querySelectorAll('.tab-btn[data-key]').forEach(btn => {
    btn.style.display = set.has(btn.dataset.key) ? 'flex' : 'none';
  });
}

function gShowToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._gToastTimer);
  window._gToastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── iframe 전환 ───
function gLoadTab(btn) {
  if (!btn) return;
  const src = btn.dataset.src;
  if (!src) return;
  // 캐시 무효화
  const sep = src.includes('?') ? '&' : '?';
  const fullSrc = src + sep + '_t=' + Date.now();
  const iframe = document.getElementById('g-iframe');
  const loading = document.getElementById('g-iframe-loading');
  loading.style.display = 'flex';
  iframe.onload = () => { loading.style.display = 'none'; };
  iframe.src = fullSrc;
  // active 표시
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  // persistence
  try { localStorage.setItem(G_LAST_TAB_KEY, src); } catch(e) {}
}

async function gOnLoggedIn(agent) {
  window.G_currentAgent = agent;
  document.getElementById('g-user-name').textContent = '👤 ' + (agent.name || '-');
  document.getElementById('g-user-center').textContent = agent.center || '-';
  const badge = document.getElementById('g-role-badge');
  badge.textContent = agent.role;
  badge.className = 'role-badge role-' + agent.role;
  document.getElementById('g-user-info').style.display = '';
  document.getElementById('g-main').style.display = '';
  document.getElementById('g-auth-overlay').style.display = 'none';

  // DB-driven 메뉴 가시성: 캐시 즉시 적용 → 백그라운드 갱신
  let cached = [];
  try { cached = JSON.parse(localStorage.getItem(G_MENUS_CACHE_KEY) || '[]'); } catch(e) {}
  if (cached.length) gApplyMenuVisibility(cached);
  // 백그라운드 fetch — 변경됐으면 갱신
  gFetchMyPermissions().then(menus => {
    if (Array.isArray(menus) && menus.length) {
      try { localStorage.setItem(G_MENUS_CACHE_KEY, JSON.stringify(menus)); } catch(e) {}
      // 캐시와 다르면 갱신
      if (JSON.stringify(menus) !== JSON.stringify(cached)) gApplyMenuVisibility(menus);
    }
  });
  const allowedMenus = cached.length ? cached : await gFetchMyPermissions();
  if (!cached.length) gApplyMenuVisibility(allowedMenus);

  // 첫 진입: 마지막 본 메뉴 또는 첫 가시 메뉴
  let initialBtn = null;
  try {
    const lastSrc = localStorage.getItem(G_LAST_TAB_KEY);
    if (lastSrc) {
      const candidates = Array.from(document.querySelectorAll('.tab-btn[data-src]'));
      initialBtn = candidates.find(b => b.dataset.src === lastSrc) || null;
      // 권한 없으면 무시
      if (initialBtn) {
        const cs = window.getComputedStyle(initialBtn);
        if (cs.display === 'none') initialBtn = null;
      }
    }
  } catch(e) {}
  if (!initialBtn) {
    initialBtn = Array.from(document.querySelectorAll('.tab-btn[data-src]'))
      .find(b => window.getComputedStyle(b).display !== 'none') || null;
  }
  if (initialBtn) gLoadTab(initialBtn);
  // 세션 헬스체크 시작
  gStartSessionWatch();
}

async function gInit() {
  const tk = gGetToken();
  if (tk) {
    const agent = await gFetchAgent();
    if (agent) { gOnLoggedIn(agent); return; }
  }
  document.getElementById('g-auth-overlay').style.display = '';
}

document.getElementById('g-auth-login-btn').addEventListener('click', async () => {
  const email = document.getElementById('g-auth-email').value.trim();
  const password = document.getElementById('g-auth-pass').value;
  const msg = document.getElementById('g-auth-msg');
  msg.textContent = '';
  if (!email || !password) { msg.textContent = '이메일/비밀번호 입력'; return; }
  try {
    await gLogin(email, password);
    const agent = await gFetchAgent();
    if (!agent) { msg.textContent = '권한 확인 실패'; gClearToken(); return; }
    gOnLoggedIn(agent);
  } catch (e) { msg.textContent = e.message; }
});
document.getElementById('g-auth-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('g-auth-login-btn').click();
});
document.getElementById('g-logout-btn').addEventListener('click', () => {
  gClearToken();
  location.reload();
});

// 비밀번호 변경 모달
document.getElementById('g-changepw-btn').addEventListener('click', () => {
  document.getElementById('g-pw-modal').style.display = 'flex';
  document.getElementById('g-pw-current').value = '';
  document.getElementById('g-pw-new').value = '';
  document.getElementById('g-pw-confirm').value = '';
  document.getElementById('g-pw-msg').textContent = '';
  setTimeout(() => document.getElementById('g-pw-current').focus(), 50);
});
document.getElementById('g-pw-cancel').addEventListener('click', () => {
  document.getElementById('g-pw-modal').style.display = 'none';
});
document.getElementById('g-pw-submit').addEventListener('click', async () => {
  const cur = document.getElementById('g-pw-current').value;
  const nw = document.getElementById('g-pw-new').value;
  const cf = document.getElementById('g-pw-confirm').value;
  const msg = document.getElementById('g-pw-msg');
  msg.style.color = '#dc2626';
  if (!cur || !nw || !cf) { msg.textContent = '모두 입력하세요'; return; }
  if (nw.length < 8) { msg.textContent = '새 비밀번호는 8자 이상'; return; }
  if (nw !== cf) { msg.textContent = '새 비밀번호 확인 불일치'; return; }
  if (cur === nw) { msg.textContent = '새 비밀번호가 현재와 동일'; return; }
  const tk = gGetToken();
  try {
    const res = await fetch(G_AUTH + '/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tk },
      body: JSON.stringify({ current_password: cur, new_password: nw }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { msg.textContent = data.error || '변경 실패'; return; }
    msg.style.color = '#16a34a';
    msg.textContent = '✅ 변경 완료';
    setTimeout(() => {
      document.getElementById('g-pw-modal').style.display = 'none';
      gShowToast('🔐 비밀번호 변경 완료');
    }, 800);
  } catch (e) { msg.textContent = e.message; }
});

// 사이드바 메뉴 바인딩
document.querySelectorAll('.tab-btn[data-src]').forEach(btn => {
  btn.addEventListener('click', () => gLoadTab(btn));
});

// 페이지 로드 후 init
setTimeout(gInit, 50);
</script>
</body>
</html>
