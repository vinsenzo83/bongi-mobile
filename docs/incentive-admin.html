<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인센티브 통합 (V5)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
* { box-sizing: border-box; margin:0; padding:0; }
html, body { height:100%; overflow:hidden; }
body { font-family: 'Pretendard Variable', sans-serif; background:#0f172a; color:#e2e8f0; display:flex; flex-direction:column; }
.top-bar { background:linear-gradient(135deg,#0f172a,#1e293b); border-bottom:1.5px solid #334155; padding:10px 20px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.top-bar h1 { font-size:16px; color:#f8fafc; font-weight:800; letter-spacing:-0.02em; }
.top-bar h1 .v { background:#3b82f6; color:#fff; padding:2px 8px; border-radius:4px; font-size:10px; margin-left:6px; }
.top-bar .user { display:flex; gap:10px; align-items:center; }
.top-bar .user-name { font-size:12px; color:#f8fafc; font-weight:700; }
.top-bar .user-meta { font-size:10px; color:#94a3b8; }
.role-badge { padding:2px 8px; border-radius:4px; font-size:10px; font-weight:800; }
.role-agent { background:#3b82f6; color:#fff; }
.role-manager { background:#16a34a; color:#fff; }
.role-contract { background:#0891b2; color:#fff; }
.role-admin { background:#dc2626; color:#fff; }
.top-bar button { background:#475569; color:#fff; border:none; padding:5px 11px; border-radius:5px; cursor:pointer; font-size:11px; font-weight:700; }
.main { flex:1; display:flex; min-height:0; }
aside.sidebar { width:200px; background:#1e293b; border-right:1.5px solid #334155; padding:14px 0; display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
.tab-btn { background:transparent; border:none; color:#cbd5e1; padding:11px 18px; text-align:left; cursor:pointer; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:10px; border-left:3px solid transparent; transition:all 0.15s; font-family:inherit; }
.tab-btn:hover { background:rgba(59,130,246,0.1); color:#f8fafc; }
.tab-btn.active { background:rgba(59,130,246,0.15); color:#60a5fa; border-left-color:#3b82f6; font-weight:800; }
.tab-btn .icon { font-size:14px; }
.tab-btn[data-roles] { display:none; }
body.role-agent .tab-btn[data-roles*="agent"] { display:flex; }
body.role-manager .tab-btn[data-roles*="manager"] { display:flex; }
body.role-contract .tab-btn[data-roles*="contract"] { display:flex; }
body.role-admin .tab-btn[data-roles*="admin"] { display:flex; }
.sidebar-divider { border-top:1px solid #334155; margin:14px 14px; }
.sidebar-link { color:#94a3b8; padding:8px 18px; text-decoration:none; font-size:11px; }
.sidebar-link:hover { color:#f8fafc; }
.content { flex:1; min-width:0; background:#0f172a; position:relative; }
iframe.tab-pane { width:100%; height:100%; border:none; background:#0f172a; display:none; }
iframe.tab-pane.active { display:block; }
.auth-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.95); display:flex; justify-content:center; align-items:center; z-index:9999; }
.auth-box { background:linear-gradient(135deg,#1e293b,#334155); border:1.5px solid #475569; border-radius:12px; padding:24px 28px; width:380px; box-shadow:0 20px 60px rgba(0,0,0,0.6); }
.auth-box h2 { font-size:16px; color:#60a5fa; font-weight:800; margin-bottom:14px; }
.auth-box input { width:100%; background:#0f172a; border:1px solid #475569; color:#e2e8f0; padding:10px 12px; border-radius:6px; font-size:13px; margin-bottom:8px; }
.auth-box button { width:100%; background:#3b82f6; color:#fff; border:none; padding:11px; border-radius:6px; font-weight:800; cursor:pointer; font-size:13px; }
.auth-msg { font-size:11px; margin-top:8px; min-height:16px; color:#dc2626; }
.auth-hint { font-size:10px; color:#94a3b8; margin-top:10px; line-height:1.5; }
input[type="date"], input[type="month"] { color-scheme: dark; }
</style>
</head>
<body>

<header class="top-bar">
  <h1>⚡ 인센티브 통합<span class="v">V5</span></h1>
  <div class="user" id="user-info" style="display:none">
    <div>
      <div class="user-name" id="user-name">-</div>
      <div class="user-meta"><span class="role-badge" id="role-badge">-</span> · <span id="user-center">-</span></div>
    </div>
    <button id="logout-btn">로그아웃</button>
  </div>
</header>

<div class="main" id="main" style="display:none">
  <aside class="sidebar">
    <button class="tab-btn" data-tab="tm" data-roles="agent,manager,admin"><span class="icon">📞</span> TM 견적·영업</button>
    <button class="tab-btn" data-tab="dashboard" data-roles="manager,contract,admin"><span class="icon">📊</span> 대시보드</button>
    <button class="tab-btn" data-tab="contract" data-roles="manager,contract,admin"><span class="icon">📋</span> 계약 처리</button>
    <button class="tab-btn" data-tab="agents" data-roles="admin"><span class="icon">👥</span> 상담사 관리</button>
    <button class="tab-btn" data-tab="rules" data-roles="admin"><span class="icon">⚙️</span> 정책 관리</button>
    <div class="sidebar-divider"></div>
    <a class="sidebar-link" href="/docs/master-map.html">↗ 전체 문서맵</a>
  </aside>

  <div class="content">
    <iframe class="tab-pane" id="pane-tm" data-loaded="false"></iframe>
    <iframe class="tab-pane" id="pane-dashboard" data-loaded="false"></iframe>
    <iframe class="tab-pane" id="pane-contract" data-loaded="false"></iframe>
    <iframe class="tab-pane" id="pane-agents" data-loaded="false"></iframe>
    <iframe class="tab-pane" id="pane-rules" data-loaded="false"></iframe>
  </div>
</div>

<div class="auth-overlay" id="auth-overlay">
  <div class="auth-box">
    <h2>🔐 인센티브 통합 로그인</h2>
    <input type="email" id="auth-email" placeholder="email" autocomplete="username">
    <input type="password" id="auth-pass" placeholder="비밀번호" autocomplete="current-password">
    <button id="auth-login-btn">로그인</button>
    <div class="auth-msg" id="auth-msg"></div>
    <div class="auth-hint">
      4개 역할 (agent / manager / contract / admin) 로그인 가능. 권한별로 다른 메뉴 노출.<br>
      테스트: <code style="background:#0f172a;padding:1px 5px;border-radius:3px">agent1</code> / <code>manager1</code> / <code>admin1</code> @bongi.test (비번 <code>pass1234!</code>)
    </div>
  </div>
</div>

<script>
const API = '/api/incentive';
const AUTH = '/api/auth';
const TOKEN_KEY = 'incentive-auth-token-v1';
const getToken = () => localStorage.getItem(TOKEN_KEY);
const setToken = (t) => localStorage.setItem(TOKEN_KEY, t);
const clearToken = () => localStorage.removeItem(TOKEN_KEY);

const TAB_URLS = {
  tm: '/docs/tm-counselor.html',
  dashboard: '/docs/incentive-dashboard.html',
  contract: '/docs/incentive-contract.html',
  agents: '/docs/incentive-agents.html',
  rules: '/docs/incentive-rules.html',
};

const DEFAULT_TAB = {
  agent: 'tm',
  manager: 'dashboard',
  contract: 'contract',
  admin: 'dashboard',
};

async function login(email, password) {
  const res = await fetch(AUTH + '/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  if (!res.ok) throw new Error((await res.json()).error || '로그인 실패');
  const data = await res.json();
  setToken(data.access_token);
  return data;
}

async function fetchAgent() {
  const tk = getToken(); if (!tk) return null;
  const res = await fetch(API + '/agents/me', {headers: {Authorization: 'Bearer ' + tk}});
  if (!res.ok) { clearToken(); return null; }
  return (await res.json()).agent;
}

function loadTabIframe(tabName) {
  const pane = document.getElementById('pane-' + tabName);
  if (!pane) return;
  if (pane.dataset.loaded === 'false') {
    pane.src = TAB_URLS[tabName];
    pane.dataset.loaded = 'true';
  }
}

function switchTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabName));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + tabName));
  loadTabIframe(tabName);
}

function onLoggedIn(agent) {
  document.getElementById('user-name').textContent = '👤 ' + agent.name;
  document.getElementById('user-center').textContent = agent.center;
  const badge = document.getElementById('role-badge');
  badge.textContent = agent.role;
  badge.className = 'role-badge role-' + agent.role;
  document.getElementById('user-info').style.display = '';
  document.getElementById('main').style.display = '';
  document.getElementById('auth-overlay').style.display = 'none';
  document.body.classList.remove('role-agent', 'role-manager', 'role-contract', 'role-admin');
  document.body.classList.add('role-' + agent.role);
  // 권한 계층: admin > manager > agent / contract는 별도(계약+대시보드)
  if (agent.role === 'admin') document.body.classList.add('role-manager', 'role-contract', 'role-agent');
  if (agent.role === 'manager') document.body.classList.add('role-agent');
  switchTab(DEFAULT_TAB[agent.role] || 'tm');
}

async function init() {
  const tk = getToken();
  if (tk) {
    const agent = await fetchAgent();
    if (agent) { onLoggedIn(agent); return; }
  }
  document.getElementById('auth-overlay').style.display = '';
}

document.getElementById('auth-login-btn').addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-pass').value;
  const msg = document.getElementById('auth-msg');
  msg.textContent = '';
  if (!email || !password) { msg.textContent = '이메일/비밀번호 입력'; return; }
  try {
    await login(email, password);
    const agent = await fetchAgent();
    if (!agent) { msg.textContent = 'incentive_agent 미등록'; clearToken(); return; }
    onLoggedIn(agent);
  } catch (e) { msg.textContent = e.message; }
});
document.getElementById('auth-pass').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('auth-login-btn').click(); });
document.getElementById('logout-btn').addEventListener('click', () => { clearToken(); location.reload(); });
document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

init();
</script>
</body>
</html>
