<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏢 부서별 통계</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family:'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Pretendard Variable',sans-serif; background:#0f172a; color:#e2e8f0; padding:18px 18px 80px; min-height:100vh; }
.wrap { max-width:1400px; margin:0 auto; }
header { display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px solid #334155; margin-bottom:14px; }
h1 { font-size:20px; }
h1 .accent { color:#fbbf24; }

.toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; padding:12px 14px; background:linear-gradient(135deg,#1e293b,#0f172a); border:1px solid #334155; border-radius:10px; }
.toolbar label { font-size:11px; color:#94a3b8; }
.toolbar input, .toolbar select { background:#0f172a; border:1px solid #475569; color:#e2e8f0; padding:7px 10px; border-radius:6px; font-size:12px; font-family:inherit; margin-left:4px; }
.toolbar button { background:#3b82f6; color:#fff; border:none; padding:8px 16px; border-radius:6px; font-weight:700; cursor:pointer; font-size:12px; font-family:inherit; }
.toolbar button.muted { background:#475569; }
.toolbar button:hover { opacity:0.85; }
.last-update { margin-left:auto; font-size:11px; color:#64748b; }

.summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
.summary-card { background:linear-gradient(135deg,#1e293b,#0f172a); border:1px solid #334155; border-radius:10px; padding:12px 14px; }
.summary-card .lbl { font-size:10.5px; color:#94a3b8; font-weight:600; margin-bottom:4px; }
.summary-card .val { font-size:18px; font-weight:900; color:#fbbf24; }
.summary-card .sub { font-size:10px; color:#64748b; margin-top:2px; }

.dept-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:14px; }
.dept-card { background:linear-gradient(135deg,#1e293b,#0f172a); border:1.5px solid #475569; border-radius:12px; padding:16px 18px; transition:border-color 0.15s; }
.dept-card:hover { border-color:#fbbf24; }
.dept-card.empty-dept { opacity:0.55; border-style:dashed; }
.dept-card.rank-1 { border-color:#fbbf24; box-shadow:0 0 0 1px rgba(251,191,36,0.2); }
.dept-card.rank-2 { border-color:#cbd5e1; }
.dept-card.rank-3 { border-color:#fb923c; }

.dept-header { display:flex; justify-content:space-between; align-items:start; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #334155; }
.dept-name { font-size:15px; font-weight:800; color:#f8fafc; }
.dept-rank { font-size:10px; font-weight:900; padding:2px 8px; border-radius:10px; background:#475569; color:#cbd5e1; }
.dept-rank.rank-1 { background:#fbbf24; color:#78350f; }
.dept-rank.rank-2 { background:#cbd5e1; color:#0f172a; }
.dept-rank.rank-3 { background:#fb923c; color:#7c2d12; }
.dept-cats { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.cat-chip { font-size:9.5px; padding:2px 7px; border-radius:10px; background:rgba(59,130,246,0.15); color:#93c5fd; border:1px solid rgba(59,130,246,0.3); font-weight:700; }
.cat-chip.none { background:rgba(100,116,139,0.15); color:#94a3b8; border-color:rgba(100,116,139,0.3); }

.dept-stats { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:10px; }
.stat-item { background:rgba(15,23,42,0.6); border:1px solid #334155; border-radius:8px; padding:9px 11px; }
.stat-item .stat-lbl { font-size:10px; color:#94a3b8; font-weight:600; margin-bottom:3px; display:flex; align-items:center; gap:4px; }
.stat-item .stat-val { font-size:17px; font-weight:900; color:#e2e8f0; }
.stat-item .stat-val.green { color:#86efac; }
.stat-item .stat-val.blue { color:#93c5fd; }
.stat-item .stat-val.yellow { color:#fbbf24; }
.stat-item .stat-val.orange { color:#fdba74; }
.stat-item .stat-sub { font-size:9.5px; color:#64748b; margin-top:2px; }

.dept-status { display:flex; gap:6px; margin-top:8px; padding-top:10px; border-top:1px solid #334155; }
.status-pill { flex:1; font-size:10.5px; padding:5px 8px; border-radius:6px; text-align:center; font-weight:700; }
.status-pill.completed { background:rgba(34,197,94,0.12); color:#86efac; border:1px solid rgba(34,197,94,0.25); }
.status-pill.cancelled { background:rgba(239,68,68,0.12); color:#fca5a5; border:1px solid rgba(239,68,68,0.25); }

.empty { text-align:center; padding:60px 20px; color:#64748b; background:linear-gradient(135deg,#1e293b,#0f172a); border:1px dashed #475569; border-radius:10px; }
.empty.error { color:#fca5a5; border-color:#dc2626; }

#toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#16a34a; color:#fff; padding:14px 24px; border-radius:10px; font-weight:800; z-index:99999; opacity:0; transition:opacity 0.2s; pointer-events:none; }
#toast.show { opacity:1; }

@media (max-width:700px) {
  .summary { grid-template-columns:repeat(2,1fr); }
  .dept-grid { grid-template-columns:1fr; }
}
</style>
<script>
// iframe embed 모드 — 헤더 숨김 (incentive-admin.html에서 임베드 시)
(function(){
  if (window !== window.parent) {
    document.documentElement.classList.add('embedded-mode');
    var s = document.createElement('style');
    s.textContent = '.embedded-mode header { display:none !important; } body { padding-top:14px !important; }';
    document.head.appendChild(s);
  }
})();
</script>
<script src="/docs/_security.js" defer></script>
<script src="/docs/_shared/incentive-auth.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="accent">🏢</span> 부서별 통계</h1>
    <div id="user-info" style="font-size:12px;color:#cbd5e1"><span id="user-name">-</span></div>
  </header>

  <div id="main" style="display:none">
    <div class="toolbar">
      <label>월:
        <input type="month" id="f-ym">
      </label>
      <button class="muted" onclick="loadStats()">🔄 새로고침</button>
      <span class="last-update" id="last-update">-</span>
    </div>

    <div class="summary" id="summary"></div>

    <div class="dept-grid" id="dept-grid">
      <div class="empty">로딩 중...</div>
    </div>
  </div>

  <div id="auth-required" class="empty" style="display:none">🔐 로그인이 필요합니다</div>
  <div id="forbidden" class="empty error" style="display:none">⛔ admin/manager 권한 전용 페이지입니다</div>
</div>

<div id="toast"></div>

<script>
// 공통 인증 (incentive-auth.js 사용) — getToken/apiCall 글로벌 export됨
const TK_KEY = 'incentive-auth-token-v1';
const _tk = () => localStorage.getItem(TK_KEY);
async function fetchAuth(url, opts = {}) {
  return fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + _tk() }});
}
const esc = (s) => String(s ?? '').replace(/[<>&"']/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt = (n) => Number(n || 0).toLocaleString('ko-KR');
const fmtKrw = (n) => '₩ ' + fmt(n);
function showToast(m, ok=true) {
  const t = document.getElementById('toast');
  t.style.background = ok ? '#16a34a' : '#dc2626';
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function init() {
  if (!_tk()) { document.getElementById('auth-required').style.display = ''; return; }
  try {
    const r = await fetchAuth('/api/incentive/agents/me');
    if (!r.ok) { document.getElementById('auth-required').style.display = ''; return; }
    const me = (await r.json()).agent;
    window._myAgent = me;
    document.getElementById('user-name').textContent = me.name + ' (' + me.role + ')';
    if (!['admin', 'manager'].includes(me.role)) {
      document.getElementById('forbidden').style.display = '';
      return;
    }
    document.getElementById('main').style.display = '';
    document.getElementById('f-ym').value = new Date().toISOString().slice(0, 7);
    document.getElementById('f-ym').addEventListener('change', loadStats);
    loadStats();
  } catch (e) {
    document.getElementById('auth-required').innerHTML = '오류: ' + esc(e.message);
    document.getElementById('auth-required').style.display = '';
  }
}

async function loadStats() {
  const ym = document.getElementById('f-ym').value || new Date().toISOString().slice(0, 7);
  const grid = document.getElementById('dept-grid');
  const summaryEl = document.getElementById('summary');
  grid.innerHTML = '<div class="empty">로딩 중...</div>';
  summaryEl.innerHTML = '';

  try {
    const r = await fetchAuth('/api/incentive/departments/stats?ym=' + encodeURIComponent(ym));
    if (!r.ok) {
      const errData = await r.json().catch(() => ({}));
      grid.innerHTML = `<div class="empty error">조회 실패 (${r.status}): ${esc(errData.error || '알 수 없는 오류')}</div>`;
      return;
    }
    const data = await r.json();
    document.getElementById('last-update').textContent = '갱신 ' + new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});

    const depts = data.departments || [];
    if (!depts.length) {
      grid.innerHTML = `<div class="empty">${esc(ym)} 부서 데이터 없음</div>`;
      return;
    }

    // 통계 정규화 — 서버 응답이 stats.{count, monthly_fee, payback} 구조이거나 확장 필드(rental_count 등)일 수 있음
    const normalize = (s) => {
      s = s || {};
      const rental = Number(s.rental_count || 0);
      const internet = Number(s.internet_count || 0);
      const total = Number(s.total_count != null ? s.total_count : (s.count != null ? s.count : (rental + internet)));
      return {
        rental_count: rental,
        internet_count: internet,
        total_count: total,
        total_monthly_fee: Number(s.total_monthly_fee != null ? s.total_monthly_fee : (s.monthly_fee || 0)),
        total_payback: Number(s.total_payback != null ? s.total_payback : (s.payback || 0)),
        completed_count: Number(s.completed_count || 0),
        cancelled_count: Number(s.cancelled_count || 0),
      };
    };

    // 정렬: 총 영업 건수 내림차순
    const sorted = depts.map(d => ({ ...d, _stats: normalize(d.stats) }))
      .sort((a, b) => (b._stats.total_count) - (a._stats.total_count));

    // 상단 합계 카드
    const totals = sorted.reduce((acc, d) => {
      acc.depts += 1;
      acc.total_count += d._stats.total_count;
      acc.monthly_fee += d._stats.total_monthly_fee;
      acc.payback += d._stats.total_payback;
      return acc;
    }, { depts: 0, total_count: 0, monthly_fee: 0, payback: 0 });

    summaryEl.innerHTML = `
      <div class="summary-card"><div class="lbl">📊 부서 수</div><div class="val">${fmt(totals.depts)}</div><div class="sub">활성 부서</div></div>
      <div class="summary-card"><div class="lbl">📦 총 영업 건수</div><div class="val">${fmt(totals.total_count)}</div><div class="sub">${esc(ym)}</div></div>
      <div class="summary-card"><div class="lbl">💰 총 매출 (월 요금)</div><div class="val">${fmtKrw(totals.monthly_fee)}</div><div class="sub">월 누적</div></div>
      <div class="summary-card"><div class="lbl">💵 총 페이백</div><div class="val">${fmtKrw(totals.payback)}</div><div class="sub">지급 누계</div></div>
    `;

    // 부서 카드
    grid.innerHTML = sorted.map((d, idx) => {
      const s = d._stats;
      const isEmpty = s.total_count === 0;
      const rank = idx + 1;
      const rankCls = (rank <= 3 && !isEmpty) ? ` rank-${rank}` : '';
      const rankPillCls = (rank <= 3 && !isEmpty) ? ` rank-${rank}` : '';
      const cats = Array.isArray(d.categories) ? d.categories : [];
      const catsHtml = cats.length
        ? cats.map(c => `<span class="cat-chip">${esc(c)}</span>`).join('')
        : '<span class="cat-chip none">미지정</span>';
      const hasStatus = s.completed_count > 0 || s.cancelled_count > 0;
      return `
        <div class="dept-card${rankCls}${isEmpty ? ' empty-dept' : ''}">
          <div class="dept-header">
            <div style="flex:1">
              <div class="dept-name">${esc(d.name || '미지정')}</div>
              <div class="dept-cats">${catsHtml}</div>
            </div>
            <div class="dept-rank${rankPillCls}">#${rank}</div>
          </div>
          <div class="dept-stats">
            <div class="stat-item">
              <div class="stat-lbl">🔌 가전 영업</div>
              <div class="stat-val blue">${fmt(s.rental_count)} <span style="font-size:11px;color:#64748b">건</span></div>
            </div>
            <div class="stat-item">
              <div class="stat-lbl">📡 인터넷+TV</div>
              <div class="stat-val green">${fmt(s.internet_count)} <span style="font-size:11px;color:#64748b">건</span></div>
            </div>
            <div class="stat-item">
              <div class="stat-lbl">💰 총 매출</div>
              <div class="stat-val yellow">${fmtKrw(s.total_monthly_fee)}</div>
              <div class="stat-sub">월 요금 누계</div>
            </div>
            <div class="stat-item">
              <div class="stat-lbl">💵 총 페이백</div>
              <div class="stat-val orange">${fmtKrw(s.total_payback)}</div>
              <div class="stat-sub">지급 누계</div>
            </div>
          </div>
          ${hasStatus ? `
          <div class="dept-status">
            <div class="status-pill completed">✅ 완료 ${fmt(s.completed_count)}</div>
            <div class="status-pill cancelled">❌ 취소 ${fmt(s.cancelled_count)}</div>
          </div>` : ''}
        </div>
      `;
    }).join('');
  } catch (e) {
    grid.innerHTML = `<div class="empty error">오류: ${esc(e.message)}</div>`;
  }
}

init();
</script>
</body>
</html>
