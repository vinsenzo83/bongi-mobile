<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>봉이 storefront 기획서</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', sans-serif; background: #0f172a; color: #e2e8f0; }
  .layout { display: flex; height: 100vh; }
  .sidebar { width: 280px; background: #020617; border-right: 1px solid #1e293b; padding: 18px; overflow-y: auto; }
  .sidebar h1 { font-size: 16px; color: #fbbf24; margin: 0 0 12px; }
  .sidebar .desc { font-size: 11px; color: #64748b; margin-bottom: 18px; }
  .doc-btn { display: block; width: 100%; text-align: left; background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 10px 12px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 600; transition: all 0.15s; }
  .doc-btn:hover, .doc-btn.active { background: #fbbf24; color: #0f172a; border-color: #fbbf24; }
  .doc-meta { font-size: 10.5px; color: #94a3b8; margin-top: 3px; font-weight: 400; }
  .doc-btn.active .doc-meta { color: rgba(15,23,42,0.7); }
  .toc { margin-top: 24px; }
  .toc h2 { font-size: 12px; color: #64748b; text-transform: uppercase; margin: 0 0 8px; letter-spacing: 0.5px; }
  .toc a { display: block; padding: 4px 8px; font-size: 11.5px; color: #94a3b8; text-decoration: none; border-radius: 4px; line-height: 1.4; }
  .toc a:hover { background: #1e293b; color: #fbbf24; }
  .toc a.h2 { padding-left: 8px; font-weight: 700; color: #cbd5e1; margin-top: 4px; }
  .toc a.h3 { padding-left: 20px; }
  .content { flex: 1; overflow-y: auto; padding: 32px 48px; max-width: 1100px; }
  .content h1 { color: #fbbf24; font-size: 28px; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-top: 0; }
  .content h2 { color: #f8fafc; font-size: 22px; margin-top: 32px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
  .content h3 { color: #fbbf24; font-size: 17px; margin-top: 24px; }
  .content p, .content li { line-height: 1.7; font-size: 14px; color: #cbd5e1; }
  .content code { background: #1e293b; color: #fbbf24; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
  .content pre { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 16px; overflow-x: auto; }
  .content pre code { background: transparent; color: #e2e8f0; padding: 0; }
  .content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
  .content th { background: #1e293b; color: #fbbf24; text-align: left; padding: 10px 12px; border: 1px solid #334155; }
  .content td { padding: 9px 12px; border: 1px solid #334155; color: #cbd5e1; vertical-align: top; }
  .content tr:nth-child(even) td { background: #0c1424; }
  .content blockquote { border-left: 3px solid #fbbf24; padding-left: 16px; color: #94a3b8; margin: 16px 0; font-style: italic; }
  .content hr { border: 0; border-top: 1px solid #1e293b; margin: 32px 0; }
  .content strong { color: #f8fafc; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 9.5px; font-weight: 800; }
  .b-pink { background: #ec4899; color: #fff; }
  .b-yellow { background: #fbbf24; color: #0f172a; }
  .toolbar { position: sticky; top: 0; background: rgba(15,23,42,0.95); backdrop-filter: blur(8px); padding: 8px 0 12px; margin-bottom: 16px; z-index: 10; }
  .toolbar a { display: inline-block; background: #1e293b; color: #fbbf24; padding: 4px 12px; border-radius: 4px; font-size: 11px; text-decoration: none; margin-right: 6px; }
  .loading { color: #64748b; padding: 40px; text-align: center; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>🚀 storefront 기획서</h1>
    <div class="desc">봉이 차기 채팅 플랫폼 (Allio) 기획 문서 모음</div>
    <button class="doc-btn active" data-doc="storefront-scope-2026-06-03.md" style="background:#fbbf24;color:#0f172a;border-color:#fbbf24">
      ⭐ 범위 (4 화면만)
      <div class="doc-meta" style="color:rgba(15,23,42,0.7)">결정 — 더 복잡하게 가지 X</div>
    </button>
    <button class="doc-btn" data-doc="storefront-data-2026-06-03.md">
      📊 데이터 구축
      <div class="doc-meta">상품·카드·신청 3 표 — 입력→노출 흐름</div>
    </button>
    <button class="doc-btn" data-doc="../wireframes/01-customer-calculator.html">
      ① 가전 렌탈 계산기 (고객)
      <div class="doc-meta">chip 6 step + 매장/온라인 + 듀얼 CTA</div>
    </button>
    <button class="doc-btn" data-doc="../wireframes/02-admin-product-form.html">
      ② 어드민 상품 정보 등록
      <div class="doc-meta">기본·이미지·약정·가격·상세 (AI 자동 채움)</div>
    </button>
    <button class="doc-btn" data-doc="../wireframes/03-admin-card-form.html">
      ③ 어드민 카드 정보 등록
      <div class="doc-meta">카드사·카테고리·1·2·3 구간 · 미리보기</div>
    </button>
    <button class="doc-btn" data-doc="../wireframes/04-admin-applications.html">
      ④ 어드민 신청서 페이지
      <div class="doc-meta">stats·필터·table·디테일 toast</div>
    </button>
    <button class="doc-btn" data-doc="../flow-rental.html" style="opacity:0.6">
      📜 (참고) 기존 flow-rental
      <div class="doc-meta">렌트리 시점 — deprecated</div>
    </button>
    <div class="toc" id="toc">
      <h2>목차</h2>
    </div>
  </aside>
  <main class="content" id="content">
    <div class="loading">기획서 로딩 중...</div>
  </main>
</div>
<script>
  const docButtons = document.querySelectorAll('.doc-btn');
  const content = document.getElementById('content');
  const tocEl = document.getElementById('toc');
  let currentDoc = 'storefront-scope-2026-06-03.md';

  async function loadDoc(doc) {
    currentDoc = doc;
    content.innerHTML = '<div class="loading">기획서 로딩 중...</div>';
    try {
      const isHtml = doc.endsWith('.html');
      const path = isHtml ? '/docs/' + doc.replace('../', '') : '/docs/specs/' + doc;
      const r = await fetch(path + '?v=' + Date.now());
      const text = await r.text();
      const html = isHtml ? text : marked.parse(text);
      content.innerHTML = `<div class="toolbar">
        <a href="${path}" target="_blank">📄 raw</a>
        <a href="https://github.com/vinsenzo83/bongi-mobile/blob/master${path}" target="_blank">🐙 GitHub</a>
      </div>` + html;
      buildToc();
      content.scrollTo({ top: 0 });
    } catch (e) {
      content.innerHTML = '<div class="loading" style="color:#ef4444">로드 실패: ' + e.message + '</div>';
    }
  }

  function buildToc() {
    const headers = content.querySelectorAll('h1, h2, h3');
    let html = '<h2>목차</h2>';
    headers.forEach((h, i) => {
      const text = h.textContent.trim();
      const id = 'h-' + i;
      h.id = id;
      const cls = h.tagName.toLowerCase();
      html += `<a class="${cls}" href="#${id}" onclick="event.preventDefault();document.getElementById('${id}').scrollIntoView({behavior:'smooth',block:'start'})">${text.slice(0, 50)}</a>`;
    });
    tocEl.innerHTML = html;
  }

  docButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      docButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadDoc(btn.dataset.doc);
    });
  });

  loadDoc(currentDoc);
</script>
</body>
</html>
