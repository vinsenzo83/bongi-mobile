<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>봉이 TM CRM — 고객 관리 (통합 360°)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="/docs/_security.js" defer></script>
<script src="/docs/_shared/incentive-auth.js" defer></script>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--text:#e2e8f0;--muted:#94a3b8;--primary:#3617ce;--accent:#fbbf24;--green:#22c55e;--red:#dc2626;--blue:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Pretendard,sans-serif;font-size:13px;line-height:1.5;padding:12px;height:100vh;overflow:hidden;display:flex;flex-direction:column}
h1{font-size:16px;font-weight:900;color:#f8fafc;display:flex;align-items:center;gap:8px;margin-bottom:6px}

/* 헤더 toolbar */
.hdr-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
.toolbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex:1}
.toolbar input,.toolbar select{background:#0f172a;border:1px solid var(--line);color:var(--text);padding:5px 9px;border-radius:5px;font-size:11.5px;font-family:inherit}
.toolbar input{min-width:200px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--primary)}

/* 본문 그리드 */
.main{display:grid;grid-template-columns:35% 65%;gap:8px;flex:1;overflow:hidden}
@media (max-width:900px){.main{grid-template-columns:1fr}}

/* 좌측 list */
.left{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.left-filter{padding:6px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10px;padding:3px 8px;border-radius:11px;background:#334155;color:var(--muted);cursor:pointer;border:1px solid transparent;user-select:none}
.chip.active{background:#0891b2;color:#fff;border-color:#0891b2}
.chip.warn.active{background:var(--accent);color:#0f172a;border-color:var(--accent)}
.left-meta{padding:5px 10px;font-size:10px;color:var(--muted);border-bottom:1px solid var(--line)}
.left-list{flex:1;overflow-y:auto;padding:6px 8px}
.lead-card{background:#0f172a;border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-bottom:5px;cursor:pointer;transition:all .12s}
.lead-card:hover{border-color:#0891b2}
.lead-card.active{border-color:var(--accent);background:rgba(251,191,36,0.05)}
.lc-r1{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.lc-name{font-weight:700;font-size:12.5px;color:#f1f5f9}
.lc-name .grade{display:inline-block;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:middle}
.g-S{background:#fbbf24;color:#0f172a}
.g-A{background:#60a5fa;color:#0f172a}
.g-B{background:#94a3b8;color:#0f172a}
.g-R{background:#a78bfa;color:#0f172a}
.g-C{background:#475569;color:#cbd5e1}
.lc-status{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:10px}
.st-pending{background:rgba(148,163,184,0.15);color:#cbd5e1}
.st-in_progress{background:rgba(96,165,250,0.18);color:#93c5fd}
.st-completed{background:rgba(34,197,94,0.18);color:#86efac}
.st-rejected{background:rgba(220,38,38,0.18);color:#fca5a5}
.lc-r2{font-size:10.5px;color:var(--muted);font-family:'SF Mono',Monaco,monospace}
.lc-r3{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.chan-chip{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:700}
.ch-calldb{background:rgba(99,102,241,0.18);color:#a5b4fc}
.ch-web{background:rgba(96,165,250,0.18);color:#60a5fa}
.ch-app{background:rgba(134,239,172,0.18);color:#86efac}
.ch-store{background:rgba(251,191,36,0.18);color:#fbbf24}
.ch-usedphone{background:rgba(167,139,250,0.18);color:#a78bfa}
.prod-chip{font-size:9px;padding:2px 6px;border-radius:3px;background:rgba(148,163,184,0.1);color:#cbd5e1;font-weight:600}
.lc-r4{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.lc-age{font-size:9.5px;font-weight:700}
.age-0{color:#86efac}
.age-1{color:#fbbf24}
.age-2{color:#fb923c}
.age-3{color:#ef4444}
.nba-badge{background:var(--accent);color:#0f172a;font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}

/* 우측 360° 패널 */
.right{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-y:auto;position:relative}
#edit-overlay { position:absolute; top:0; left:0; right:0; }
.section{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec-title{font-size:10.5px;color:var(--accent);font-weight:800;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:0.04em}
.sec-title .meta{font-size:10px;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}

/* A. 회원 헤더 */
.profile-hdr{display:flex;gap:14px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#0891b2,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;flex-shrink:0}
.prof-name{font-size:17px;font-weight:900;color:#f8fafc;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prof-phone{font-family:'SF Mono',Monaco,monospace;font-size:12.5px;color:#cbd5e1;margin-top:2px}
.prof-chips{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.prof-chip{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700}
.chip-on{background:rgba(34,197,94,0.18);color:#86efac}
.chip-off{background:rgba(148,163,184,0.18);color:#94a3b8}
.chip-pass-no{background:rgba(220,38,38,0.15);color:#fca5a5}
.chip-social{background:rgba(251,191,36,0.18);color:#fbbf24}

/* B. timeline */
.timeline{position:relative;padding-left:18px}
.timeline::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.tl-item{position:relative;padding-bottom:9px}
.tl-item::before{content:'';position:absolute;left:-15px;top:5px;width:9px;height:9px;border-radius:50%;background:#475569;border:2px solid var(--panel);z-index:1}
.tl-item:first-child::before{background:var(--accent)}
.tl-date{font-size:10px;color:var(--muted);font-family:'SF Mono',Monaco,monospace;margin-bottom:2px}
.tl-desc{font-size:11.5px;color:#cbd5e1}

/* C. 통화 */
.call-item{background:#0f172a;border:1px solid var(--line);border-left:3px solid #60a5fa;border-radius:5px;padding:8px 12px;margin-bottom:5px}
.call-item.success{border-left-color:var(--green)}
.call-item.reject{border-left-color:var(--red)}
.call-item.absent{border-left-color:#94a3b8}
.call-item.callback{border-left-color:var(--accent)}
.call-hdr{display:flex;justify-content:space-between;font-size:11px;color:#cbd5e1;margin-bottom:3px}
.call-hdr b{color:var(--accent);font-weight:700}
.call-result{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:3px}
.cr-success{background:rgba(34,197,94,0.18);color:#86efac}
.cr-reject{background:rgba(220,38,38,0.18);color:#fca5a5}
.cr-absent{background:rgba(148,163,184,0.18);color:#cbd5e1}
.cr-callback{background:rgba(251,191,36,0.18);color:var(--accent)}
.call-summary{font-size:11px;color:var(--muted);line-height:1.5}
.next-call{background:rgba(251,191,36,0.08);border:1px dashed var(--accent);border-radius:5px;padding:7px 12px;font-size:11px;color:var(--accent);font-weight:700;text-align:center;margin-top:6px}

/* D. cross-sell */
.cross-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cross-card{background:#0f172a;border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.cross-card.has{border-color:var(--green)}
.cross-card.quote{border-color:var(--accent)}
.cross-card.empty{opacity:0.5}
.cross-title{font-size:11px;color:#cbd5e1;font-weight:700;margin-bottom:5px}
.cross-val{font-size:14px;font-weight:900;color:#f8fafc}
.cross-sub{font-size:10px;color:var(--muted);margin-top:2px}

/* E. 금융 */
.fin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.fin-card{background:#0f172a;border:1px solid var(--line);border-radius:6px;padding:9px 11px;text-align:center}
.fin-card.alert{border-color:var(--red)}
.fin-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:3px}
.fin-val{font-size:13px;font-weight:900;color:#f8fafc;font-family:'SF Mono',Monaco,monospace}
.fin-card.alert .fin-val{color:#fca5a5}
.fin-sub{font-size:9.5px;color:var(--muted);margin-top:2px}

/* F. NBA */
.nba-list{display:flex;flex-direction:column;gap:5px}
.nba-item{background:linear-gradient(135deg,rgba(251,191,36,0.1),rgba(245,158,11,0.05));border:1px solid var(--accent);border-radius:6px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.nba-icon{font-size:17px}
.nba-msg{flex:1;font-size:11px;color:#fef3c7;line-height:1.5}
.nba-msg b{color:var(--accent)}

/* G. action bar */
.action-bar{position:sticky;bottom:0;background:rgba(15,23,42,0.95);backdrop-filter:blur(8px);border-top:2px solid var(--accent);padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;z-index:10}
.btn{background:#334155;color:#cbd5e1;border:1px solid var(--line);padding:6px 11px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:#475569}
.btn-primary{background:#0891b2;color:#fff;border-color:#0891b2}
.btn-success{background:#16a34a;color:#fff;border-color:#16a34a}
.btn-warn{background:#f59e0b;color:#0f172a;border-color:#f59e0b}
.btn-danger{background:#dc2626;color:#fff;border-color:#dc2626}

.empty-state{padding:60px 20px;text-align:center;color:#64748b;font-size:13px}

/* 모달 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1.5px solid var(--accent);border-radius:10px;width:90%;max-width:500px;padding:18px 22px}
.modal h3{font-size:14px;color:var(--accent);margin-bottom:12px}
.modal label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;margin-top:8px}
.modal input,.modal select,.modal textarea{width:100%;background:#0f172a;border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:5px;font-size:12px;font-family:inherit}
.modal textarea{min-height:70px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}

/* scrollbar */
.left-list::-webkit-scrollbar,.right::-webkit-scrollbar{width:6px}
.left-list::-webkit-scrollbar-thumb,.right::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
</style>
</head>
<body>

<div class="hdr-bar">
  <h1>👥 고객 관리 <span style="font-size:11px;color:var(--muted);font-weight:400">· 통합 360°</span></h1>
  <div class="toolbar">
    <input type="text" id="ft-search" placeholder="🔍 이름·전화·메모 full-text">
    <select id="ft-status">
      <option value="">전체 상태</option>
      <option value="pending">⏳ 미접촉</option>
      <option value="in_progress">📞 시도중</option>
      <option value="completed">✅ 완료</option>
      <option value="rejected">❌ 거절</option>
    </select>
    <select id="ft-grade">
      <option value="">등급 전체</option>
      <option value="S">S</option><option value="A">A</option><option value="B">B</option><option value="R">R</option><option value="C">C</option>
    </select>
    <button class="btn" onclick="loadList()">🔄 새로고침</button>
    <button class="btn" onclick="exportCsv()">📥 CSV (PIPA)</button>
    <button class="btn btn-primary" onclick="openRegisterModal()">+ 수동 등록</button>
  </div>
</div>
<!-- 일괄 액션 bar (체크박스 선택 시만 표시) -->
<div id="bulk-bar" style="display:none;background:#fbbf24;color:#0f172a;padding:8px 16px;font-size:12px;font-weight:800;display:none;align-items:center;gap:10px;border-bottom:2px solid #f59e0b">
  <span id="bulk-count">0</span>건 선택됨
  <button class="btn" style="background:#0891b2;color:#fff;border-color:#0891b2" onclick="openBulkReassign()">🔄 일괄 재분배</button>
  <button class="btn" onclick="openBulkStatus('dormant')">💤 일괄 휴면</button>
  <button class="btn btn-danger" onclick="openBulkStatus('rejected')">🚫 일괄 거절</button>
  <button class="btn" onclick="clearBulk()">✕ 선택 해제</button>
</div>

<div class="main">

  <!-- 좌측 list -->
  <div class="left">
    <div class="left-filter" id="quick-filters">
      <span class="chip active" data-quick="all">전체</span>
      <span class="chip warn" data-quick="rotting">⏰ rotting (15일+)</span>
      <span class="chip" data-quick="new">신규</span>
      <span class="chip" data-quick="trying">시도중</span>
      <span class="chip" data-quick="done">완료</span>
    </div>
    <div class="left-meta" id="left-meta">로딩...</div>
    <div class="left-list" id="lead-list">
      <div class="empty-state">로딩 중...</div>
    </div>
  </div>

  <!-- 우측 360° -->
  <div class="right" id="detail-panel">
    <div class="empty-state">← 좌측에서 고객을 선택하세요</div>
  </div>

</div>

<!-- 재분배 모달 -->
<div class="modal-bg" id="reassign-modal">
  <div class="modal">
    <h3>🔄 다른 상담사에게 재분배</h3>
    <label>새 담당 상담사 *</label>
    <select id="ra-agent"></select>
    <label>재분배 사유 (audit log 기록)</label>
    <textarea id="ra-reason" rows="2" placeholder="휴가·역할 변경·전문 영역 매칭 등"></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="document.getElementById('reassign-modal').classList.remove('open')">취소</button>
      <button class="btn btn-primary" onclick="submitReassign()">💾 재분배</button>
    </div>
  </div>
</div>

<!-- 거절/휴면 사유 모달 -->
<div class="modal-bg" id="status-modal">
  <div class="modal">
    <h3 id="sm-title">🚫 거절 처리</h3>
    <label>사유 (필수)</label>
    <textarea id="sm-reason" rows="3" placeholder="고객 거절 사유 또는 휴면 처리 사유"></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="document.getElementById('status-modal').classList.remove('open')">취소</button>
      <button class="btn btn-danger" onclick="submitStatusChange()">💾 처리</button>
    </div>
  </div>
</div>

<!-- 콜 시도 모달 -->
<div class="modal-bg" id="call-modal">
  <div class="modal">
    <h3>📞 콜 시도 결과 입력</h3>
    <label>결과 *</label>
    <select id="cm-result">
      <option value="success">✅ 성공 (상담 진행)</option>
      <option value="reject">❌ 거절</option>
      <option value="absent">📞 부재 (재시도 필요)</option>
      <option value="callback">📅 콜백 예약</option>
    </select>
    <label>통화 요약 * <span style="color:#fbbf24;font-size:10px">(녹음 X — 텍스트가 유일 증거)</span></label>
    <textarea id="cm-summary" placeholder="고객 반응·관심사·다음 액션 메모"></textarea>
    <label>다음 콜 예약 (선택)</label>
    <input type="datetime-local" id="cm-next-call">
    <label>거절 사유 (거절 시)</label>
    <input type="text" id="cm-reject-reason" placeholder="예: 다른 회사 사용 중">
    <div class="modal-actions">
      <button class="btn" onclick="closeCallModal()">취소</button>
      <button class="btn btn-primary" onclick="submitCallAttempt()">💾 저장</button>
    </div>
  </div>
</div>

<script>
// ───────────── 인증·API ─────────────
const API = '/api/incentive';
function getToken() { return localStorage.getItem('incentive-auth-token-v1'); }
async function apiFetch(path, opts={}) {
  const tk = getToken();
  if (!tk) { alert('로그인 필요'); throw new Error('no token'); }
  const res = await fetch(API + path, { ...opts, headers: { 'Content-Type':'application/json', Authorization:'Bearer '+tk, ...(opts.headers||{}) } });
  if (!res.ok) { const err = await res.json().catch(()=>({})); throw new Error(err.error || res.status); }
  return res.json();
}

const CHAN_META = {
  calldb:{icon:'📞',label:'콜DB',cls:'ch-calldb'}, web:{icon:'🌐',label:'웹',cls:'ch-web'},
  app:{icon:'📱',label:'앱',cls:'ch-app'}, store:{icon:'🏪',label:'매장',cls:'ch-store'},
  usedphone:{icon:'🔄',label:'중고폰',cls:'ch-usedphone'}
};
const STATUS_META = {
  pending:      {label:'⏳ 미접촉',     cls:'st-pending'},
  in_progress:  {label:'📞 시도중',     cls:'st-in_progress'},
  callback:     {label:'📅 콜백예약',   cls:'st-pending'},
  no_answer:    {label:'📞 부재',       cls:'st-pending'},
  on_hold:      {label:'⏸️ 보류',       cls:'st-pending'},
  wrong_number: {label:'🚫 잘못된번호', cls:'st-rejected'},
  converted:    {label:'✅ 전환',       cls:'st-completed'},
  completed:    {label:'✅ 완료',       cls:'st-completed'},
  rejected:     {label:'❌ 거절',       cls:'st-rejected'}
};

let _customers = [];
let _selectedPhone = null;
let _quickFilter = 'all';

function ageCls(d) { if (d<=3) return 'age-0'; if (d<=7) return 'age-1'; if (d<=14) return 'age-2'; return 'age-3'; }
function fmt(n) { return n==null?'-':Number(n).toLocaleString('ko-KR'); }
function fmtDate(s) { if (!s) return '-'; const d=new Date(s); return d.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function maskPhone(p) { if (!p) return '-'; const s=String(p).replace(/-/g,''); if (s.length<7) return p; return s.slice(0,3)+'-****-'+s.slice(-4); }

// ───────────── 좌측 list ─────────────
async function loadList() {
  const search = document.getElementById('ft-search').value.trim();
  const status = document.getElementById('ft-status').value;
  const grade  = document.getElementById('ft-grade').value;
  const params = new URLSearchParams({ limit: 100 });
  if (search) params.set('search', search);
  if (status) params.set('status', status);
  if (grade) params.set('grade', grade);
  try {
    document.getElementById('lead-list').innerHTML = '<div class="empty-state">로딩 중...</div>';
    const r = await apiFetch('/customers/unified?' + params.toString());
    _customers = r.customers || [];
    renderList();
  } catch (e) {
    document.getElementById('lead-list').innerHTML = `<div class="empty-state" style="color:#fca5a5">로드 실패: ${e.message}</div>`;
  }
}

function applyQuickFilter(list) {
  if (_quickFilter === 'all') return list;
  if (_quickFilter === 'rotting') return list.filter(c => c.lead_age_days > 14 && c.call_status !== 'completed' && c.call_status !== 'rejected');
  if (_quickFilter === 'new') return list.filter(c => !c.call_status || c.call_status === 'pending');
  if (_quickFilter === 'trying') return list.filter(c => c.call_status === 'in_progress');
  if (_quickFilter === 'done') return list.filter(c => c.call_status === 'completed');
  return list;
}

function renderList() {
  const filtered = applyQuickFilter(_customers);
  const html = filtered.map(c => {
    const st = STATUS_META[c.call_status] || STATUS_META.pending;
    const gradeBadge = c.priority_score ? `<span class="grade g-${c.priority_score}">${c.priority_score}</span>` : '';
    const chans = [];
    chans.push('calldb');
    if (c.bongi_app_count > 0) chans.push('web');
    if (c.is_app_member) chans.push('app');
    if (c.usedphone_count > 0) chans.push('usedphone');
    const chanChips = chans.map(ch => { const m=CHAN_META[ch]; return `<span class="chan-chip ${m.cls}">${m.icon} ${m.label}</span>`; }).join('');
    const prods = [];
    if (c.it_sales_completed > 0) prods.push(`<span class="prod-chip" style="color:#86efac">✓ 인터넷 ${c.it_sales_completed}</span>`);
    if (c.rental_sales_completed > 0) prods.push(`<span class="prod-chip" style="color:#86efac">✓ 가전 ${c.rental_sales_completed}</span>`);
    if (c.usedphone_count > 0) prods.push(`<span class="prod-chip" style="color:#86efac">✓ 중고폰</span>`);
    if (c.it_sales_progress > 0) prods.push(`<span class="prod-chip" style="color:#fbbf24">⏳ 인터넷</span>`);
    if (c.rental_sales_progress > 0) prods.push(`<span class="prod-chip" style="color:#fbbf24">⏳ 가전</span>`);
    const age = c.lead_age_days || 0;
    const ageLabel = age === 0 ? '오늘' : `${age}일`;
    const hasNba = c.gifts_pending > 0 || (c.it_sales_completed > 0 && c.rental_sales_completed === 0) || age > 14;
    return `<div class="lead-card" data-phone="${c.phone}" onclick="selectCustomer('${c.phone}')">
      <div class="lc-r1">
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer" onclick="event.stopPropagation()"><input type="checkbox" class="bulk-cb" data-phone="${c.phone}" onchange="toggleBulk('${c.phone}', this.checked)"></label>
        <div class="lc-name" style="flex:1">${c.member_name || c.calldb_name || '익명 ' + (c.phone||'').slice(-4)}${gradeBadge}</div>
        <span class="lc-status ${st.cls}">${st.label}</span>
      </div>
      <div class="lc-r2">${maskPhone(c.phone)}</div>
      <div class="lc-r3">${chanChips}${prods.join('')}</div>
      <div class="lc-r4">
        <span class="lc-age ${ageCls(age)}">⏰ ${ageLabel}${c.call_attempts ? ' · 콜 '+c.call_attempts+'회' : ' · 미접촉'}</span>
        ${hasNba ? '<span class="nba-badge">🎯 NBA</span>' : ''}
      </div>
    </div>`;
  }).join('') || '<div class="empty-state">조건에 맞는 리드 없음</div>';
  document.getElementById('lead-list').innerHTML = html;
  document.getElementById('left-meta').textContent = `${filtered.length} / 전체 ${_customers.length}건`;
}

// ───────────── 우측 360° 패널 ─────────────
async function selectCustomer(phone) {
  _selectedPhone = phone;
  document.querySelectorAll('.lead-card').forEach(c => c.classList.toggle('active', c.dataset.phone === phone));
  document.getElementById('detail-panel').innerHTML = '<div class="empty-state">로딩 중...</div>';
  try {
    const r = await apiFetch('/customers/' + encodeURIComponent(phone) + '/360');
    renderDetail(r);
  } catch (e) {
    document.getElementById('detail-panel').innerHTML = `<div class="empty-state" style="color:#fca5a5">로드 실패: ${e.message}</div>`;
  }
}

// ───────────── 태그 시스템 ─────────────
const TAG_PRESETS = [
  {name:'VIP', color:'#a78bfa'},
  {name:'유망', color:'#22c55e'},
  {name:'주의', color:'#fbbf24'},
  {name:'신중', color:'#60a5fa'},
  {name:'재방문', color:'#67e8f9'},
  {name:'장년', color:'#f97316'},
];
function renderTags(tags) {
  const chips = (tags || []).map(t => {
    const p = TAG_PRESETS.find(x => x.name === t);
    const color = p?.color || '#cbd5e1';
    return `<span class="prof-chip" style="background:${color}33;color:${color};border:1px solid ${color}66">🏷️ ${t} <span style="margin-left:4px;cursor:pointer;color:#fca5a5" onclick="removeTag('${t.replace(/'/g,"\\'")}')">✕</span></span>`;
  }).join('');
  const presetBtns = TAG_PRESETS.filter(p => !(tags||[]).includes(p.name)).map(p =>
    `<button class="btn" style="padding:2px 8px;font-size:10px;background:${p.color}22;color:${p.color};border:1px dashed ${p.color}66" onclick="addTag('${p.name}')">+ ${p.name}</button>`
  ).join('');
  return `<div class="prof-chips" style="margin-top:6px">${chips}${presetBtns}
    <button class="btn" style="padding:2px 8px;font-size:10px" onclick="addTagCustom()">+ 직접</button>
  </div>`;
}
async function addTag(name) {
  if (!_selectedPhone) return;
  const cur = (await apiFetch('/customers/' + encodeURIComponent(_selectedPhone) + '/360')).customer?.tags || [];
  if (cur.includes(name)) return;
  await apiFetch('/customers/' + encodeURIComponent(_selectedPhone), {
    method:'PATCH', body: JSON.stringify({ tags: [...cur, name] })
  });
  await selectCustomer(_selectedPhone);
}
async function addTagCustom() {
  const name = prompt('새 태그 이름 (예: 클레임진행, 추천대상)');
  if (!name || !name.trim()) return;
  await addTag(name.trim());
}
async function removeTag(name) {
  if (!_selectedPhone || !confirm(`태그 "${name}" 제거?`)) return;
  const cur = (await apiFetch('/customers/' + encodeURIComponent(_selectedPhone) + '/360')).customer?.tags || [];
  await apiFetch('/customers/' + encodeURIComponent(_selectedPhone), {
    method:'PATCH', body: JSON.stringify({ tags: cur.filter(t => t !== name) })
  });
  await selectCustomer(_selectedPhone);
}

function closeEditMode() { document.getElementById('edit-overlay')?.remove(); }
async function submitEdit() {
  const body = {
    name: document.getElementById('ed-name').value.trim() || null,
    age: document.getElementById('ed-age').value ? Number(document.getElementById('ed-age').value) : null,
    gender: document.getElementById('ed-gender').value || null,
    carrier: document.getElementById('ed-carrier').value || null,
    region: document.getElementById('ed-region').value.trim() || null,
    priority_score: document.getElementById('ed-priority').value ? Number(document.getElementById('ed-priority').value) : 0,
    is_dnt: document.getElementById('ed-dnt').checked,

async function exportCsv() {
  const tk = getToken();
  if (!tk) return alert('로그인 필요');
  const search = document.getElementById('ft-search').value.trim();
  const status = document.getElementById('ft-status').value;
  const grade  = document.getElementById('ft-grade').value;
  const params = new URLSearchParams();
  if (search) params.set('search', search);
  if (status) params.set('status', status);
  if (grade) params.set('grade', grade);
  try {
    const res = await fetch(API + '/customers/export/csv?' + params, { headers: { Authorization: 'Bearer ' + tk }});
    if (!res.ok) { const err = await res.json().catch(()=>({})); throw new Error(err.error || res.status); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `customers_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } catch(e) { alert('CSV export 실패: ' + e.message); }
}

function addMonths(dateStr, months) {
  if (!dateStr || !months) return null;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  d.setMonth(d.getMonth() + Number(months));
  return d;
}
function daysUntil(date) {
  if (!date) return null;
  const now = new Date();
  return Math.floor((date - now) / (1000 * 60 * 60 * 24));
}
function statusBadge(s) {
  const map = {
    completed: {label:'✅ 완료', bg:'rgba(34,197,94,0.18)', color:'#86efac'},
    in_progress: {label:'🚧 진행', bg:'rgba(96,165,250,0.18)', color:'#93c5fd'},
    pending: {label:'⏳ 대기', bg:'rgba(251,191,36,0.18)', color:'#fbbf24'},
    cancelled: {label:'❌ 취소', bg:'rgba(220,38,38,0.18)', color:'#fca5a5'},
  };
  const m = map[s] || {label:s||'-', bg:'rgba(148,163,184,0.15)', color:'#cbd5e1'};
  return `<span style="background:${m.bg};color:${m.color};font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px">${m.label}</span>`;
}
function renderContractDetails(r) {

  const rowsHTML = items.map(it => {

      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div>
          <div style="font-size:9.5px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:0.04em">${it.icon} ${it.typeLabel}${it.ticket?' · 🎫 '+it.ticket:''}</div>
          <div style="font-size:13px;font-weight:800;color:#f1f5f9;margin-top:2px">${it.name||'-'}</div>
          ${it.sub?`<div style="font-size:10.5px;color:#67e8f9">${it.sub}</div>`:''}

        <div><span style="color:#94a3b8">약정</span><br><b style="color:#cbd5e1">${it.months?it.months+'M':'-'}</b></div>
        <div style="grid-column:span 2"><span style="color:#94a3b8">약정 종료일</span><br><b style="color:${dDay && dDay<=60 && dDay>0?'#fbbf24':'#cbd5e1'}">${it.end_date?it.end_date.toISOString().slice(0,10):'-'}${dDayHTML?' · '+dDayHTML:''}</b></div>
        ${it.monthly_fee?`<div><span style="color:#94a3b8">월납</span><br><b style="color:#f1f5f9">${fmt(it.monthly_fee)}원</b></div>`:''}
        ${totalPay?`<div><span style="color:#94a3b8">총 납부</span><br><b style="color:#cbd5e1">${fmt(totalPay)}원</b></div>`:''}
        ${it.payback?`<div><span style="color:#94a3b8">페이백</span><br><b style="color:#fbbf24">${fmt(it.payback)}원</b></div>`:''}
        ${it.activation_date?`<div><span style="color:#94a3b8">설치/개통일</span><br><b style="color:#cbd5e1">${(it.activation_date||'').slice(0,10)}</b></div>`:''}
        ${it.agent?`<div><span style="color:#94a3b8">담당 상담사</span><br><b style="color:#cbd5e1">${it.agent}</b></div>`:''}

      </div>
    </div>`;
  }).join('');
  return `<div class="section">
    <div class="sec-title">📋 계약 상세 내역 <span class="meta">총 ${items.length}건 · 시간순</span></div>
    ${rowsHTML}
  </div>`;
}

  } catch(e) { window._dbSources = []; }
}

function cancelRegister() {
  document.getElementById('detail-panel').innerHTML = '<div class="empty-state">← 좌측에서 고객을 선택하세요</div>';
  if (location.search.includes('action=register')) history.replaceState(null, '', location.pathname);
}
async function submitRegister() {
  const err = document.getElementById('reg-error');
  const showErr = (m) => { err.textContent = m; err.style.display = 'block'; };
  err.style.display = 'none';
  const name = document.getElementById('rf-name').value.trim();
  const phone = document.getElementById('rf-phone').value.trim();
  if (!name) return showErr('이름 필수');
  if (!phone) return showErr('전화번호 필수');
  if (!/^[0-9-]{8,15}$/.test(phone)) return showErr('전화번호 형식 오류 (010-1234-5678)');
  const interests = Array.from(document.querySelectorAll('.rf-int:checked')).map(c => c.value);
  const firstNote = document.getElementById('rf-first-note').value.trim();
  const noteCat = document.getElementById('rf-note-cat').value;
  const notePin = document.getElementById('rf-note-pin').checked;
  // notes 자동 조합 (인입 채널/관심 상품을 콜DB notes에 prefix)
  const autoNotes = [
    interests.length ? '관심: ' + interests.join(', ') : '',
    firstNote
  ].filter(Boolean).join(' / ') || null;
  const body = {
    name, phone,
    age: document.getElementById('rf-age').value || null,
    gender: document.getElementById('rf-gender').value || null,
    region: document.getElementById('rf-region').value.trim() || null,
    carrier: document.getElementById('rf-carrier').value || null,
    notes: autoNotes,
    db_source_id: document.getElementById('rf-db-source').value || null,
    assign_to_me: document.getElementById('rf-assign-me').checked,
  };
  try {
    const r = await apiFetch('/customers/manual-register', { method:'POST', body: JSON.stringify(body) });
    // 첫 메모 별도 저장 (incentive_customer_notes — 운영자가 메모로 누적 가능)
    if (firstNote) {
      try { await apiFetch(`/customers/${encodeURIComponent(r.customer.phone)}/notes`, {
        method:'POST',
        body: JSON.stringify({ content: firstNote, category: noteCat, is_pinned: notePin }),
      }); } catch(e) { console.error('first note save fail', e); }
    }
    // callback 예약 별도 — 콜 시도 기록으로 저장 (result=callback)
    const cb = document.getElementById('rf-callback').value;
    if (cb) {
      try { await apiFetch(`/customers/${encodeURIComponent(r.customer.phone)}/call-attempt`, {
        method:'POST',
        body: JSON.stringify({ result:'callback', summary:'등록 시 예약', next_call_at: cb }),
      }); } catch(e) { console.error('callback save fail', e); }
    }
    if (location.search.includes('action=register')) history.replaceState(null, '', location.pathname);
    await loadList();
    await selectCustomer(r.customer.phone);
  } catch(e) {
    if (e.message?.includes('이미 등록된')) showErr('⚠️ 이미 등록된 전화번호 — 좌측 list에서 검색하세요');
    else showErr('❌ ' + e.message);
  }
}

// 모달 외부 클릭·Esc close
document.getElementById('call-modal').addEventListener('click', e => { if (e.target.id === 'call-modal') closeCallModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('call-modal').classList.contains('open')) closeCallModal(); });

// 초기 로드 — URL ?phone=... 받으면 자동 select / ?action=register 받으면 등록 모달 자동 open
async function init() {
  await loadList();
  const params = new URLSearchParams(location.search);
  const phone = params.get('phone');
  const action = params.get('action');
  if (phone) {
    await selectCustomer(phone);
    setTimeout(() => {
      const card = document.querySelector(`.lead-card[data-phone="${phone}"]`);
      if (card) card.scrollIntoView({ behavior:'smooth', block:'center' });
    }, 200);
  }
  if (action === 'register') setTimeout(openRegisterModal, 200);
}
document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();
