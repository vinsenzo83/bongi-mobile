<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>봉이 TM CRM — 티켓 관리</title>
<link rel="preconnect" href="https://dugaqvvnhsgenhmhuyju.supabase.co" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Pretendard Variable', -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; font-size: 13px; overflow: hidden; }

.layout { display: flex; flex-direction: column; height: 100vh; }

.page-header {
  padding: 12px 24px;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  border-bottom: 1.5px solid #334155;
  display: flex; align-items: center; gap: 16px;
  flex-shrink: 0;
}
.page-title { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.page-subtitle { font-size: 11px; color: #94a3b8; margin-top: 2px; }
.stats { display: flex; gap: 8px; margin-left: auto; }
.stat-chip { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); padding: 5px 12px; border-radius: 8px; font-size: 11px; color: #94a3b8; font-weight: 600; }
.stat-chip b { color: #f1f5f9; font-size: 13px; margin-left: 4px; font-weight: 800; }

/* 탭 */
.tabs { display: flex; gap: 4px; padding: 0 24px; background: #0f172a; border-bottom: 1px solid #334155; flex-shrink: 0; }
.tab-btn {
  background: transparent; border: none; color: #94a3b8;
  padding: 10px 18px; font-size: 13px; font-weight: 700;
  cursor: pointer; border-bottom: 2px solid transparent;
  display: inline-flex; align-items: center; gap: 8px;
  font-family: inherit;
}
.tab-btn:hover { color: #cbd5e1; }
.tab-btn.active { color: #60a5fa; border-bottom-color: #3b82f6; }
.tab-btn .count {
  background: rgba(255,255,255,0.08); padding: 1px 8px; border-radius: 9px;
  font-size: 11px; font-weight: 800; color: #cbd5e1;
}
.tab-btn.active .count { background: #3b82f6; color: #fff; }

.content { flex: 1; overflow-y: auto; padding: 16px 24px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.search-input { flex: 1; min-width: 200px; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 8px 12px; border-radius: 6px; font-size: 12.5px; font-family: inherit; }
.search-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
.btn { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #cbd5e1; padding: 7px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
.btn-primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }

.filter-pills { display: flex; gap: 4px; }
.pill { padding: 6px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #cbd5e1; cursor: pointer; }
.pill.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }

.table-wrap { background: #1e293b; border: 1px solid #334155; border-radius: 10px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; padding: 10px 12px; border-bottom: 1px solid #334155; background: #0f172a; }
td { padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
td.num { text-align: right; }
tbody tr:hover { background: rgba(59,130,246,0.05); }
tbody tr.inactive td { opacity: 0.45; }
tbody tr:last-child td { border-bottom: none; }

.cell-ticket { font-family: 'SF Mono', Monaco, monospace; font-weight: 700; color: #a5b4fc; letter-spacing: 0.5px; }
.cell-fee { font-family: 'SF Mono', Monaco, monospace; font-weight: 700; color: #f1f5f9; }
.cell-gift { font-family: 'SF Mono', Monaco, monospace; color: #fbbf24; font-weight: 700; }
.cell-rebate { font-family: 'SF Mono', Monaco, monospace; color: #34d399; font-weight: 700; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 10.5px; font-weight: 700; }
.badge-skt { background: #ef4444; color: #fff; }
.badge-kt { background: #6366f1; color: #fff; }
.badge-lgu { background: #ec4899; color: #fff; }
.badge-active { background: rgba(34,197,94,0.15); color: #86efac; }
.badge-inactive { background: rgba(239,68,68,0.15); color: #fca5a5; }
.badge-months { background: rgba(167,139,250,0.15); color: #c4b5fd; font-family: 'SF Mono', Monaco, monospace; }
.badge-brand { background: rgba(56,189,248,0.15); color: #7dd3fc; font-weight: 700; }

#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #16a34a; color: #fff; padding: 12px 22px; border-radius: 10px; font-size: 13px; font-weight: 700; box-shadow: 0 6px 24px rgba(22,163,74,0.5); opacity: 0; transition: opacity 0.2s; z-index: 9999; pointer-events: none; }
#toast.show { opacity: 1; }
#toast.err { background: #dc2626; box-shadow: 0 6px 24px rgba(220,38,38,0.5); }

.empty { padding: 60px 20px; text-align: center; color: #64748b; font-size: 13px; }
.loading { padding: 40px; text-align: center; color: #64748b; }
.footnote { margin-top: 10px; font-size: 11px; color: #64748b; }
</style>
<script src="/docs/_security.js" defer></script>
<script src="/docs/_shared/incentive-auth.js" defer></script>
</head>
<body>

<div class="layout">
  <header class="page-header">
    <div>
      <div class="page-title">🎫 티켓 관리</div>
      <div class="page-subtitle">고객→상담사 핫라인 식별 코드. 고객이 봉이 사이트 상품 보고 전화 → 상담사가 티켓번호로 즉시 견적</div>
    </div>
    <div class="stats">
      <div class="stat-chip">활성 <b id="stat-active">-</b></div>
      <div class="stat-chip">비활성 <b id="stat-inactive">-</b></div>
      <div class="stat-chip">전체 <b id="stat-total">-</b></div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="internet">📡 인터넷+TV <span class="count" id="cnt-internet">-</span></button>
    <button class="tab-btn" data-tab="rental">🏠 가전 렌탈 <span class="count" id="cnt-rental">-</span></button>
  </nav>

  <main class="content">
    <!-- ─── 탭 1: 인터넷+TV ─── -->
    <div class="tab-panel active" id="panel-internet">
      <div class="toolbar">
        <input class="search-input" id="search-internet" placeholder="🔍 티켓번호·통신사·속도·TV 상품 (예: SK0015 / B tv 이코노미)">
        <div class="filter-pills">
          <button class="pill active" data-carrier="all">전체</button>
          <button class="pill" data-carrier="skt">SKT</button>
          <button class="pill" data-carrier="kt">KT</button>
          <button class="pill" data-carrier="lgu">LGU+</button>
        </div>
        <div class="filter-pills">
          <button class="pill active" data-status-i="all">상태 전체</button>
          <button class="pill" data-status-i="active">활성</button>
          <button class="pill" data-status-i="inactive">비활성</button>
        </div>
        <button class="btn" onclick="reloadInternet()">🔄 새로고침</button>
        <button class="btn btn-primary" onclick="syncInternetFromSeed()" title="TM 데이터 시드와 비교">⚡ 시드 동기화</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>티켓번호</th><th>통신사</th><th>속도</th><th>TV 상품</th><th>WiFi</th>
            <th class="num">월 요금</th><th class="num">🎁 사은품</th><th>상태</th><th>액션</th>
          </tr></thead>
          <tbody id="tbody-internet"><tr><td colspan="9" class="loading">로딩...</td></tr></tbody>
        </table>
      </div>
      <div class="footnote">💡 각 행은 발급 시점 가격·사은품 박제. 시드 변경 → "⚡ 시드 동기화" 또는 60초 자동 polling.</div>
    </div>

    <!-- ─── 탭 2: 가전 렌탈 (옵션 1501개) ─── -->
    <div class="tab-panel" id="panel-rental">
      <div class="toolbar">
        <input class="search-input" id="search-rental" placeholder="🔍 티켓번호·브랜드·상품명·모델 (예: R0683 / LG / 정수기)">
        <div class="filter-pills" id="brand-pills">
          <button class="pill active" data-brand="all">전체 브랜드</button>
        </div>
        <div class="filter-pills">
          <button class="pill active" data-status-r="all">상태 전체</button>
          <button class="pill" data-status-r="active">활성</button>
          <button class="pill" data-status-r="inactive">비활성</button>
        </div>
        <button class="btn" onclick="reloadRental()">🔄 새로고침</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>티켓번호</th><th>브랜드</th><th>상품명</th><th>모델</th><th>약정</th>
            <th class="num">월납</th><th class="num">정상가</th><th class="num">리베이트</th>
            <th>상태</th><th>액션</th>
          </tr></thead>
          <tbody id="tbody-rental"><tr><td colspan="10" class="loading">로딩...</td></tr></tbody>
        </table>
      </div>
      <div class="footnote">💡 옵션 단위 발급 (R0001~). 신규 옵션 등록 시 자동 R 번호. 상품 관리에서 옵션 비활성 시 티켓도 자동 sync.</div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
const API = '/api/incentive';
let INTERNET = [], RENTAL = [];
let iCarrier = 'all', iStatus = 'all';
let rBrand = 'all', rStatus = 'all';
let currentTab = 'internet';

function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'show err' : 'show';
  setTimeout(() => { t.className = ''; }, 2500);
}
function getToken() { return localStorage.getItem('incentive-auth-token-v1'); }
async function apiFetch(path, opts = {}) {
  const token = getToken();
  if (!token) { window.parent.postMessage({ type: 'logout' }, '*'); throw new Error('no token'); }
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'fetch failed' }));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}
const fmt = n => n == null ? '-' : Number(n).toLocaleString('ko-KR');

// ─── 탭 전환 ───
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    document.getElementById('panel-' + currentTab).classList.add('active');
    updateStatsForTab();
  });
});

function updateStatsForTab() {
  const arr = currentTab === 'internet' ? INTERNET : RENTAL;
  const active = arr.filter(t => t.is_active !== false && (t.ticket_active === undefined || t.ticket_active)).length;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-inactive').textContent = arr.length - active;
  document.getElementById('stat-total').textContent = arr.length;
}

// ════════ 탭 1: 인터넷+TV ════════
async function loadInternet() {
  try {
    document.getElementById('tbody-internet').innerHTML = '<tr><td colspan="9" class="loading">로딩...</td></tr>';
    const { tickets } = await apiFetch('/tickets/internet');
    INTERNET = tickets;
    document.getElementById('cnt-internet').textContent = tickets.length;
    if (currentTab === 'internet') updateStatsForTab();
    renderInternet();
  } catch (e) {
    document.getElementById('tbody-internet').innerHTML = '<tr><td colspan="9" class="empty">로드 실패: ' + e.message + '</td></tr>';
  }
}

function renderInternet() {
  const search = document.getElementById('search-internet').value.trim().toLowerCase();
  const filtered = INTERNET.filter(t => {
    if (iCarrier !== 'all' && t.carrier !== iCarrier) return false;
    if (iStatus === 'active' && !t.is_active) return false;
    if (iStatus === 'inactive' && t.is_active) return false;
    if (search) {
      const blob = (t.ticket_number + ' ' + t.carrier + ' ' + t.speed + ' ' + (t.tv_label||'')).toLowerCase();
      if (!blob.includes(search)) return false;
    }
    return true;
  });
  const html = filtered.length === 0 ? '<tr><td colspan="9" class="empty">검색 결과 없음</td></tr>' :
    filtered.map(t => {
      const badge = t.carrier === 'skt' ? 'badge-skt' : t.carrier === 'kt' ? 'badge-kt' : 'badge-lgu';
      const cLabel = t.carrier === 'skt' ? 'SKT' : t.carrier === 'kt' ? 'KT' : 'LGU+';
      return `<tr class="${t.is_active ? '' : 'inactive'}">
        <td><span class="cell-ticket">${t.ticket_number}</span></td>
        <td><span class="badge ${badge}">${cLabel}</span></td>
        <td><b>${t.speed}</b></td>
        <td>${t.tv_label || '-'}</td>
        <td>${t.has_wifi ? '<span style="color:#16a34a;font-weight:700">✓</span>' : '<span style="color:#64748b">✗</span>'}</td>
        <td class="num"><span class="cell-fee">${fmt(t.monthly_fee)}원</span></td>
        <td class="num"><span class="cell-gift">${fmt(t.gift_amount)}원</span></td>
        <td>${t.is_active ? '<span class="badge badge-active">● 활성</span>' : '<span class="badge badge-inactive">○ 비활성</span>'}</td>
        <td>${t.is_active ?
          `<button class="btn" onclick="deactivateInternet(${t.id},'${t.ticket_number}')">비활성</button>` :
          `<button class="btn" onclick="activateInternet(${t.id},'${t.ticket_number}')">재활성</button>`}</td>
      </tr>`;
    }).join('');
  document.getElementById('tbody-internet').innerHTML = html;
}

document.getElementById('search-internet').addEventListener('input', renderInternet);
document.querySelectorAll('#panel-internet [data-carrier]').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#panel-internet [data-carrier]').forEach(x => x.classList.remove('active'));
    p.classList.add('active'); iCarrier = p.dataset.carrier; renderInternet();
  });
});
document.querySelectorAll('#panel-internet [data-status-i]').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#panel-internet [data-status-i]').forEach(x => x.classList.remove('active'));
    p.classList.add('active'); iStatus = p.dataset['statusI']; renderInternet();
  });
});

function reloadInternet() { loadInternet(); showToast('인터넷 새로고침'); }
async function deactivateInternet(id, tn) {
  if (!confirm(`${tn} 비활성화?`)) return;
  try { await apiFetch(`/tickets/internet/${id}/deactivate`, { method: 'PATCH' }); showToast(`${tn} 비활성`); loadInternet(); }
  catch (e) { showToast('실패: ' + e.message, true); }
}
async function activateInternet(id, tn) {
  try { await apiFetch(`/tickets/internet/${id}/activate`, { method: 'PATCH' }); showToast(`${tn} 재활성`); loadInternet(); }
  catch (e) { showToast('실패: ' + e.message, true); }
}

async function syncInternetFromSeed() {
  if (!confirm('TM 데이터 시드와 동기화\n(새 조합 → 신규 발급 / 사라진 조합 → 비활성)')) return;
  showToast('시드 fetch 중...');
  try {
    const data = await extractTicketsFromCalc();
    if (!data || data.length === 0) throw new Error('시드 추출 실패');
    const res = await apiFetch('/tickets/internet/sync', { method: 'POST', body: JSON.stringify({ tickets: data }) });
    showToast(`✓ 신규 ${res.inserted||0} / 변경 ${res.updated||0} / 비활성 ${res.deactivated||0}`);
    loadInternet();
  } catch (e) { showToast('실패: ' + e.message, true); }
}

function extractTicketsFromCalc() {
  return new Promise((resolve, reject) => {
    const iframe = document.createElement('iframe');
    iframe.src = '/docs/calculator.html?admin=1';
    iframe.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px;opacity:0';
    iframe.onload = () => {
      let tries = 0;
      const timer = setInterval(() => {
        try {
          const win = iframe.contentWindow;
          if (win && win.TICKETS && win.D && win.calcTicketPrice && win.getGiftAmount && win.TICKETS.length > 0) {
            const out = win.TICKETS.map(t => {
              const d = win.D[t.carrier];
              return {
                ticket_number: t.number, carrier: t.carrier, speed: t.speed, tv_idx: t.tvIdx,
                tv_label: t.tvIdx === 0 ? '인터넷 단독' : (d.tv[t.tvIdx]?.n || `TV ${t.tvIdx}`),
                has_wifi: !!t.wifi,
                monthly_fee: win.calcTicketPrice(d, t.speed, t.tvIdx, t.wifi) | 0,
                gift_amount: win.getGiftAmount(d, t.speed, t.tvIdx) | 0,
              };
            });
            clearInterval(timer); iframe.remove(); resolve(out);
          }
          if (++tries > 40) { clearInterval(timer); iframe.remove(); reject(new Error('타임아웃')); }
        } catch { clearInterval(timer); iframe.remove(); reject(new Error('iframe 접근 실패')); }
      }, 200);
    };
    document.body.appendChild(iframe);
  });
}

// ════════ 탭 2: 가전 렌탈 (옵션 1501) ════════
async function loadRental() {
  try {
    document.getElementById('tbody-rental').innerHTML = '<tr><td colspan="10" class="loading">로딩...</td></tr>';
    const { tickets } = await apiFetch('/tickets/rental');
    RENTAL = tickets;
    document.getElementById('cnt-rental').textContent = tickets.length;
    // 브랜드 필터 동적 생성
    const brands = [...new Set(tickets.map(t => t.brand).filter(Boolean))].sort();
    const pills = document.getElementById('brand-pills');
    pills.innerHTML = '<button class="pill active" data-brand="all">전체 브랜드</button>' +
      brands.map(b => `<button class="pill" data-brand="${b}">${b}</button>`).join('');
    pills.querySelectorAll('.pill').forEach(p => {
      p.addEventListener('click', () => {
        pills.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
        p.classList.add('active'); rBrand = p.dataset.brand; renderRental();
      });
    });
    if (currentTab === 'rental') updateStatsForTab();
    renderRental();
  } catch (e) {
    document.getElementById('tbody-rental').innerHTML = '<tr><td colspan="10" class="empty">로드 실패: ' + e.message + '</td></tr>';
  }
}

function renderRental() {
  const search = document.getElementById('search-rental').value.trim().toLowerCase();
  const filtered = RENTAL.filter(t => {
    if (rBrand !== 'all' && t.brand !== rBrand) return false;
    const active = t.is_active && t.ticket_active;
    if (rStatus === 'active' && !active) return false;
    if (rStatus === 'inactive' && active) return false;
    if (search) {
      const blob = ((t.ticket_number||'') + ' ' + (t.brand||'') + ' ' + (t.product_name||'') + ' ' + (t.model||'')).toLowerCase();
      if (!blob.includes(search)) return false;
    }
    return true;
  });
  const MAX_RENDER = 500;
  const limited = filtered.slice(0, MAX_RENDER);
  let html = limited.length === 0 ? '<tr><td colspan="10" class="empty">검색 결과 없음</td></tr>' :
    limited.map(t => {
      const active = t.is_active && t.ticket_active;
      return `<tr class="${active ? '' : 'inactive'}">
        <td><span class="cell-ticket">${t.ticket_number}</span></td>
        <td><span class="badge badge-brand">${t.brand || '-'}</span></td>
        <td>${(t.product_name || '-').slice(0, 40)}</td>
        <td style="color:#64748b;font-size:11px">${t.model || '-'}</td>
        <td><span class="badge badge-months">${t.months || '-'}M</span> ${t.care_service ? '· '+t.care_service.slice(0,8) : ''}</td>
        <td class="num"><span class="cell-fee">${fmt(t.monthly_fee)}원</span></td>
        <td class="num">${fmt(t.normal_price)}원</td>
        <td class="num"><span class="cell-rebate">${fmt(t.rebate)}원</span></td>
        <td>${active ? '<span class="badge badge-active">● 활성</span>' : '<span class="badge badge-inactive">○ 비활성</span>'}</td>
        <td>${active ?
          `<button class="btn" onclick="deactivateRental(${t.id},'${t.ticket_number}')">비활성</button>` :
          `<button class="btn" onclick="activateRental(${t.id},'${t.ticket_number}')">재활성</button>`}</td>
      </tr>`;
    }).join('');
  if (filtered.length > MAX_RENDER) {
    html += `<tr><td colspan="10" class="footnote" style="padding:14px 18px;color:#fbbf24">⚠️ ${filtered.length}건 중 상위 ${MAX_RENDER}건만 표시 — 검색·필터로 좁히세요</td></tr>`;
  }
  document.getElementById('tbody-rental').innerHTML = html;
}

document.getElementById('search-rental').addEventListener('input', renderRental);
document.querySelectorAll('#panel-rental [data-status-r]').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#panel-rental [data-status-r]').forEach(x => x.classList.remove('active'));
    p.classList.add('active'); rStatus = p.dataset['statusR']; renderRental();
  });
});

function reloadRental() { loadRental(); showToast('렌탈 새로고침'); }
async function deactivateRental(id, tn) {
  if (!confirm(`${tn} 비활성화?`)) return;
  try { await apiFetch(`/tickets/rental/${id}/deactivate`, { method: 'PATCH' }); showToast(`${tn} 비활성`); loadRental(); }
  catch (e) { showToast('실패: ' + e.message, true); }
}
async function activateRental(id, tn) {
  try { await apiFetch(`/tickets/rental/${id}/activate`, { method: 'PATCH' }); showToast(`${tn} 재활성`); loadRental(); }
  catch (e) { showToast('실패: ' + e.message, true); }
}

// ════════ 동적 sync ════════
const SYNC_CHANNEL = 'incentive-seed-changed';
let _bc = null, _pollTimer = null, _syncing = false;
async function autoSync(reason) {
  if (_syncing) return; _syncing = true;
  try {
    const data = await extractTicketsFromCalc();
    if (!data || data.length === 0) return;
    const res = await apiFetch('/tickets/internet/sync', { method: 'POST', body: JSON.stringify({ tickets: data }) });
    const changed = (res.inserted||0) + (res.updated||0) + (res.deactivated||0);
    if (changed > 0) {
      console.log(`[auto-sync ${reason}] +${res.inserted} ~${res.updated} -${res.deactivated}`);
      showToast(`자동 sync: 신규 ${res.inserted} / 변경 ${res.updated} / 비활성 ${res.deactivated}`);
      loadInternet();
    }
  } catch (e) { console.warn('[auto-sync]', e.message); }
  finally { _syncing = false; }
}
function startDynamicSync() {
  try {
    _bc = new BroadcastChannel(SYNC_CHANNEL);
    _bc.onmessage = (ev) => autoSync('bc:' + (ev.data?.source || '?'));
  } catch {}
  _pollTimer = setInterval(() => { if (document.visibilityState === 'visible') autoSync('poll'); }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      autoSync('visibility');
      loadRental();   // 렌탈은 상품 관리에서 즉시 update 가능 — 자동 refresh
    }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  if (!getToken()) { window.parent.postMessage({ type: 'logout' }, '*'); return; }
  loadInternet();
  loadRental();
  setTimeout(() => autoSync('init'), 2000);
  startDynamicSync();
});
</script>
