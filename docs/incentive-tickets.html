<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>봉이 TM CRM — 티켓 관리</title>
<link rel="preconnect" href="https://dugaqvvnhsgenhmhuyju.supabase.co" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Pretendard Variable', -apple-system, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  font-size: 13px;
  overflow: hidden;
}

.layout { display: flex; flex-direction: column; height: 100vh; }

.page-header {
  padding: 14px 24px;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  border-bottom: 1.5px solid #334155;
  display: flex; align-items: center; gap: 16px;
  flex-shrink: 0;
}
.page-title { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.page-subtitle { font-size: 11px; color: #94a3b8; margin-top: 2px; }

.stats { display: flex; gap: 10px; margin-left: auto; }
.stat-chip {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 11px;
  color: #94a3b8;
  font-weight: 600;
}
.stat-chip b { color: #f1f5f9; font-size: 14px; margin-left: 4px; font-weight: 800; }

.content { flex: 1; overflow-y: auto; padding: 20px 24px; }

.toolbar {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.search-input {
  flex: 1;
  min-width: 200px;
  background: #0f172a;
  border: 1px solid #334155;
  color: #e2e8f0;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 12.5px;
  font-family: inherit;
}
.search-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
.btn {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: #cbd5e1;
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
.btn-primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }

.filter-pills { display: flex; gap: 4px; }
.pill {
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: #cbd5e1;
  cursor: pointer;
}
.pill.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }

.table-wrap {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 10px;
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th {
  text-align: left;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #94a3b8;
  padding: 10px 12px;
  border-bottom: 1px solid #334155;
  background: #0f172a;
}
td {
  padding: 9px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  vertical-align: middle;
}
td.num { text-align: right; }
tbody tr:hover { background: rgba(59,130,246,0.05); }
tbody tr.inactive td { opacity: 0.45; }
tbody tr:last-child td { border-bottom: none; }

.cell-ticket {
  font-family: 'SF Mono', Monaco, monospace;
  font-weight: 700;
  color: #a5b4fc;
  letter-spacing: 0.5px;
}
.cell-fee {
  font-family: 'SF Mono', Monaco, monospace;
  font-weight: 700;
  color: #f1f5f9;
}
.cell-gift {
  font-family: 'SF Mono', Monaco, monospace;
  color: #fbbf24;
  font-weight: 700;
}

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10.5px;
  font-weight: 700;
}
.badge-skt { background: #ef4444; color: #fff; }
.badge-kt  { background: #6366f1; color: #fff; }
.badge-lgu { background: #ec4899; color: #fff; }
.badge-active   { background: rgba(34,197,94,0.15); color: #86efac; }
.badge-inactive { background: rgba(239,68,68,0.15); color: #fca5a5; }

#toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: #16a34a; color: #fff;
  padding: 12px 22px; border-radius: 10px;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 6px 24px rgba(22,163,74,0.5);
  opacity: 0; transition: opacity 0.2s; z-index: 9999;
  pointer-events: none;
}
#toast.show { opacity: 1; }
#toast.err { background: #dc2626; box-shadow: 0 6px 24px rgba(220,38,38,0.5); }

.empty { padding: 60px 20px; text-align: center; color: #64748b; font-size: 13px; }
.loading { padding: 40px; text-align: center; color: #64748b; }

.coming-soon {
  margin-top: 24px;
  padding: 14px 18px;
  background: rgba(251,191,36,0.08);
  border: 1px dashed rgba(251,191,36,0.4);
  border-radius: 8px;
  color: #fde68a;
  font-size: 12px;
}
</style>
<script src="/docs/_security.js" defer></script>
<script src="/docs/_shared/incentive-auth.js" defer></script>
</head>
<body>

<div class="layout">
  <header class="page-header">
    <div>
      <div class="page-title">🎫 티켓 관리</div>
      <div class="page-subtitle">고객→상담사 핫라인 식별 코드. 고객이 봉이 사이트에서 상품 확인 → 티켓번호로 전화 → 상담사 즉시 견적</div>
    </div>
    <div class="stats">
      <div class="stat-chip">활성 <b id="stat-active">-</b></div>
      <div class="stat-chip">비활성 <b id="stat-inactive">-</b></div>
      <div class="stat-chip">전체 <b id="stat-total">-</b></div>
    </div>
  </header>

  <main class="content">
    <div class="toolbar">
      <input class="search-input" id="search" placeholder="🔍 티켓번호·통신사·속도·TV 상품 검색 (예: SK0015 / B tv 이코노미)">
      <div class="filter-pills">
        <button class="pill active" data-carrier="all">전체</button>
        <button class="pill" data-carrier="skt">SKT</button>
        <button class="pill" data-carrier="kt">KT</button>
        <button class="pill" data-carrier="lgu">LGU+</button>
      </div>
      <div class="filter-pills">
        <button class="pill active" data-status="all">상태 전체</button>
        <button class="pill" data-status="active">활성</button>
        <button class="pill" data-status="inactive">비활성</button>
      </div>
      <button class="btn" onclick="reload()">🔄 새로고침</button>
      <button class="btn btn-primary" onclick="syncFromSeed()" title="TM 데이터 관리 시드와 비교하여 새 조합 발급 + 사라진 조합 비활성">⚡ 시드 동기화</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>티켓번호</th>
            <th>통신사</th>
            <th>속도</th>
            <th>TV 상품</th>
            <th>WiFi</th>
            <th class="num">월 요금</th>
            <th class="num">🎁 사은품</th>
            <th>상태</th>
            <th>액션</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="9" class="loading">불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>

    <div style="margin-top: 12px; font-size: 11px; color: #64748b;">
      💡 각 행은 발급 시점의 carrier·speed·TV·WiFi·요금·사은품을 <b>박제(snapshot)</b>합니다. 시드 변경 → "⚡ 시드 동기화" 클릭 → 새 조합은 신규 발급, 사라진 조합은 비활성.
    </div>

    <div class="coming-soon">
      🏠 <b>가전 렌탈 티켓</b>은 Phase 2에서 별도 설계 예정 (상품 추가가 동적이라 다른 패턴 필요).
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
const API = '/api/incentive';
let TICKETS = [];
let carrierFilter = 'all';
let statusFilter = 'all';

function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'show err' : 'show';
  setTimeout(() => { t.className = ''; }, 2500);
}

function getToken() { return localStorage.getItem('incentive-auth-token-v1'); }

async function apiFetch(path, opts = {}) {
  const token = getToken();
  if (!token) { window.parent.postMessage({ type: 'logout' }, '*'); throw new Error('no token'); }
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'fetch failed' }));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

const fmt = n => n == null ? '-' : Number(n).toLocaleString('ko-KR');

async function load() {
  try {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="9" class="loading">불러오는 중...</td></tr>';
    const { tickets } = await apiFetch('/tickets/internet');
    TICKETS = tickets;
    updateStats();
    render();
  } catch (e) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="9" class="empty">로드 실패: ' + e.message + '</td></tr>';
  }
}

function updateStats() {
  const active = TICKETS.filter(t => t.is_active).length;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-inactive').textContent = TICKETS.length - active;
  document.getElementById('stat-total').textContent = TICKETS.length;
}

function render() {
  const search = document.getElementById('search').value.trim().toLowerCase();
  const filtered = TICKETS.filter(t => {
    if (carrierFilter !== 'all' && t.carrier !== carrierFilter) return false;
    if (statusFilter === 'active' && !t.is_active) return false;
    if (statusFilter === 'inactive' && t.is_active) return false;
    if (search) {
      const blob = (t.ticket_number + ' ' + t.carrier + ' ' + t.speed + ' ' + (t.tv_label||'')).toLowerCase();
      if (!blob.includes(search)) return false;
    }
    return true;
  });
  const html = filtered.length === 0 ? '<tr><td colspan="9" class="empty">검색 결과 없음</td></tr>' :
    filtered.map(t => {
      const badge = t.carrier === 'skt' ? 'badge-skt' : t.carrier === 'kt' ? 'badge-kt' : 'badge-lgu';
      const cLabel = t.carrier === 'skt' ? 'SKT' : t.carrier === 'kt' ? 'KT' : 'LGU+';
      return `<tr class="${t.is_active ? '' : 'inactive'}">
        <td><span class="cell-ticket">${t.ticket_number}</span></td>
        <td><span class="badge ${badge}">${cLabel}</span></td>
        <td><b>${t.speed}</b></td>
        <td>${t.tv_label || '-'}</td>
        <td>${t.has_wifi ? '<span style="color:#16a34a;font-weight:700">✓ 사용</span>' : '<span style="color:#64748b">✗ 미사용</span>'}</td>
        <td class="num"><span class="cell-fee">${fmt(t.monthly_fee)}원</span></td>
        <td class="num"><span class="cell-gift">${fmt(t.gift_amount)}원</span></td>
        <td>${t.is_active ?
          '<span class="badge badge-active">● 활성</span>' :
          '<span class="badge badge-inactive">○ 비활성</span>'}</td>
        <td>${t.is_active ?
          `<button class="btn" onclick="deactivate(${t.id}, '${t.ticket_number}')">비활성</button>` :
          `<button class="btn" onclick="activate(${t.id}, '${t.ticket_number}')">재활성</button>`}</td>
      </tr>`;
    }).join('');
  document.getElementById('tbody').innerHTML = html;
}

document.getElementById('search').addEventListener('input', render);
document.querySelectorAll('.pill[data-carrier]').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill[data-carrier]').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    carrierFilter = p.dataset.carrier;
    render();
  });
});
document.querySelectorAll('.pill[data-status]').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill[data-status]').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    statusFilter = p.dataset.status;
    render();
  });
});

function reload() { load(); showToast('새로고침'); }

async function deactivate(id, tn) {
  if (!confirm(`${tn} 티켓 비활성화? (snapshot 박제 — row 삭제 안 됨)`)) return;
  try {
    await apiFetch(`/tickets/internet/${id}/deactivate`, { method: 'PATCH' });
    showToast(`${tn} 비활성화`);
    load();
  } catch (e) { showToast('실패: ' + e.message, true); }
}

async function activate(id, tn) {
  try {
    await apiFetch(`/tickets/internet/${id}/activate`, { method: 'PATCH' });
    showToast(`${tn} 재활성`);
    load();
  } catch (e) { showToast('실패: ' + e.message, true); }
}

// 시드 동기화: calculator.html을 hidden iframe으로 띄워서 TICKETS+price+gift 추출 → POST sync
async function syncFromSeed() {
  if (!confirm('TM 데이터 관리 시드와 비교 동기화\n(새 조합 → 신규 발급 / 사라진 조합 → 비활성)\n진행할까요?')) return;
  showToast('시드 fetch 중...');
  try {
    const data = await extractTicketsFromCalc();
    if (!data || data.length === 0) throw new Error('시드 추출 실패');
    const res = await apiFetch('/tickets/internet/sync', {
      method: 'POST',
      body: JSON.stringify({ tickets: data })
    });
    showToast(`✓ 신규 ${res.inserted} / 재활성 ${res.reactivated} / 비활성 ${res.deactivated}`);
    load();
  } catch (e) { showToast('동기화 실패: ' + e.message, true); }
}

function extractTicketsFromCalc() {
  return new Promise((resolve, reject) => {
    const iframe = document.createElement('iframe');
    iframe.src = '/docs/calculator.html?admin=1';
    iframe.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px;opacity:0';
    let resolved = false;
    iframe.onload = () => {
      let tries = 0;
      const timer = setInterval(() => {
        try {
          const win = iframe.contentWindow;
          if (win && win.TICKETS && win.D && win.calcTicketPrice && win.getGiftAmount && win.TICKETS.length > 0) {
            const out = win.TICKETS.map(t => {
              const d = win.D[t.carrier];
              return {
                ticket_number: t.number,
                carrier: t.carrier,
                speed: t.speed,
                tv_idx: t.tvIdx,
                tv_label: t.tvIdx === 0 ? '인터넷 단독' : (d.tv[t.tvIdx]?.n || `TV ${t.tvIdx}`),
                has_wifi: !!t.wifi,
                monthly_fee: win.calcTicketPrice(d, t.speed, t.tvIdx, t.wifi) | 0,
                gift_amount: win.getGiftAmount(d, t.speed, t.tvIdx) | 0,
              };
            });
            clearInterval(timer);
            iframe.remove();
            resolved = true;
            resolve(out);
          }
          if (++tries > 40) {
            clearInterval(timer); iframe.remove();
            if (!resolved) reject(new Error('calculator.html 시드 로드 타임아웃'));
          }
        } catch { clearInterval(timer); iframe.remove(); reject(new Error('iframe 접근 실패')); }
      }, 200);
    };
    document.body.appendChild(iframe);
  });
}

// ════════════════════════════════════════════════════════════
// 동적 sync — 페이지 진입 시 1회 + 60초 polling + BroadcastChannel
// ════════════════════════════════════════════════════════════
const SYNC_CHANNEL = 'incentive-seed-changed';
let _bc = null;
let _pollTimer = null;
let _syncing = false;

async function autoSync(reason) {
  if (_syncing) return;
  _syncing = true;
  try {
    const data = await extractTicketsFromCalc();
    if (!data || data.length === 0) return;
    const res = await apiFetch('/tickets/internet/sync', {
      method: 'POST',
      body: JSON.stringify({ tickets: data })
    });
    const changed = (res.inserted || 0) + (res.updated || 0) + (res.deactivated || 0);
    if (changed > 0) {
      console.log(`[auto-sync ${reason}] ✓ +${res.inserted} ~${res.updated} -${res.deactivated}`);
      showToast(`자동 동기화: 신규 ${res.inserted} / 변경 ${res.updated} / 비활성 ${res.deactivated}`);
      load();
    } else {
      console.log(`[auto-sync ${reason}] no change (unchanged ${res.unchanged})`);
    }
  } catch (e) {
    console.warn('[auto-sync] failed:', e.message);
  } finally {
    _syncing = false;
  }
}

function startDynamicSync() {
  // 1) BroadcastChannel — 다른 어드민 페이지(calculator.html 등)에서 시드 변경 알림 받기
  try {
    _bc = new BroadcastChannel(SYNC_CHANNEL);
    _bc.onmessage = (ev) => {
      console.log('[bc] received:', ev.data);
      autoSync('bc:' + (ev.data?.source || 'unknown'));
    };
  } catch (e) { console.warn('BroadcastChannel 미지원:', e.message); }

  // 2) 60초 polling (탭 활성 시에만)
  _pollTimer = setInterval(() => {
    if (document.visibilityState === 'visible') autoSync('poll');
  }, 60000);

  // 3) 탭 활성화 즉시 sync (다른 탭에서 시드 수정 후 돌아왔을 때)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') autoSync('visibility');
  });
}

document.addEventListener('DOMContentLoaded', () => {
  if (!getToken()) { window.parent.postMessage({ type: 'logout' }, '*'); return; }
  load();
  // 최초 진입 후 자동 sync (calculator.html 시드와 1회 정합 확인)
  setTimeout(() => autoSync('init'), 2000);
  startDynamicSync();
});
</script>

</body>
</html>
