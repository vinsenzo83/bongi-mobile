<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TM 상담 도구</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
* { box-sizing: border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background:#eef1f6; color:#0f172a; font-size:13px; -webkit-font-smoothing:antialiased; letter-spacing:-0.005em;
}

/* ===== 레이아웃 ===== */
html, body { overflow:hidden; }
.tm-app {
  display:grid; grid-template-columns: 300px minmax(0, 1fr) 400px; gap:12px;
  padding:12px; height:100vh; max-width:1800px; margin:0 auto;
}
.tm-panel {
  background:#fff; border-radius:14px; padding:18px;
  box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.04);
  overflow-y:auto; overflow-x:hidden; border:1px solid rgba(15,23,42,0.04);
  min-height:0; min-width:0;
}
.tm-panel h2 {
  font-size:13px; font-weight:800; color:#1e293b; margin-bottom:12px;
  padding-bottom:8px; border-bottom:1.5px solid #f1f5f9;
  letter-spacing:-0.01em; display:flex; align-items:center; gap:6px;
}
.tm-panel h2:not(:first-child) { margin-top:20px; }

/* ===== 좌측 ===== */
.tm-field { margin-bottom:9px; }
.tm-field label { display:block; font-size:11px; font-weight:600; color:#64748b; margin-bottom:4px; letter-spacing:0.01em; }
.tm-field input, .tm-field textarea, .tm-field select {
  width:100%; padding:9px 11px; border:1.5px solid #e2e8f0; border-radius:8px;
  font-size:13px; font-family:inherit; outline:none;
  transition:border-color 0.15s, box-shadow 0.15s; background:#f8fafc;
}
.tm-field input:focus, .tm-field textarea:focus, .tm-field select:focus {
  border-color:#3b82f6; background:#fff; box-shadow:0 0 0 3px rgba(59,130,246,0.1);
}
.tm-field textarea { min-height:80px; resize:vertical; }

.tm-script-step {
  position:relative;
  background:#f8fafc; border:1.5px solid #e2e8f0; border-radius:9px;
  padding:10px 12px; margin-bottom:6px; transition:all 0.18s;
}
.tm-script-step:hover { border-color:#cbd5e1; background:#f1f5f9; }
.tm-script-step.active {
  background:linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
  border-color:#3b82f6;
  box-shadow:0 1px 3px rgba(59,130,246,0.15);
}
.tm-script-step-title-row { display:flex; align-items:center; gap:6px; }
.tm-script-step-title {
  flex:1; font-size:12px; font-weight:700; color:#1e293b;
  outline:none; border-radius:4px; padding:2px 4px; min-height:14px;
}
.tm-script-step-title:focus {
  background:#fffbe6; box-shadow:inset 0 0 0 1px #fbbf24;
}
.tm-script-step.active .tm-script-step-title { color:#1d4ed8; }
.tm-script-step-num {
  display:inline-flex; align-items:center; justify-content:center;
  width:18px; height:18px; background:#cbd5e1; color:#475569;
  border-radius:50%; font-size:10px; font-weight:800; flex-shrink:0;
  cursor:pointer;
}
.tm-script-step.active .tm-script-step-num { background:#3b82f6; color:#fff; }
.tm-script-step-del {
  width:20px; height:20px; line-height:18px; text-align:center;
  background:transparent; border:1px solid transparent; border-radius:5px;
  color:#94a3b8; cursor:pointer; font-size:13px; font-weight:700;
  opacity:0; transition:all 0.15s; padding:0; flex-shrink:0;
}
.tm-script-step:hover .tm-script-step-del { opacity:1; }
.tm-script-step-del:hover { background:#fee2e2; border-color:#fca5a5; color:#dc2626; }
.tm-script-step-text {
  display:block; font-size:11.5px; color:#475569; line-height:1.6; margin-top:7px;
  padding:7px 8px 0; border-top:1px dashed #cbd5e1;
  outline:none; border-radius:4px; min-height:14px;
}
.tm-script-step-text:focus {
  background:#fffbe6; box-shadow:inset 0 0 0 1px #fbbf24;
  border-top-color:transparent;
}
.tm-script-step.active .tm-script-step-text { color:#1e293b; }
.tm-script-add-btn {
  display:block; width:100%; padding:9px; margin-top:6px;
  background:#fff; border:1.5px dashed #cbd5e1; border-radius:9px;
  color:#64748b; font-size:12px; font-weight:700; cursor:pointer;
  font-family:inherit; transition:all 0.15s;
}
.tm-script-add-btn:hover {
  border-color:#3b82f6; color:#1d4ed8; background:#eff6ff;
}

/* ===== 메모 저장 / 목록 ===== */
.tm-memo-actions { display:flex; gap:6px; margin-top:6px; }
.tm-memo-btn {
  flex:1; padding:7px; border:1.5px solid #e2e8f0; border-radius:7px;
  background:#fff; color:#475569; font-size:12px; font-weight:700;
  cursor:pointer; font-family:inherit; transition:all 0.15s;
}
.tm-memo-btn:hover { border-color:#3b82f6; color:#1d4ed8; background:#eff6ff; }
.tm-memo-btn.primary {
  background:linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
  border-color:#3b82f6; color:#fff;
  box-shadow:0 1px 3px rgba(59,130,246,0.3);
}
.tm-memo-btn.primary:hover { color:#fff; transform:translateY(-1px); box-shadow:0 2px 6px rgba(59,130,246,0.4); }
.tm-memo-list { margin-top:8px; display:flex; flex-direction:column; gap:5px; }
.tm-memo-item {
  position:relative;
  background:#f8fafc; border:1px solid #e2e8f0; border-radius:7px;
  padding:7px 9px; transition:all 0.15s;
}
.tm-memo-item:hover { border-color:#cbd5e1; background:#f1f5f9; }
.tm-memo-item.active { border-color:#3b82f6; background:linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); }
.tm-memo-item-time {
  font-size:9.5px; color:#94a3b8; font-weight:700; margin-bottom:3px;
  letter-spacing:0.04em;
}
.tm-memo-item-preview {
  font-size:11px; color:#334155; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; text-overflow:ellipsis; word-break:break-all;
}
.tm-memo-item-actions {
  position:absolute; top:5px; right:5px; display:flex; gap:3px;
  opacity:0; transition:opacity 0.15s;
}
.tm-memo-item:hover .tm-memo-item-actions { opacity:1; }
.tm-memo-item-act {
  width:22px; height:22px; line-height:1; padding:0; border-radius:5px;
  border:1px solid transparent; background:#fff; color:#64748b;
  font-size:11px; font-weight:700; cursor:pointer; font-family:inherit;
  transition:all 0.12s;
}
.tm-memo-item-act:hover { border-color:#cbd5e1; }
.tm-memo-item-act.del:hover { background:#fee2e2; border-color:#fca5a5; color:#dc2626; }
.tm-memo-empty { font-size:11px; color:#94a3b8; text-align:center; padding:10px 0; }

/* ===== 중앙: 카드 UI ===== */
.tm-cards { display:grid; gap:10px; }
.tm-card {
  background:#fff; border:1.5px solid #e2e8f0; border-radius:14px;
  padding:14px 16px; transition:all 0.18s;
  box-shadow:0 1px 2px rgba(15,23,42,0.03);
}
.tm-card:hover { border-color:#cbd5e1; box-shadow:0 2px 8px rgba(15,23,42,0.06); }
.tm-card-title {
  font-size:11px; font-weight:800; color:#475569; margin-bottom:10px;
  letter-spacing:0.04em; text-transform:uppercase;
  display:flex; align-items:center; gap:8px;
}
.tm-card-title .num {
  display:inline-flex; align-items:center; justify-content:center;
  width:20px; height:20px; line-height:1;
  background:linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
  color:#fff; border-radius:50%; font-size:10.5px; font-weight:800;
  box-shadow:0 1px 3px rgba(59,130,246,0.3);
}
.tm-card-title .hint {
  margin-left:auto; font-size:10px; font-weight:600; color:#0ea5e9;
  background:#e0f2fe; padding:2px 7px; border-radius:10px; text-transform:none; letter-spacing:0;
}
.tm-options { display:flex; gap:7px; flex-wrap:wrap; }
.tm-option {
  padding:9px 14px; border:1.5px solid #e2e8f0; border-radius:9px; cursor:pointer;
  font-size:13px; font-weight:600; background:#fff; color:#334155;
  transition:all 0.14s; user-select:none; line-height:1.3;
}
.tm-option:hover {
  border-color:#93c5fd; background:#eff6ff; color:#1d4ed8;
  transform:translateY(-1px);
}
.tm-option.selected {
  background:linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
  border-color:#3b82f6; color:#fff;
  box-shadow:0 2px 8px rgba(59,130,246,0.35), 0 1px 2px rgba(0,0,0,0.05);
  transform:translateY(-1px);
}

/* 통신사별 브랜드 컬러 */
#card-carrier .tm-option[data-value="skt"].selected { background:linear-gradient(135deg, #ed1c24 0%, #c41218 100%); border-color:#ed1c24; box-shadow:0 2px 8px rgba(237,28,36,0.35); }
#card-carrier .tm-option[data-value="kt"].selected  { background:linear-gradient(135deg, #1f2937 0%, #000000 100%); border-color:#000; box-shadow:0 2px 8px rgba(0,0,0,0.4); }
#card-carrier .tm-option[data-value="lgu"].selected { background:linear-gradient(135deg, #e6007e 0%, #b30062 100%); border-color:#e6007e; box-shadow:0 2px 8px rgba(230,0,126,0.35); }

/* KT 프리미엄 회선별 UI */
#c-premium-members .calc-select {
  padding:7px 9px; border-radius:7px; border:1.5px solid #e2e8f0;
  background:#fff; color:#0f172a; font-size:12px; font-family:inherit;
}

/* ===== 우측: 결과 패널 (컴팩트) ===== */
.tm-result-panel {
  background:linear-gradient(160deg, #1e293b 0%, #0f172a 60%, #020617 100%);
  color:#fff; padding:12px 14px;
  box-shadow:0 4px 20px rgba(15,23,42,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
  border:none;
}
.tm-result-panel h2 {
  color:#e2e8f0; border-bottom-color:rgba(255,255,255,0.1);
  font-size:12px; margin-bottom:8px; padding-bottom:5px;
}
.tm-result { padding-top:0; }
.tm-result .calc-line { display:flex; justify-content:space-between; padding:2px 0; font-size:11.5px; line-height:1.4; }
.tm-result .calc-line .l { color:rgba(226,232,240,0.55); }
.tm-result .calc-line .v { font-weight:700; color:#f8fafc; }
.tm-result .calc-line.discount .v { color:#4ade80; }
.tm-result .calc-line.total {
  border-top:1.5px solid rgba(255,255,255,0.15); margin-top:5px; padding-top:6px;
  font-size:13.5px; font-weight:900;
}
.tm-result .calc-line.total .v { color:#60a5fa; }
.tm-result .calc-line.sub { font-size:10px; padding:1px 0 1px 10px; }
.tm-result .calc-line.sub .l { color:rgba(226,232,240,0.32); }
.tm-result .calc-line.sub .v { color:rgba(226,232,240,0.4); font-weight:400; }

/* 정보 카드 (요금 구조 한눈에 보기) */
.tm-info-grid { display:grid; gap:8px; margin-bottom:12px; }
.tm-info-row {
  display:grid; grid-template-columns: 130px 1fr; gap:10px; align-items:start;
  padding:8px 10px; background:#f8fafc; border-radius:8px; border:1px solid #f1f5f9;
}
.tm-info-label { font-size:11px; font-weight:700; color:#64748b; letter-spacing:0.01em; }
.tm-info-value { font-size:12px; color:#334155; line-height:1.5; }
.tm-info-value b { color:#0f172a; font-weight:800; }
.tm-info-btn {
  display:flex; align-items:center; gap:8px;
  padding:11px 14px; background:linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color:#fff; border-radius:10px; text-decoration:none;
  font-size:13px; font-weight:700; transition:all 0.18s;
  box-shadow:0 2px 8px rgba(15,23,42,0.2);
}
.tm-info-btn:hover {
  transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(15,23,42,0.3);
}
@media (max-width: 768px) {
  .tm-info-row { grid-template-columns: 1fr; gap:4px; }
}

/* 티켓번호 조회 (컴팩트) */
.tm-ticket-lookup {
  background:rgba(99,102,241,0.13);
  border:1px solid rgba(129,140,248,0.6);
  border-radius:7px; padding:7px 9px; margin-bottom:10px;
}
.tm-ticket-lookup-label {
  font-size:9.5px; color:#a5b4fc; font-weight:700;
  margin-bottom:4px; letter-spacing:0.04em;
}
.tm-ticket-lookup-row { display:flex; gap:5px; }
.tm-ticket-lookup-row input {
  flex:1; padding:5px 8px; border-radius:5px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.07); color:#fff;
  font-size:11.5px; font-family:'SF Mono', Monaco, monospace;
  text-transform:uppercase; letter-spacing:0.8px; outline:none;
  transition:all 0.15s;
}
.tm-ticket-lookup-row input:focus {
  background:rgba(255,255,255,0.12); border-color:#a5b4fc;
}
.tm-ticket-lookup-row input::placeholder {
  color:rgba(255,255,255,0.32); letter-spacing:0; text-transform:none; font-size:10.5px;
}
.tm-ticket-lookup-row button {
  padding:5px 11px; border:none; border-radius:5px;
  background:linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
  color:#fff; font-size:11px; font-weight:700; cursor:pointer;
  font-family:inherit; transition:all 0.15s;
  box-shadow:0 1px 3px rgba(99,102,241,0.3);
}
.tm-ticket-lookup-row button:hover { transform:translateY(-1px); box-shadow:0 2px 6px rgba(99,102,241,0.45); }
.tm-ticket-lookup-msg {
  font-size:10px; color:#fca5a5; margin-top:5px; display:none; line-height:1.4;
}
.tm-ticket-lookup-msg.show { display:block; }
.tm-ticket-lookup-msg.success { color:#86efac; }

/* WiFi 안내 배너 */
.tm-wifi-notice {
  margin-top:10px; padding:8px 11px; border-radius:8px;
  background:linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
  border:1px solid #10b981; color:#065f46;
  font-size:11.5px; font-weight:600; display:none;
}
.tm-wifi-notice.show { display:block; }

.tm-hidden { position:absolute; left:-9999px; top:-9999px; }

/* 스크롤바 */
.tm-panel::-webkit-scrollbar { width:6px; }
.tm-panel::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
.tm-result-panel::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); }

/* ===== 반응형 단계 ===== */
@media (max-width: 1400px) {
  .tm-app { grid-template-columns: 280px minmax(0,1fr) 380px; gap:10px; padding:10px; }
  .tm-panel { padding:14px; }
}
@media (max-width: 1200px) {
  .tm-app { grid-template-columns: 260px minmax(0,1fr) 360px; gap:8px; padding:8px; }
  .tm-option { padding:7px 11px; font-size:12px; }
  .tm-card { padding:12px 14px; }
  .tm-card-title { font-size:10.5px; }
}
@media (max-width: 1024px) {
  /* 태블릿: 좌측만 위로, 중앙+우측 2단 */
  html, body { overflow:auto; }
  .tm-app {
    grid-template-columns: minmax(0,1fr) 360px;
    grid-template-areas: "left left" "main right";
    height:auto; min-height:100vh;
  }
  .tm-app > aside:first-child { grid-area: left; }
  .tm-app > main { grid-area: main; }
  .tm-app > aside:last-child { grid-area: right; }
}
@media (max-width: 768px) {
  /* 모바일: 단일 컬럼 */
  .tm-app {
    grid-template-columns: 1fr;
    grid-template-areas: "left" "main" "right";
    padding:8px; gap:8px;
  }
  .tm-result-panel { max-height:60vh; }
}
</style>
</head>
<body>

<div class="tm-app">

  <!-- ═══ 좌측 ═══ -->
  <aside class="tm-panel">
    <h2>💬 상담 스크립트</h2>
    <div id="tm-scripts"></div>
    <button type="button" class="tm-script-add-btn" id="tm-script-add">+ 단계 추가</button>

    <h2>📝 메모</h2>
    <div class="tm-field"><textarea id="cust-memo" placeholder="상담 메모를 입력하고 [저장]을 누르세요..."></textarea></div>
    <div class="tm-memo-actions">
      <button type="button" id="tm-memo-save" class="tm-memo-btn primary">💾 저장</button>
      <button type="button" id="tm-memo-new" class="tm-memo-btn">+ 새 메모</button>
    </div>
    <div id="tm-memo-list" class="tm-memo-list"></div>
  </aside>

  <!-- ═══ 중앙: 카드 UI ═══ -->
  <main class="tm-panel" style="background:transparent;box-shadow:none;padding:0">
    <div class="tm-cards">
      <div class="tm-card">
        <div class="tm-card-title"><span class="num">1</span>통신사</div>
        <div class="tm-options" id="card-carrier">
          <div class="tm-option selected" data-value="skt">SKT (B tv)</div>
          <div class="tm-option" data-value="kt">KT (지니TV)</div>
          <div class="tm-option" data-value="lgu">LGU+ (U+tv)</div>
        </div>
      </div>

      <div class="tm-card">
        <div class="tm-card-title"><span class="num">2</span>인터넷 속도</div>
        <div class="tm-options" id="card-speed">
          <div class="tm-option" data-value="100M">100M</div>
          <div class="tm-option selected" data-value="500M">500M</div>
          <div class="tm-option" data-value="1G">1G</div>
        </div>
      </div>

      <div class="tm-card">
        <div class="tm-card-title"><span class="num">3</span>WiFi <span class="hint" id="wifi-hint" style="display:none">기본 포함</span></div>
        <div class="tm-options" id="card-wifi">
          <div class="tm-option" data-value="0">미사용</div>
          <div class="tm-option selected" data-value="1">사용</div>
        </div>
        <div class="tm-wifi-notice" id="wifi-notice">📶 이 통신사·속도는 WiFi 라우터가 무료로 기본 제공됩니다</div>
      </div>

      <div class="tm-card">
        <div class="tm-card-title"><span class="num">4</span>TV 상품</div>
        <div class="tm-options" id="card-tv"></div>
      </div>

      <div class="tm-card" id="card-settop-wrap" style="display:none">
        <div class="tm-card-title"><span class="num">5</span>셋톱박스 <span class="hint">TV 임대료 별도</span></div>
        <div class="tm-options" id="card-settop"></div>
      </div>

      <div class="tm-card">
        <div class="tm-card-title"><span class="num">6</span>결합 종류</div>
        <div class="tm-options" id="card-bundle"></div>
      </div>

      <div class="tm-card" id="card-lines-wrap">
        <div class="tm-card-title"><span class="num">7</span>결합 인원 / 회선</div>
        <div class="tm-options" id="card-lines"></div>
      </div>

      <div class="tm-card" id="card-range-wrap">
        <div class="tm-card-title"><span class="num">8</span>요금 구간</div>
        <div class="tm-options" id="card-range"></div>
      </div>

      <div class="tm-card" id="card-premium-wrap" style="display:none">
        <div class="tm-card-title"><span class="num">💎</span>KT 프리미엄 가족결합 (회선별)</div>
        <div id="c-premium-members" style="display:flex;flex-direction:column;gap:6px"></div>
      </div>
    </div>

    <!-- 📊 calculator.html 임베드 — 위쪽 "요금 계산기" 영역만 hide, 나머지 모든 .section 표시 -->
    <div id="tm-calc-doc" style="margin-top:14px;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(15,23,42,0.12);background:#0f172a">
      <iframe id="calc-doc-iframe" src="/docs/calculator.html"
              style="width:100%;border:none;display:block;background:#0f172a;min-height:1500px"
              scrolling="no"></iframe>
    </div>
  </main>

  <!-- ═══ 우측 ═══ -->
  <aside class="tm-panel tm-result-panel">
    <h2>💰 견적 결과</h2>
    <div class="tm-ticket-lookup">
      <div class="tm-ticket-lookup-label">🎫 티켓번호로 빠른 조회</div>
      <div class="tm-ticket-lookup-row">
        <input type="text" id="c-ticket-lookup" list="ticket-options" placeholder="예: SK0015 / KT0008 / LG0003" autocomplete="off">
        <datalist id="ticket-options"></datalist>

// 사은품 override (calculator.html ↔ tm.html 동기화)
var GIFT_OVERRIDE_KEY = 'bongi-gift-overrides';
function applyGiftOverrides() {
  try {
    var ov = JSON.parse(localStorage.getItem(GIFT_OVERRIDE_KEY) || '{}');
    Object.keys(ov).forEach(function(carrier) {
      if (!D[carrier] || !D[carrier].gift) return;
      Object.keys(ov[carrier] || {}).forEach(function(bucket) {
        if (!D[carrier].gift[bucket]) D[carrier].gift[bucket] = {};
        Object.keys(ov[carrier][bucket] || {}).forEach(function(sp) {
          D[carrier].gift[bucket][sp] = ov[carrier][bucket][sp];
        });
      });
    });
  } catch(e) {}
}
applyGiftOverrides();

function getGiftAmount(d, sp, tvIdx) {
  if (!d.gift) return 0;
  var bucket = tvIdx > 0 ? d.gift.combo : d.gift.solo;
  return bucket ? (bucket[sp] || 0) : 0;
}

function fmt(n) { return n.toLocaleString() + '원'; }

(function resolveDefaults() {
  for (var k in D) {
    var d = D[k];
    if (d.setTopOptions) {
      var defSt = d.setTopOptions.find(function(o){ return o.isDefault && o.active; })
                || d.setTopOptions.find(function(o){ return o.active; });
      if (defSt) { d.setTop = defSt.fee; d.setTopName = defSt.name; }
    }
    if (d.wifiOptions) {
      var defWf = d.wifiOptions.find(function(o){ return o.isDefault && o.active; })
                || d.wifiOptions.find(function(o){ return o.active; });
      if (defWf) {
        d.wifiName = defWf.name;
        if (defWf.fees) {
          d.wifiPrice = defWf.fees;
          d.wifiCost = defWf.fees['100M'];
        }
      }
    }
  }
})();

function pad4(n) { return ('0000' + n).slice(-4); }

function wifiIsOptional(d, sp, hasTv) {
  if (hasTv) return d.tvInternetNoWifi[sp] !== d.tvInternetWithWifi[sp];
  var wifiForSp = d.wifiPrice ? d.wifiPrice[sp] : (typeof d.wifiCost === 'number' ? d.wifiCost : 1100);
  return wifiForSp > 0;
}

function generateTickets() {
  var tickets = [];
  var speeds = ['100M', '500M', '1G'];
  ['skt', 'kt', 'lgu'].forEach(function(key) {
    var d = D[key];
    var num = 1;
    function pushTicket(sp, tvIdx, wifi) {
      tickets.push({ number: d.prefix + pad4(num++), carrier: key, speed: sp, tvIdx: tvIdx, wifi: wifi });
    }
    speeds.forEach(function(sp) {
      if (wifiIsOptional(d, sp, false)) { pushTicket(sp, 0, false); pushTicket(sp, 0, true); }
      else { pushTicket(sp, 0, true); }
    });
    for (var i = 1; i < d.tv.length; i++) {
      speeds.forEach(function(sp) {
        if (wifiIsOptional(d, sp, true)) { pushTicket(sp, i, false); pushTicket(sp, i, true); }
        else { pushTicket(sp, i, true); }
      });
    }
  });
  return tickets;
}

var TICKETS = generateTickets();

function findTicket(carrier, speed, tvIdx, wifi) {
  for (var i = 0; i < TICKETS.length; i++) {
    var t = TICKETS[i];
    if (t.carrier === carrier && t.speed === speed && t.tvIdx === tvIdx && t.wifi === wifi) return t;
  }
  for (var j = 0; j < TICKETS.length; j++) {
    var tt = TICKETS[j];
    if (tt.carrier === carrier && tt.speed === speed && tt.tvIdx === tvIdx) return tt;
  }
  return null;
}

        catalog.map(function(p, pi) {
          var hint = (!isRep && p.dc) ? ' → 프리미엄 ' + p.dc.toLocaleString() + '원' : '';
          return '<option value="' + pi + '"' + (pi === defVal ? ' selected' : '') + '>' + p.label + hint + '</option>';

  wrap.innerHTML = html;

function updateWifiUI() {

  var wifiCheck = document.getElementById('c-wifi');

function init() {
  var cs = document.getElementById('c-carrier');

  for (var k in D) {
    var o = document.createElement('option');
    o.value = k; o.textContent = D[k].name;

  buildTV();

  updateSetTopInfo();
  calc();

function buildTV() {
  var c = document.getElementById('c-carrier').value;
  var ts = document.getElementById('c-tv');

function selectInCard(cardId, value) {
  var card = document.getElementById(cardId);
  if (!card) return;
  card.querySelectorAll('.tm-option').forEach(function(o){
    o.classList.toggle('selected', String(o.dataset.value) === String(value));
  });
}

function rebuildCardFromSelect(cardId, selId) {
  var sel = document.getElementById(selId);
  var card = document.getElementById(cardId);
  if (!sel || !card) return;
  card.innerHTML = Array.prototype.map.call(sel.options, function(o){
    return '<div class="tm-option' + (o.value === sel.value ? ' selected' : '') + '" data-value="' + o.value + '">' + o.textContent + '</div>';
  }).join('');
}

function rebuildSettopCard() {
  var c = document.getElementById('c-carrier').value;
  var d = D[c];
  var card = document.getElementById('card-settop');
  if (!d.setTopOptions) { card.innerHTML = ''; return; }
  card.innerHTML = d.setTopOptions.filter(function(o){ return o.active; }).map(function(o){
    return '<div class="tm-option' + (d.setTopName === o.name ? ' selected' : '') + '" data-value="' + o.id + '">' + o.name + ' <span style="opacity:0.7;font-size:11px">(' + o.fee.toLocaleString() + ')</span></div>';
  }).join('');
}

function syncAllCards() {
  selectInCard('card-carrier', document.getElementById('c-carrier').value);
  selectInCard('card-speed', document.getElementById('c-speed').value);
  selectInCard('card-wifi', document.getElementById('c-wifi').checked ? '1' : '0');
  rebuildCardFromSelect('card-tv', 'c-tv');
  rebuildSettopCard();
  rebuildCardFromSelect('card-bundle', 'c-bundle');
  document.getElementById('card-lines-wrap').style.display = (document.getElementById('c-lines-group').style.display === 'none') ? 'none' : '';
  document.getElementById('card-range-wrap').style.display = (document.getElementById('c-range-group').style.display === 'none') ? 'none' : '';
  document.getElementById('card-premium-wrap').style.display = (document.getElementById('c-premium-group').style.display === 'none') ? 'none' : '';
  rebuildCardFromSelect('card-lines', 'c-lines');
  rebuildCardFromSelect('card-range', 'c-range');

  // TV 없으면 셋톱 카드 숨김
  var tvIdx = parseInt(document.getElementById('c-tv').value) || 0;
  document.getElementById('card-settop-wrap').style.display = (tvIdx > 0) ? '' : 'none';

  // WiFi 기본 포함 안내 (calc()의 wifiIncluded 로직과 동일)
  var c = document.getElementById('c-carrier').value;
  var sp = document.getElementById('c-speed').value;
  var d = D[c];
  var wifiIncluded = d.tvInternetNoWifi && d.tvInternetWithWifi && d.tvInternetNoWifi[sp] === d.tvInternetWithWifi[sp];
  var hint = document.getElementById('wifi-hint');
  var notice = document.getElementById('wifi-notice');
  if (wifiIncluded) {
    hint.style.display = '';
    notice.classList.add('show');
  } else {
    hint.style.display = 'none';
    notice.classList.remove('show');
  }
}

// v1 이벤트 바인딩 (숨김 select가 변경될 때마다 calc + 카드 재동기화)
document.getElementById('c-carrier').addEventListener('change', function() { buildTV(); updateBundleUI(); updateRangeUI(); updateWifiUI(); updateSetTopInfo(); calc(); syncAllCards(); });
document.getElementById('c-speed').addEventListener('change', function() { updateWifiUI(); calc(); syncAllCards(); });
document.getElementById('c-tv').addEventListener('change', function(){ calc(); syncAllCards(); });
document.getElementById('c-wifi').addEventListener('change', function(){ calc(); syncAllCards(); });
document.getElementById('c-bundle').addEventListener('change', function() { updateRangeUI(); calc(); syncAllCards(); });
document.getElementById('c-lines').addEventListener('change', function(){ calc(); syncAllCards(); });
document.getElementById('c-range').addEventListener('change', function(){ calc(); syncAllCards(); });

// 카드 클릭 → 숨김 form 변경 → calc()
document.addEventListener('click', function(e) {
  var opt = e.target.closest('.tm-option');
  if (!opt) return;
  var card = opt.closest('.tm-options');
  if (!card) return;
  var cardId = card.id;
  var value = opt.dataset.value;

  if (cardId === 'card-settop') {
    var c = document.getElementById('c-carrier').value;
    var d = D[c];
    var found = d.setTopOptions.find(function(o){ return o.id === value; });
    if (found) {
      d.setTop = found.fee;
      d.setTopName = found.name;
      card.querySelectorAll('.tm-option').forEach(function(o){ o.classList.remove('selected'); });
      opt.classList.add('selected');
      calc();
    }
    return;
  }

  if (cardId === 'card-wifi') {
    var cb = document.getElementById('c-wifi');
    if (cb.disabled) return;
    cb.checked = (value === '1');
    cb.dispatchEvent(new Event('change'));
    selectInCard('card-wifi', value);
    return;
  }

  var map = {
    'card-carrier': 'c-carrier',
    'card-speed': 'c-speed',
    'card-tv': 'c-tv',
    'card-bundle': 'c-bundle',
    'card-lines': 'c-lines',
    'card-range': 'c-range'
  };
  if (map[cardId]) {
    var sel = document.getElementById(map[cardId]);
    sel.value = value;
    sel.dispatchEvent(new Event('change'));
    selectInCard(cardId, value);
  }
});

var SCRIPT_KEY = 'tm-scripts-v1';
var SCRIPT_DEFAULTS = [
  { title: '인사 & 본인확인', text: '안녕하세요, 리턴AI 상담사 ___입니다. 인터넷·TV 상담 도와드리겠습니다. 본인이신가요?' },
  { title: '현재 상품 확인', text: '현재 어느 통신사 사용 중이신가요? 약정 만료일은 언제인가요? 가족 결합 여부도 확인.' },
  { title: '견적 안내', text: '오른쪽 견적표를 보고 안내드립니다. 사은품 · 설치비 함께 설명. 결합 할인 강조.' },
  { title: '클로징', text: '신청 의사 확인 → 설치 일정 협의 → 필요 서류 안내 (신분증·계좌·주소).' }
];

function loadScripts() {
  try {
    var saved = localStorage.getItem(SCRIPT_KEY);
    if (saved) {
      var arr = JSON.parse(saved);
      if (Array.isArray(arr) && arr.length) return arr;
    }
  } catch(e) {}
  return SCRIPT_DEFAULTS.slice();
}

function saveScripts() {
  var steps = document.querySelectorAll('#tm-scripts .tm-script-step');
  var arr = [];
  steps.forEach(function(step){
    arr.push({
      title: step.querySelector('.tm-script-step-title').textContent.trim(),
      text: step.querySelector('.tm-script-step-text').textContent.trim()
    });
  });
  try { localStorage.setItem(SCRIPT_KEY, JSON.stringify(arr)); } catch(e) {}
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderScriptStep(idx, data, isActive) {
  var div = document.createElement('div');
  div.className = 'tm-script-step' + (isActive ? ' active' : '');
  div.innerHTML =
    '<div class="tm-script-step-title-row">' +
      '<span class="tm-script-step-num">' + (idx + 1) + '</span>' +
      '<div class="tm-script-step-title" contenteditable="true" spellcheck="false">' + escapeHtml(data.title) + '</div>' +
      '<button type="button" class="tm-script-step-del" title="단계 삭제">×</button>' +
    '</div>' +
    '<div class="tm-script-step-text" contenteditable="true" spellcheck="false">' + escapeHtml(data.text) + '</div>';
  return div;
}

function renderAllScripts() {
  var wrap = document.getElementById('tm-scripts');
  var data = loadScripts();
  wrap.innerHTML = '';
  data.forEach(function(d, i){
    wrap.appendChild(renderScriptStep(i, d, i === 0));
  });
}

function renumberSteps() {
  document.querySelectorAll('#tm-scripts .tm-script-step').forEach(function(step, i){
    var num = step.querySelector('.tm-script-step-num');
    if (num) num.textContent = (i + 1);
  });
}

renderAllScripts();

// active 토글 (번호 배지 클릭 시) + 일반 클릭으로도 active
document.getElementById('tm-scripts').addEventListener('click', function(e){
  var del = e.target.closest('.tm-script-step-del');
  if (del) {
    var step = del.closest('.tm-script-step');
    if (step) {
      step.remove();
      renumberSteps();
      saveScripts();
    }
    return;
  }
  // 편집 영역(title/text) 클릭은 active 토글 안 함
  if (e.target.closest('.tm-script-step-title') || e.target.closest('.tm-script-step-text')) return;
  var step = e.target.closest('.tm-script-step');
  if (!step) return;
  document.querySelectorAll('.tm-script-step').forEach(function(s){ s.classList.remove('active'); });
  step.classList.add('active');
});

// 편집 시 자동 저장 (input 즉시 + blur 보강)
var _scriptSaveTimer = null;
function scheduleSaveScripts() {
  clearTimeout(_scriptSaveTimer);
  _scriptSaveTimer = setTimeout(saveScripts, 300);
}
document.getElementById('tm-scripts').addEventListener('input', function(e){
  if (e.target.classList.contains('tm-script-step-title') || e.target.classList.contains('tm-script-step-text')) {
    scheduleSaveScripts();
  }
});
document.getElementById('tm-scripts').addEventListener('blur', function(e){
  if (e.target.classList.contains('tm-script-step-title') || e.target.classList.contains('tm-script-step-text')) {
    saveScripts();
  }
}, true);
// 페이지 닫기/새로고침 직전 안전망
window.addEventListener('beforeunload', saveScripts);
window.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') saveScripts();
});

var MEMO_LIST_KEY = 'tm-memos-v2';

var memoEl = document.getElementById('cust-memo');
var memoListEl = document.getElementById('tm-memo-list');
var editingMemoId = null;

function loadMemos() {
  try {
    var arr = JSON.parse(localStorage.getItem(MEMO_LIST_KEY) || '[]');
    if (Array.isArray(arr)) return arr;
  } catch(e) {}
  return [];
}
function saveMemoList(list) {
  try { localStorage.setItem(MEMO_LIST_KEY, JSON.stringify(list)); } catch(e) {}
}
function memoTimeNow() {
  var d = new Date();
  var pad = function(n){ return (n<10?'0':'') + n; };
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' +
         pad(d.getHours()) + ':' + pad(d.getMinutes());
}

// 이전 단일 메모(tm-memo-v1) → 첫 메모로 마이그레이션 (1회만)
(function migrateOldMemo() {
  try {
    var old = localStorage.getItem(MEMO_OLD_KEY);
    if (old && old.trim()) {
      var list = loadMemos();
      list.unshift({ id: Date.now(), at: memoTimeNow(), text: old });
      saveMemoList(list);
      localStorage.removeItem(MEMO_OLD_KEY);
    }
  } catch(e) {}
})();

function renderMemoList() {
  var list = loadMemos();
  if (!list.length) {
    memoListEl.innerHTML = '<div class="tm-memo-empty">저장된 메모 없음</div>';
    return;
  }
  memoListEl.innerHTML = list.map(function(m){
    var preview = (m.text || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return '<div class="tm-memo-item' + (editingMemoId === m.id ? ' active' : '') + '" data-id="' + m.id + '">' +
      '<div class="tm-memo-item-time">🕒 ' + m.at + '</div>' +
      '<div class="tm-memo-item-preview">' + preview + '</div>' +
      '<div class="tm-memo-item-actions">' +
        '<button type="button" class="tm-memo-item-act edit" title="편집">✎</button>' +
        '<button type="button" class="tm-memo-item-act del" title="삭제">×</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function saveCurrentMemo() {
  var text = (memoEl.value || '').trim();
  if (!text) { alert('메모 내용을 입력하세요.'); memoEl.focus(); return; }
  var list = loadMemos();
  if (editingMemoId !== null) {
    // 편집 중 → 기존 메모 업데이트
    var idx = list.findIndex(function(m){ return m.id === editingMemoId; });
    if (idx >= 0) {
      list[idx].text = text;
      list[idx].at = memoTimeNow();
    } else {
      list.unshift({ id: Date.now(), at: memoTimeNow(), text: text });
    }
  } else {
    // 새 메모
    list.unshift({ id: Date.now(), at: memoTimeNow(), text: text });
  }
  saveMemoList(list);
  editingMemoId = null;
  memoEl.value = '';
  try { localStorage.removeItem(MEMO_DRAFT_KEY); } catch(e) {}
  renderMemoList();
}

function newMemo() {
  if (memoEl.value.trim() && !confirm('현재 입력 중인 내용이 사라집니다. 새 메모를 시작하시겠습니까?')) return;
  editingMemoId = null;
  memoEl.value = '';
  try { localStorage.removeItem(MEMO_DRAFT_KEY); } catch(e) {}
  memoEl.focus();
  renderMemoList();
}

function loadMemoForEdit(id) {
  var list = loadMemos();
  var m = list.find(function(x){ return x.id === id; });
  if (!m) return;
  editingMemoId = id;
  memoEl.value = m.text;
  memoEl.focus();
  renderMemoList();
}

function deleteMemo(id) {
  if (!confirm('이 메모를 삭제하시겠습니까?')) return;
  var list = loadMemos().filter(function(m){ return m.id !== id; });
  saveMemoList(list);
  if (editingMemoId === id) {
    editingMemoId = null;
    memoEl.value = '';
  }
  renderMemoList();
}

// 편집 중 임시저장 복원 (페이지 로드 시)
try {
  var draft = localStorage.getItem(MEMO_DRAFT_KEY);
  if (draft) memoEl.value = draft;
} catch(e) {}

// 입력 중 임시저장 (debounce)
var _memoDraftTimer = null;
memoEl.addEventListener('input', function(){
  clearTimeout(_memoDraftTimer);
  _memoDraftTimer = setTimeout(function(){
    try { localStorage.setItem(MEMO_DRAFT_KEY, memoEl.value); } catch(e) {}
  }, 300);
});
window.addEventListener('beforeunload', function(){
  try { localStorage.setItem(MEMO_DRAFT_KEY, memoEl.value); } catch(e) {}
});

document.getElementById('tm-memo-save').addEventListener('click', saveCurrentMemo);
document.getElementById('tm-memo-new').addEventListener('click', newMemo);
memoListEl.addEventListener('click', function(e){
  var item = e.target.closest('.tm-memo-item');
  if (!item) return;
  var id = parseInt(item.dataset.id);
  if (e.target.closest('.tm-memo-item-act.del')) { deleteMemo(id); return; }
  if (e.target.closest('.tm-memo-item-act.edit')) { loadMemoForEdit(id); return; }
  // 메모 본문 클릭도 편집으로
  loadMemoForEdit(id);
});

renderMemoList();

// 단계 추가
document.getElementById('tm-script-add').addEventListener('click', function(){
  var wrap = document.getElementById('tm-scripts');
  var idx = wrap.children.length;
  var newStep = renderScriptStep(idx, { title: '새 단계', text: '내용을 입력하세요' }, false);
  wrap.appendChild(newStep);
  saveScripts();
  // 새 단계 제목 자동 포커스
  var titleEl = newStep.querySelector('.tm-script-step-title');
  if (titleEl) {
    titleEl.focus();
    var range = document.createRange();
    range.selectNodeContents(titleEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
});

// 🎫 티켓번호 조회 — 입력 시 통신사/속도/TV/WiFi 자동 설정
(function setupTicketLookup() {
  var dl = document.getElementById('ticket-options');
  TICKETS.forEach(function(t) {
    var opt = document.createElement('option');
    opt.value = t.number;
    dl.appendChild(opt);
  });

  var input = document.getElementById('c-ticket-lookup');
  var btn = document.getElementById('c-ticket-lookup-btn');
  var msg = document.getElementById('c-ticket-lookup-msg');

  function showMsg(text, kind) {
    msg.textContent = text;
    msg.className = 'tm-ticket-lookup-msg show' + (kind === 'success' ? ' success' : '');
  }
  function hideMsg() { msg.className = 'tm-ticket-lookup-msg'; }

  function lookup() {
    var num = input.value.trim().toUpperCase();
    if (!num) { hideMsg(); return; }
    var t = TICKETS.find(function(x){ return x.number === num; });
    if (!t) { showMsg('⚠️ 티켓번호를 찾을 수 없습니다: ' + num); return; }

    document.getElementById('c-carrier').value = t.carrier;
    buildTV();
    updateBundleUI();
    updateRangeUI();
    document.getElementById('c-speed').value = t.speed;
    document.getElementById('c-tv').value = t.tvIdx;
    updateWifiUI();
    var wf = document.getElementById('c-wifi');
    if (!wf.disabled) wf.checked = t.wifi;
    updateSetTopInfo();
    calc();
    syncAllCards();

    var labels = { skt: 'SKT', kt: 'KT', lgu: 'LGU+' };
    var tvLabel = t.tvIdx === 0 ? '인터넷 단독' : D[t.carrier].tv[t.tvIdx].n.split('(')[0].trim();
    showMsg('✓ ' + labels[t.carrier] + ' ' + t.speed + ' · ' + tvLabel + ' · WiFi ' + (t.wifi ? '사용' : '미사용'), 'success');
  }

  btn.addEventListener('click', lookup);
  input.addEventListener('keypress', function(e) { if (e.key === 'Enter') lookup(); });
  input.addEventListener('change', lookup);
})();

// 시작
init();
syncAllCards();

// iframe 안 calculator.html에서 사은품 변경 시 자동 감지 → calc/티켓 재계산
window.addEventListener('storage', function(e) {
  if (e.key === GIFT_OVERRIDE_KEY) {
    applyGiftOverrides();
    calc();
  }
});

// 📊 calculator.html iframe 임베드 — 위쪽 "요금 계산기" 영역만 hide, 나머지 .section들만 표시
(function setupCalcDoc(){
  var iframe = document.getElementById('calc-doc-iframe');
  if (!iframe) return;
  function trimAndResize() {
    try {
      var doc = iframe.contentDocument;
      if (!doc) return;
      // .section 첫 번째 이전의 모든 형제(<h1>, .subtitle, .calc 등) 숨김
      var sections = doc.querySelectorAll('.section');
      if (sections.length) {
        var first = sections[0];
        var parent = first.parentNode;
        var node = parent.firstElementChild;
        while (node && node !== first) {
          var nextNode = node.nextElementSibling;
          node.style.display = 'none';
          node = nextNode;
        }
      }
      // body padding 제거
      if (doc.body) { doc.body.style.paddingTop = '0'; doc.body.style.marginTop = '0'; }
      // 높이 자동 조정
      var h = doc.documentElement.scrollHeight;
      iframe.style.height = (h + 24) + 'px';
    } catch(e) { console.warn('calc-doc embed:', e); }
  }
  iframe.addEventListener('load', function(){
    trimAndResize();
    setTimeout(trimAndResize, 250);
    setTimeout(trimAndResize, 1000);
  });
  window.addEventListener('resize', function(){ setTimeout(trimAndResize, 100); });
})();
</script>
