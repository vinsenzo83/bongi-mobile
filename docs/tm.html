<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📞 상담사 도구 — 봉이모바일</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#0e1320;font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:280px 1fr 380px;min-height:100vh}
/* 좌측 */
.left{background:#fff;border-right:2px solid #e5e7eb;padding:16px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.left h2{font-size:15px;font-weight:900;margin-bottom:10px;color:#1a2744}
.left .ti{width:100%;padding:9px 11px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:7px;font-weight:500;color:#1a1a1a}
.left .ti:focus{outline:none;border-color:#2563eb}
.left textarea.ti{min-height:60px;resize:vertical;line-height:1.4}
.left .lab{font-size:11px;color:#6b7280;font-weight:700;margin:8px 0 3px}
.tm-script{background:#f8f9fc;border:1px solid #e5e7eb;border-radius:8px;padding:9px 11px;font-size:11.5px;line-height:1.5;color:#1a2744;margin-bottom:7px}
.tm-script .ttl{font-weight:900;color:#2563eb;margin-bottom:3px}
/* 중앙 (v1 iframe) */
.center{position:relative;background:#0a0f1a}
.center iframe{width:100%;height:100vh;border:0;display:block}
.center-loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#60a5fa;font-size:14px}
/* 우측 */
.right{background:#1a2744;color:#fff;padding:16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;border-left:2px solid #0a0f1a}
.right h2{font-size:13px;font-weight:700;color:#a5c4f2;margin-bottom:8px;letter-spacing:0.5px}
.right .quote{flex:1;overflow-y:auto;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:14px;margin-bottom:10px;font-size:12.5px;line-height:1.6}
.right .quote .calc-line{display:flex;justify-content:space-between;padding:4px 0}
.right .quote .calc-line .l{color:#d4e6f7;flex:1}
.right .quote .calc-line .v{color:#fff;font-weight:700}
.right .quote .calc-line.discount .v{color:#86efac}
.right .quote .calc-line.sub{font-size:11px;color:#a5c4f2}
.right .quote .calc-line.sub .l{color:#a5c4f2}
.right .quote .calc-line.total{border-top:1.5px solid rgba(255,255,255,0.2);margin-top:6px;padding-top:8px;font-size:14px;font-weight:900}
.right .quote .calc-line.total .v{color:#4ade80;font-size:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.actions .b{padding:11px 0;border-radius:8px;font-size:12.5px;font-weight:900;cursor:pointer;border:none}
.actions .b.cp{background:#fff;color:#1a2744}
.actions .b.pr{background:rgba(255,255,255,0.1);color:#d4e6f7;border:1px solid rgba(255,255,255,0.2)}
.actions .b.sd{background:#10b981;color:#fff;grid-column:span 2}
@media (max-width:1280px){.app{grid-template-columns:240px 1fr 320px}}
</style>
</head>
<body>
<div class="app">

<!-- 좌측: 고객정보 + 스크립트 -->
<aside class="left">
  <h2>👤 고객 정보</h2>
  <div class="lab">이름 / 휴대폰</div>
  <input type="text" class="ti" id="tm-cn" placeholder="홍길동">
  <input type="text" class="ti" id="tm-cp" placeholder="010-0000-0000">
  <div class="lab">상담사</div>
  <input type="text" class="ti" id="tm-ca" placeholder="상담사">

  <h2 style="margin-top:12px;border-top:1px solid #e5e7eb;padding-top:10px">📜 상담 스크립트</h2>
  <div class="tm-script"><div class="ttl">① 인사</div>안녕하세요 봉이모바일 [상담사]입니다.<br>인터넷+TV 상담 도와드릴게요.</div>
  <div class="tm-script"><div class="ttl">② 정보 확인</div>현재 어느 통신사 사용 중이세요?<br>가족분 휴대폰 결합 가능?<br>인터넷 가입 몇 년 되셨나요?</div>
  <div class="tm-script"><div class="ttl">③ 견적 안내</div>[통신사] [속도] + [TV] 결합으로 월 [금액]원,<br>현금 페이백 [만원]만원 별도.</div>
  <div class="tm-script"><div class="ttl">④ 마무리</div>이 상품으로 진행해 드릴까요?<br>설치 주중/주말 가능 (주말 +25%).</div>

  <div class="lab">📝 메모</div>
  <textarea class="ti" id="tm-cm" placeholder="상담 메모..."></textarea>
</aside>

<!-- 중앙: v1 calculator iframe (그대로) -->
<main class="center">
  <div class="center-loading">로딩 중...</div>
  <iframe id="v1" src="calculator.html"></iframe>
</main>

<!-- 우측: 실시간 견적 (v1 c-result 미러) -->
<aside class="right">
  <h2>💰 실시간 견적</h2>
  <div class="quote" id="quote"><div style="opacity:0.5">통신사·옵션 선택하면 자동 계산</div></div>
  <div class="actions">
    <button class="b cp" onclick="tmCopy()">📋 복사</button>
    <button class="b pr" onclick="window.print()">🖨️ 인쇄</button>
    <button class="b sd">📞 견적 발송</button>
  </div>
</aside>

</div>

<script>
(function(){
  var f = document.getElementById('v1');
  var quote = document.getElementById('quote');
  var loading = document.querySelector('.center-loading');

  function mirror(){
    try {
      var doc = f.contentWindow && f.contentWindow.document;
      if (!doc) return;
      var src = doc.getElementById('c-result');
      if (src && src.innerHTML.trim()) {
        quote.innerHTML = src.innerHTML;
      }
    } catch(e){}
  }

  // iframe 로드 완료 후 미러링 시작
  f.addEventListener('load', function(){
    if (loading) loading.style.display = 'none';
    mirror();
    // MutationObserver로 c-result 변경 감지
    try {
      var doc = f.contentWindow.document;
      var src = doc.getElementById('c-result');
      if (src && window.MutationObserver) {
        var mo = new MutationObserver(mirror);
        mo.observe(src, { childList:true, subtree:true, characterData:true });
      }
    } catch(e){}
    // 보조: 모든 폼 입력 변경 시 미러
    try {
      var doc = f.contentWindow.document;
      ['change','click','input'].forEach(function(ev){
        doc.addEventListener(ev, function(){ setTimeout(mirror, 50); });
      });
    } catch(e){}
    // 보조 폴링 (5초간)
    var n=0;
    var iv=setInterval(function(){ mirror(); if(++n>20) clearInterval(iv); }, 250);
  });
})();

function tmCopy(){
  var n=document.getElementById('tm-cn').value||'';
  var p=document.getElementById('tm-cp').value||'';
  var memo=document.getElementById('tm-cm').value||'';
  var q=document.getElementById('quote').textContent.replace(/\s+/g,' ').trim();
  var txt='【봉이모바일 견적】\n고객: '+n+' '+p+'\n\n'+q+(memo?'\n\n메모: '+memo:'');
  navigator.clipboard.writeText(txt).then(function(){alert('복사됨')}).catch(function(){alert(txt)});
}
</script>
</body>
</html>
