<li>유형 = "유선" → 휴대폰 약정유형 표기와 혼동</li>
<li>단말 prefix "인" → '인'으로 시작하는 다른 단말 광범위 매칭</li>
<li>결제유형 컬럼(공/선·현/할) = "유선" → 휴대폰 약정 표기</li>
<li>메모(기타·개통실 메모·비고) "유선"·"결합" 키워드 → 다른 사람 인터넷에 본인 결합되는 케이스 다수 (예: "개통후결합-박종국" = 박종국 인터넷에 본인 휴대폰만 합류)</li>
</ul>
<b>한계</b>: 단말 정확 매칭만으로는 "다른 사람 인터넷에 결합된 휴대폰 가입자"를 자동 식별 못함. TM 상담 시 상담사가 메모를 보고 판단.</div>

<h3>2. 등급 매핑 룰 (calcGrade)</h3>
<table>
<tr><th>등급</th><th>조건</th><th>설명</th></tr>
<tr><td><b style="color:#fbbf24">S</b></td><td>tier=1 AND category="이동"</td><td>인터넷 없음 + 이동 — 최우선 영업</td></tr>
<tr><td><b style="color:#22c55e">A</b></td><td>tier=1 AND category="신규"</td><td>인터넷 없음 + 신규 — 결합 자유</td></tr>
<tr><td><b style="color:#3b82f6">B</b></td><td>tier=1 AND category="기변"</td><td>인터넷 없음 + 기변 — 결합 협의 필요</td></tr>
<tr><td><b style="color:#a855f7">R</b></td><td>tier=2 (인터넷·TV 회선 포함)</td><td>인터넷 보유 → 렌탈 가전 2순위 영업</td></tr>
<tr><td><b style="color:#64748b">C</b></td><td>default (위 미매칭)</td><td>기타·미분류</td></tr>
</table>
<div class="warn"><b>⚠️ 등급 = 영업 우선순위만</b>. 인센티브 Grade(G1/G2/G3)·상품 Tier(S/A/B/C)와 <b>완전히 별개</b>. 같은 글자 쓰지만 의미 다름:
<ul><li><b>quality_grade</b> (콜 DB): 콜 분배 우선순위</li><li><b>인센티브 Grade</b> (정산): 월간 P 누적 등급 (1/2/3)</li><li><b>상품 Tier</b> (상품 관리): 마진 분류 (S/A/B/C)</li></ul></div>

<h3>3. priority_score 계산식</h3>
<pre><code>priority_score = basePriority(category) + ageBonus(age)</code></pre>
<table>
<tr><th>category</th><th>basePriority</th></tr>
<tr><td>이동</td><td>100</td></tr>
<tr><td>신규</td><td>80</td></tr>
<tr><td>기변</td><td>60</td></tr>
<tr><td>렌탈권유</td><td>50</td></tr>
<tr><td>기타</td><td>10 (또는 0)</td></tr>
</table>
<p><b>ageBonus는 현재 비활성 ([] 빈 배열)</b> — basePriority만으로 분배. 향후 룰 카드에서 다시 활성화 가능.</p>
<p>분배 정렬: <code>priority_score DESC NULLS LAST → imported_at ASC</code>. → 인터넷·TV 권유(S/A/B) 항상 렌탈(R)보다 먼저 노출.</p>

<h3>4. 중복 방지 4중 (Dedup)</h3>
<div class="step"><span class="num">1</span><b>이름+생년월일 통합</b> — 같은 사람 여러 회선은 1건으로 합쳐서 그룹 내 우선순위 가장 높은 회선이 대표.</div>
<div class="step"><span class="num">2</span><b>전화번호 충돌 해제</b> — 같은 phone에 다른 이름이 있으면 priority_score 높은 1건만 <code>available</code>. 나머지는 <code>call_status='on_hold'</code> + reason="phone 충돌 — [우선 고객명]에 우선 배정".</div>
<div class="step"><span class="num">3</span><b>DB UNIQUE 제약</b> — <code>UNIQUE(db_source_id, phone)</code>. 같은 DB 출처에 동일 phone 두 번 INSERT 시 PostgreSQL 23505 → duplicate count 증가, row skip.</div>
<div class="step"><span class="num">4</span><b>마감원장 내부 dups</b> — 한 batch 안에서 동일 (이름+생년월일) 또는 동일 phone은 step 1·2에서 제거됨.</div>

    });
  }
  if (!html) html = '<div class="search-no-result">결과 없음</div>';
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      navigate(a.dataset.id);
    });
  });
  updateActiveLink();
}

function filterMatch(s) {
  // role 필터
  if (currentRole !== 'all' && !s.roles.includes('all') && !s.roles.includes(currentRole)) return false;
  // 검색
  if (searchTerm) {
    const haystack = (s.title + ' ' + s.html.replace(/<[^>]+>/g, ' ')).toLowerCase();
    if (!haystack.includes(searchTerm.toLowerCase())) return false;
  }
  return true;
}

function renderMain() {
  const main = document.getElementById('main');
  const matches = SECTIONS.filter(filterMatch);
  if (!matches.length) {
    main.innerHTML = '<div class="search-no-result">결과 없음 — 검색어를 바꾸거나 역할 필터를 조정하세요.</div>';
    return;
  }
  // 모든 섹션 렌더 (active만 표시)
  main.innerHTML = matches.map(s =>
    `<a class="anchor" id="${s.id}"></a><div class="section ${s.id === currentSection ? 'active' : ''}" data-id="${s.id}">${s.html}</div>`
  ).join('');
  // 현재 active가 필터에서 빠지면 첫 번째로
  if (!matches.find(s => s.id === currentSection)) {
    currentSection = matches[0].id;
    main.querySelectorAll('.section').forEach(d => d.classList.toggle('active', d.dataset.id === currentSection));
  }
}

function updateActiveLink() {
  document.querySelectorAll('#toc a').forEach(a => {
    a.classList.toggle('active', a.dataset.id === currentSection);
  });
}

function navigate(id) {
  currentSection = id;
  document.querySelectorAll('#main .section').forEach(d => {
    d.classList.toggle('active', d.dataset.id === id);
  });
  updateActiveLink();
  document.getElementById('main').scrollTo(0, 0);
  history.replaceState({}, '', '#' + id);
}

// 역할 전환
document.querySelectorAll('.role-pick button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.role-pick button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRole = btn.dataset.role;
    renderTOC();
    renderMain();
  });
});

// 검색
document.getElementById('q').addEventListener('input', e => {
  searchTerm = e.target.value.trim();
  renderTOC();
  renderMain();
});

// 본인 role 자동 감지 → 기본 필터
async function detectRole() {
  try {
    const tk = localStorage.getItem('incentive-auth-token-v1');
    if (!tk) return;
    const r = await fetch('/api/incentive/agents/me', { headers: { Authorization: 'Bearer ' + tk }});
    if (!r.ok) return;
    const d = await r.json();
    const role = d.agent?.role;
    if (role) {
      const btn = document.querySelector(`.role-pick button[data-role="${role}"]`);
      if (btn) btn.click();
    }
  } catch {}
}

// 초기 — URL hash 또는 첫 섹션
const hash = location.hash.slice(1);
if (hash && SECTIONS.find(s => s.id === hash)) currentSection = hash;
renderTOC();
renderMain();
detectRole();
</script>
