<div class="step"><span class="num">7</span><b>인터넷·TV 회선 식별</b> — <b>단말 정확 매칭</b>만: <code>internet_models</code>의 값(기본 <b>"인+TV" / "인터넷"</b>)과 정확히 같으면 그 사람 tier=2. <br>※ 메모·결제유형·prefix 매칭은 false positive 위험이 커서 사용하지 않음 (예: "공/선=유선"은 휴대폰 약정유형이라 무관).</div>

<div class="warn"><b>⚠️ R 등급 분류 정책 (2026-05-12 확정)</b><br>R = 인터넷 보유자. 분류 기준은 <b>마감원장 단말 = "인터넷" 또는 "인+TV"</b> 정확히 둘 중 하나일 때만.<br>
<b>의도적으로 사용하지 않는 매칭</b> (false positive 위험):
<ul style="margin:6px 0 0 18px;font-size:11.5px">
<li>유형 = "유선" → 휴대폰 약정유형 표기와 혼동</li>

<h3>4. 중복 방지 5중 (Dedup) — 2026-05-12 강화</h3>
<div class="step"><span class="num">1</span><b>이름+생년월일 통합</b> — 같은 사람 여러 회선은 1건으로 합쳐서 그룹 내 우선순위 가장 높은 회선이 대표.</div>
<div class="step"><span class="num">2</span><b>전화번호 충돌 해제</b> — 같은 phone에 다른 이름이 있으면 priority_score 높은 1건만 <code>available</code>. 나머지는 <code>call_status='on_hold'</code> + reason="phone 충돌 — [우선 고객명]에 우선 배정".</div>
<div class="step"><span class="num">3</span><b>출처 무관 phone 사전 검사 (cross-source dedup)</b> — import 전에 phone IN 조회로 <b>다른 출처에 이미 있는 phone</b> 파악. 신규로 분류된 row만 INSERT 시도. → 같은 사람이 출처만 바꿔서 두 번 들어오는 일 차단.</div>
<div class="step"><span class="num">4</span><b>DB UNIQUE 제약 + UPSERT</b> — <code>UNIQUE(db_source_id, phone)</code> + <code>upsert(onConflict, ignoreDuplicates: true)</code>로 같은 출처 안 동일 phone은 silently skip.</div>
<div class="step"><span class="num">5</span><b>마감원장 내부 dups</b> — 한 batch 안에서 동일 (이름+생년월일) 또는 동일 phone은 step 1·2에서 제거됨.</div>
<div class="tip"><b>📌 운영 팁</b> — 같은 마감원장을 다른 출처(예: 일타폰DB)로 재import해도 step 3에서 모두 dup으로 잡힘. customer 추가 0건. → 출처를 바꿔도 같은 사람을 두 번 contact할 위험 차단.</div>

// ═══════════════════════════════════════════════════════════════
// 렌더링
// ═══════════════════════════════════════════════════════════════
let currentRole = 'all';
let currentSection = SECTIONS[0].id;
let searchTerm = '';

function renderTOC() {
  const groups = {};
  SECTIONS.forEach(s => {
    if (!groups[s.group]) groups[s.group] = [];
    groups[s.group].push(s);
  });
  const toc = document.getElementById('toc');
  let html = '';
  for (const [group, items] of Object.entries(groups)) {
    const visible = items.filter(s => filterMatch(s));
    if (!visible.length) continue;
    html += `<div class="group">${group}</div>`;
    visible.forEach(s => {
      html += `<a href="#${s.id}" data-id="${s.id}">${s.title}</a>`;
    });
  }
  if (!html) html = '<div class="search-no-result">결과 없음</div>';
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      navigate(a.dataset.id);
    });
  });
  updateActiveLink();
}

function filterMatch(s) {
  // role 필터
  if (currentRole !== 'all' && !s.roles.includes('all') && !s.roles.includes(currentRole)) return false;
  // 검색
  if (searchTerm) {
    const haystack = (s.title + ' ' + s.html.replace(/<[^>]+>/g, ' ')).toLowerCase();
    if (!haystack.includes(searchTerm.toLowerCase())) return false;
  }
  return true;
}

function renderMain() {
  const main = document.getElementById('main');
  const matches = SECTIONS.filter(filterMatch);
  if (!matches.length) {
    main.innerHTML = '<div class="search-no-result">결과 없음 — 검색어를 바꾸거나 역할 필터를 조정하세요.</div>';
    return;
  }
  // 모든 섹션 렌더 (active만 표시)
  main.innerHTML = matches.map(s =>
    `<a class="anchor" id="${s.id}"></a><div class="section ${s.id === currentSection ? 'active' : ''}" data-id="${s.id}">${s.html}</div>`
  ).join('');
  // 현재 active가 필터에서 빠지면 첫 번째로
  if (!matches.find(s => s.id === currentSection)) {
    currentSection = matches[0].id;
    main.querySelectorAll('.section').forEach(d => d.classList.toggle('active', d.dataset.id === currentSection));
  }
}

function updateActiveLink() {
  document.querySelectorAll('#toc a').forEach(a => {
    a.classList.toggle('active', a.dataset.id === currentSection);
  });
}

function navigate(id) {
  currentSection = id;
  document.querySelectorAll('#main .section').forEach(d => {
    d.classList.toggle('active', d.dataset.id === id);
  });
  updateActiveLink();
  document.getElementById('main').scrollTo(0, 0);
  history.replaceState({}, '', '#' + id);
}

// 역할 전환
document.querySelectorAll('.role-pick button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.role-pick button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRole = btn.dataset.role;
    renderTOC();
    renderMain();
  });
});

// 검색
document.getElementById('q').addEventListener('input', e => {
  searchTerm = e.target.value.trim();
  renderTOC();
  renderMain();
});

// 본인 role 자동 감지 → 기본 필터
async function detectRole() {
  try {
    const tk = localStorage.getItem('incentive-auth-token-v1');
    if (!tk) return;
    const r = await fetch('/api/incentive/agents/me', { headers: { Authorization: 'Bearer ' + tk }});
    if (!r.ok) return;
    const d = await r.json();
    const role = d.agent?.role;
    if (role) {
      const btn = document.querySelector(`.role-pick button[data-role="${role}"]`);
      if (btn) btn.click();
    }
  } catch {}
}

// 초기 — URL hash 또는 첫 섹션
const hash = location.hash.slice(1);
if (hash && SECTIONS.find(s => s.id === hash)) currentSection = hash;
renderTOC();
renderMain();
detectRole();
</script>
