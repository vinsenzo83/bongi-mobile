<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 월간 목표 vs 실적</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family:'Pretendard Variable',sans-serif; background:#0f172a; color:#e2e8f0; padding:18px 18px 80px; min-height:100vh; }
.wrap { max-width:1300px; margin:0 auto; }
header { display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px solid #334155; margin-bottom:14px; }
h1 { font-size:20px; }
.toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.toolbar input, .toolbar select { background:#0f172a; border:1px solid #475569; color:#e2e8f0; padding:8px 12px; border-radius:6px; font-size:12px; font-family:inherit; }
.toolbar button { background:#3b82f6; color:#fff; border:none; padding:8px 16px; border-radius:6px; font-weight:700; cursor:pointer; font-size:12px; }
.toolbar button.success { background:#16a34a; }
.toolbar button.muted { background:#475569; }

.section { background:linear-gradient(135deg,#1e293b,#0f172a); border:1px solid #475569; border-radius:10px; padding:14px 18px; margin-bottom:14px; }

.goals-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:12px; }
.goal-card { background:linear-gradient(135deg,#1e3a8a,#0f172a); border:1.5px solid #3b82f6; border-radius:12px; padding:14px 16px; }
.goal-header { display:flex; justify-content:space-between; align-items:start; margin-bottom:10px; }
.goal-name { font-size:14px; font-weight:800; color:#bfdbfe; }
.goal-center { font-size:10.5px; color:#94a3b8; margin-top:2px; }
.goal-actions { display:flex; gap:4px; }
.goal-actions button { background:#475569; color:#fff; border:none; padding:4px 10px; border-radius:4px; font-size:10px; font-weight:700; cursor:pointer; }
.goal-actions button.danger { background:#dc2626; }

.metric { margin-bottom:10px; }
.metric-header { display:flex; justify-content:space-between; align-items:baseline; font-size:11px; color:#cbd5e1; margin-bottom:4px; }
.metric-header b { font-weight:800; }
.bar { height:9px; background:rgba(0,0,0,0.4); border-radius:6px; overflow:hidden; position:relative; }
.bar .fill { height:100%; border-radius:6px; transition:width 0.5s ease; }
.bar .fill.green { background:linear-gradient(90deg,#22c55e,#86efac); }
.bar .fill.yellow { background:linear-gradient(90deg,#fbbf24,#fde047); }
.bar .fill.red { background:linear-gradient(90deg,#dc2626,#f87171); }
.metric-pct { font-size:10.5px; font-weight:900; }

.empty { text-align:center; padding:40px 20px; color:#64748b; }

table { width:100%; border-collapse:collapse; font-size:11.5px; }
th { background:#1e3a8a; color:#bfdbfe; padding:10px 12px; text-align:left; font-weight:800; font-size:11px; }
td { padding:10px 12px; border-bottom:1px solid #1e293b; }

.modal-bg { position:fixed; inset:0; background:rgba(15,23,42,0.7); z-index:99998; display:none; justify-content:center; align-items:center; }
.modal-bg.show { display:flex; }
.modal-box { background:#1e293b; border:1.5px solid #475569; border-radius:14px; padding:22px 26px; width:480px; max-width:92vw; }
.modal-box h3 { font-size:15px; font-weight:800; margin-bottom:14px; color:#22c55e; }
.modal-box label { font-size:12px; color:#cbd5e1; display:block; margin-bottom:10px; }
.modal-box input, .modal-box select, .modal-box textarea { width:100%; background:#0f172a; border:1px solid #475569; color:#e2e8f0; padding:8px 10px; border-radius:6px; font-size:13px; margin-top:4px; font-family:inherit; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }

#toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#16a34a; color:#fff; padding:14px 24px; border-radius:10px; font-weight:800; z-index:99999; opacity:0; transition:opacity 0.2s; }
#toast.show { opacity:1; }
</style>
<script>
(function(){
  if (window !== window.parent) {
    document.documentElement.classList.add('embedded-mode');
    var s = document.createElement('style');
    s.textContent = '.embedded-mode header { display:none !important; } body { padding-top:14px !important; }';
    document.head.appendChild(s);
  }
})();
</script>
<script src="/docs/_security.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎯 월간 목표 vs 실적</h1>
    <div id="user-info" style="font-size:12px;color:#cbd5e1"><span id="user-name">-</span></div>
  </header>

  <div id="main" style="display:none">
    <div class="toolbar">
      <label style="font-size:11px;color:#94a3b8">월:
        <input type="month" id="f-ym" style="margin-left:4px">
      </label>
      <button class="muted" onclick="loadGoals()">🔄 새로고침</button>
      <button class="success" id="btn-add" onclick="openAddModal()" style="display:none">➕ 목표 설정</button>
      <span style="margin-left:auto;font-size:11px;color:#64748b" id="last-update">-</span>
    </div>

    <div class="section">
      <h2 style="font-size:13px;color:#fbbf24;font-weight:800;margin-bottom:12px">📊 목표 진척률 — <span id="ym-label">-</span></h2>
      <div class="goals-grid" id="goals-list">
        <div class="empty">로딩 중...</div>
      </div>
    </div>
  </div>
</div>

<!-- 신규/편집 모달 -->
<div id="goal-modal" class="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <h3 id="modal-title">🎯 목표 설정</h3>
    <label>상담사
      <select id="m-agent"></select>
    </label>
    <label>월 (YYYY-MM)
      <input type="month" id="m-ym">
    </label>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <label>📞 콜 시도 목표
        <input type="number" id="m-calls" min="0" step="10" placeholder="예: 500">
      </label>
      <label>🎉 전환 목표
        <input type="number" id="m-conversions" min="0" step="1" placeholder="예: 20">
      </label>
      <label>🏆 P 목표
        <input type="number" id="m-points" min="0" step="0.5" placeholder="예: 30">
      </label>
    </div>
    <label>메모 (선택)
      <textarea id="m-notes" rows="2" placeholder="동기·전략 메모"></textarea>
    </label>
    <div class="modal-actions">
      <button onclick="closeModal()" style="background:#475569;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer">취소</button>
      <button onclick="submitGoal()" style="background:#22c55e;color:#fff;border:none;padding:8px 18px;border-radius:6px;font-weight:800;cursor:pointer">💾 저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const TK_KEY = 'incentive-auth-token-v1';
const tk = () => localStorage.getItem(TK_KEY);
async function fetchAuth(url, opts = {}) {
  return fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + tk() }});
}
const esc = (s) => String(s ?? '').replace(/[<>&"']/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[ch]));
function showToast(m, ok=true) { const t=document.getElementById('toast'); t.style.background=ok?'#16a34a':'#dc2626'; t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); }
let _agents = [];

async function init() {
  if (!tk()) { document.body.innerHTML = '<div class="empty">로그인 필요</div>'; return; }
  try {
    const r = await fetchAuth('/api/incentive/agents/me');
    if (!r.ok) { document.body.innerHTML = '<div class="empty">인증 실패</div>'; return; }
    const me = (await r.json()).agent;
    window._myAgent = me;
    document.getElementById('user-name').textContent = me.name + ' (' + me.role + ')';
    document.getElementById('main').style.display = '';
    document.getElementById('f-ym').value = new Date().toISOString().slice(0, 7);
    if (me.role === 'admin' || me.role === 'manager') {
      document.getElementById('btn-add').style.display = '';
      await loadAgents();
    }
    document.getElementById('f-ym').addEventListener('change', loadGoals);
    loadGoals();
  } catch (e) { document.body.innerHTML = '<div class="empty">오류: ' + e.message + '</div>'; }
}

async function loadAgents() {
  const r = await fetchAuth('/api/incentive/agents');
  if (!r.ok) return;
  const d = await r.json();
  _agents = (d.agents || []).filter(a => a.active);
  if (window._myAgent.role === 'manager') _agents = _agents.filter(a => a.center === window._myAgent.center);
  const sel = document.getElementById('m-agent');
  sel.innerHTML = _agents.map(a => `<option value="${a.id}">${esc(a.name)} (${esc(a.role)} / ${esc(a.center)||'-'})</option>`).join('');
}

async function loadGoals() {
  const ym = document.getElementById('f-ym').value || new Date().toISOString().slice(0, 7);
  document.getElementById('ym-label').textContent = ym;
  const r = await fetchAuth('/api/incentive/goals?ym=' + ym);
  const wrap = document.getElementById('goals-list');
  if (!r.ok) { wrap.innerHTML = `<div class="empty" style="color:#f87171">조회 실패: ${r.status}</div>`; return; }
  const d = await r.json();
  document.getElementById('last-update').textContent = '갱신 ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if (!d.goals?.length) {
    wrap.innerHTML = `<div class="empty">${ym} 목표 없음 — ${(window._myAgent.role==='admin'||window._myAgent.role==='manager')?'우상단 [➕ 목표 설정] 클릭':'매니저에게 목표 설정 요청'}</div>`;
    return;
  }

  const me = window._myAgent;
  const canEdit = me.role === 'admin' || me.role === 'manager';

  wrap.innerHTML = d.goals.sort((a,b) => (b.progress.points || 0) - (a.progress.points || 0)).map(g => {
    const a = g.agent || {};
    const renderBar = (label, target, actual, pct) => {
      if (target <= 0) return `<div class="metric"><div class="metric-header"><span>${label}</span><span style="color:#64748b">— 미설정</span></div></div>`;
      const cls = pct >= 100 ? 'green' : pct >= 70 ? 'yellow' : 'red';
      const display = Math.min(pct, 100);
      return `<div class="metric">
        <div class="metric-header">
          <span>${label} <b>${(actual||0).toLocaleString()}</b> / ${target.toLocaleString()}</span>
          <span class="metric-pct" style="color:${pct>=100?'#86efac':pct>=70?'#fde047':'#fca5a5'}">${pct}%</span>
        </div>
        <div class="bar"><div class="fill ${cls}" style="width:${display}%"></div></div>
      </div>`;
    };
    return `<div class="goal-card">
      <div class="goal-header">
        <div>
          <div class="goal-name">${esc(a.name) || '-'} <span style="font-size:10px;color:#94a3b8;font-weight:400">(${esc(a.role)||'-'})</span></div>
          <div class="goal-center">🏢 ${esc(a.center) || '-'}</div>
        </div>
        ${canEdit ? `<div class="goal-actions">
          <button onclick="openEditModal(${g.id})">편집</button>
          <button class="danger" onclick="deleteGoal(${g.id})">삭제</button>
        </div>` : ''}
      </div>
      ${renderBar('📞 콜 시도', g.target_calls, g.actual.calls, g.progress.calls)}
      ${renderBar('🎉 전환', g.target_conversions, g.actual.conversions, g.progress.conversions)}
      ${renderBar('🏆 P', g.target_points, g.actual.points.toFixed(1), g.progress.points)}
      ${g.notes ? `<div style="font-size:10.5px;color:#94a3b8;margin-top:8px;font-style:italic">💬 ${esc(g.notes)}</div>` : ''}
    </div>`;
  }).join('');
  // 캐시 (편집용)
  window._goalsCache = d.goals;
}

function openAddModal() {
  document.getElementById('modal-title').textContent = '🎯 목표 설정 (신규)';
  document.getElementById('m-ym').value = document.getElementById('f-ym').value || new Date().toISOString().slice(0, 7);
  document.getElementById('m-calls').value = '';
  document.getElementById('m-conversions').value = '';
  document.getElementById('m-points').value = '';
  document.getElementById('m-notes').value = '';
  document.getElementById('m-agent').disabled = false;
  if (_agents.length) document.getElementById('m-agent').value = _agents[0].id;
  document.getElementById('goal-modal').classList.add('show');
}

function openEditModal(id) {
  const g = (window._goalsCache || []).find(x => x.id === id);
  if (!g) return;
  document.getElementById('modal-title').textContent = '✏️ 목표 편집';
  document.getElementById('m-ym').value = g.ym;
  document.getElementById('m-calls').value = g.target_calls || '';
  document.getElementById('m-conversions').value = g.target_conversions || '';
  document.getElementById('m-points').value = g.target_points || '';
  document.getElementById('m-notes').value = g.notes || '';
  document.getElementById('m-agent').value = g.agent_id;
  document.getElementById('m-agent').disabled = true;
  document.getElementById('goal-modal').classList.add('show');
}

function closeModal() { document.getElementById('goal-modal').classList.remove('show'); }

async function submitGoal() {
  const body = {
    agent_id: document.getElementById('m-agent').value,
    ym: document.getElementById('m-ym').value,
    target_calls: parseInt(document.getElementById('m-calls').value) || 0,
    target_conversions: parseInt(document.getElementById('m-conversions').value) || 0,
    target_points: parseFloat(document.getElementById('m-points').value) || 0,
    notes: document.getElementById('m-notes').value.trim(),
  };
  if (!body.agent_id || !body.ym) { showToast('상담사·월 필수', false); return; }
  const r = await fetchAuth('/api/incentive/goals', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  const d = await r.json();
  if (!r.ok) { showToast('❌ ' + (d.error || r.status), false); return; }
  closeModal();
  showToast('✅ 저장 완료');
  loadGoals();
}

async function deleteGoal(id) {
  if (!confirm('목표를 삭제하시겠습니까?')) return;
  const r = await fetchAuth('/api/incentive/goals/' + id, { method:'DELETE' });
  if (!r.ok) { const d = await r.json(); showToast('❌ ' + (d.error || r.status), false); return; }
  showToast('🗑 삭제됨');
  loadGoals();
}

init();
</script>
</body>
</html>
