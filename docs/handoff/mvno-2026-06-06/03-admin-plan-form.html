<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>③ 어드민 — 알뜰폰 요금제 등록</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 24px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; }
  .crumb { font-size: 11px; color: #64748b; margin-bottom: 4px; }
  h1 { font-size: 24px; font-weight: 900; color: #fbbf24; }
  .sub { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .top-actions { display: flex; gap: 8px; }
  .btn-import { background: linear-gradient(135deg, #06b6d4, #7c3aed); color: #fff; border: none; padding: 9px 13px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }

  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 22px; margin-bottom: 14px; }
  .section-title { font-size: 13px; font-weight: 800; color: #fbbf24; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 8px; }
  .num { background: #fbbf24; color: #0f172a; width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: #cbd5e1; margin-bottom: 5px; }
  .req { color: #ef4444; }
  .field input, .field select, .field textarea { width: 100%; background: #0f172a; border: 1px solid #475569; color: #e2e8f0; padding: 9px 11px; border-radius: 7px; font-size: 12.5px; font-family: inherit; }
  .field textarea { min-height: 60px; resize: vertical; }

  .chip-pick { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip-pick label { background: #0f172a; border: 1px solid #475569; padding: 6px 11px; border-radius: 999px; font-size: 11.5px; cursor: pointer; color: #cbd5e1; }
  .chip-pick input { display: none; }
  .chip-pick input:checked + span { color: #fbbf24; font-weight: 700; }

  .promo-list { display: flex; flex-direction: column; gap: 8px; }
  .promo-row { background: #0f172a; border: 1px solid #475569; border-left: 4px solid #ec4899; border-radius: 7px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; font-size: 11.5px; }
  .promo-row .type { background: #831843; color: #fbcfe8; padding: 2px 7px; border-radius: 4px; font-size: 9.5px; font-weight: 800; }
  .promo-row .title { flex: 1; font-weight: 700; }
  .add-btn { width: 100%; background: transparent; border: 2px dashed #475569; color: #94a3b8; padding: 10px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 700; font-family: inherit; }

  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .btn { padding: 11px 20px; border: none; border-radius: 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-cancel { background: transparent; color: #94a3b8; border: 1px solid #475569; }
  .btn-save { background: #fbbf24; color: #0f172a; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <div class="crumb">어드민 / 알뜰폰 / 요금제 / 신규</div>
      <h1>📱 요금제 등록</h1>
      <div class="sub">봉이 자체 알뜰폰 요금제를 등록합니다. AI 자동 채움 또는 엑셀 일괄 import.</div>
    </div>
    <div class="top-actions">
      <button class="btn-import">📤 엑셀 일괄 import</button>
    </div>
  </div>

  <!-- 1. 기본 -->
  <div class="card">
    <div class="section-title"><span class="num">1</span>기본 정보</div>
    <div class="grid2">
      <div class="field">
        <label>요금제 코드 <span class="req">*</span></label>
        <input value="BONGI-LTE-7GB-19900" placeholder="BONGI-XXX">
      </div>
      <div class="field">
        <label>요금제명 <span class="req">*</span></label>
        <input value="봉이 LTE 7GB+" placeholder="ex: 봉이 LTE 데이터 매니아">
      </div>
      <div class="field">
        <label>망 임대 사업자 <span class="req">*</span></label>
        <select>
          <option>KT</option><option>SKT</option><option>LGU+</option>
        </select>
      </div>
      <div class="field">
        <label>네트워크 <span class="req">*</span></label>
        <select>
          <option>5G</option><option selected>LTE</option><option>3G</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>한 줄 설명</label>
      <input value="첫 3개월 50% 할인 · 통화 무제한 · 데이터 7GB" placeholder="고객에게 표시되는 한 줄">
    </div>
  </div>

  <!-- 2. 요금 -->
  <div class="card">
    <div class="section-title"><span class="num">2</span>요금 · 약정</div>
    <div class="grid3">
      <div class="field">
        <label>정상 월정액 (원) <span class="req">*</span></label>
        <input type="number" value="19900">
      </div>
      <div class="field">
        <label>프로모션 월정액 (원)</label>
        <input type="number" value="9900">
      </div>
      <div class="field">
        <label>프로모션 기간 (개월)</label>
        <input type="number" value="3">
      </div>
      <div class="field">
        <label>약정 (개월)</label>
        <select><option>0 (약정없음)</option><option>12</option><option>24</option><option>36</option></select>
      </div>
      <div class="field">
        <label>가입비</label>
        <input type="number" value="0">
      </div>
      <div class="field">
        <label>유심비</label>
        <input type="number" value="7700">
      </div>
    </div>
  </div>

  <!-- 3. 제공량 -->
  <div class="card">
    <div class="section-title"><span class="num">3</span>제공량</div>
    <div class="grid3">
      <div class="field">
        <label>데이터 (GB · 무제한 비움)</label>
        <input type="number" value="7" placeholder="무제한이면 빈 칸">
      </div>
      <div class="field">
        <label>소진 후 속도 (kbps)</label>
        <input type="number" value="1000">
      </div>
      <div class="field">
        <label>음성 통화 (분 · 무제한 비움)</label>
        <input placeholder="무제한이면 빈 칸">
      </div>
      <div class="field">
        <label>문자 (건 · 무제한 비움)</label>
        <input placeholder="무제한이면 빈 칸">
      </div>
      <div class="field">
        <label>유심 타입</label>
        <select><option>both (nano+esim)</option><option>nano</option><option>esim</option></select>
      </div>
      <div class="field">
        <label>최저 가입 연령</label>
        <input type="number" value="19">
      </div>
    </div>
  </div>

  <!-- 4. 타겟 + 태그 -->
  <div class="card">
    <div class="section-title"><span class="num">4</span>타겟 · 강점</div>
    <div class="field">
      <label>타겟 세그먼트</label>
      <div class="chip-pick">
        <label><input type="checkbox" checked><span>전체</span></label>
        <label><input type="checkbox"><span>청년 (Youth)</span></label>
        <label><input type="checkbox"><span>시니어 (Senior)</span></label>
        <label><input type="checkbox"><span>가족 (Family)</span></label>
      </div>
    </div>
    <div class="field">
      <label>강점 태그 (chip · 쉼표 구분)</label>
      <input value="데이터7GB, 통화무제한, 약정없음, KT망그대로" placeholder="태그1, 태그2, ...">
    </div>
    <div class="field">
      <label>프로모션 태그 chip</label>
      <input value="첫3개월할인, 신규할인" placeholder="태그1, 태그2, ...">
    </div>
  </div>

  <!-- 5. 프로모션 -->
  <div class="card">
    <div class="section-title"><span class="num">5</span>프로모션 (별도 테이블)</div>
    <div class="promo-list">
      <div class="promo-row">
        <span class="type">🎁 DISCOUNT</span>
        <span class="title">첫 3개월 50% 할인</span>
        <span style="color:#94a3b8">−10,000원 × 3M</span>
        <span style="background:#064e3b;color:#6ee7b7;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700">활성</span>
        <button style="background:transparent;border:none;color:#fbbf24;cursor:pointer;font-size:11px">편집</button>
      </div>
      <div class="promo-row">
        <span class="type">🎁 USIM_FREE</span>
        <span class="title">신규 가입 유심비 면제</span>
        <span style="color:#94a3b8">7,700원 면제</span>
        <span style="background:#064e3b;color:#6ee7b7;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700">활성</span>
        <button style="background:transparent;border:none;color:#fbbf24;cursor:pointer;font-size:11px">편집</button>
      </div>
    </div>
    <button class="add-btn" style="margin-top:10px">+ 프로모션 추가</button>
  </div>

  <div class="actions">
    <button class="btn btn-cancel">취소</button>
    <button class="btn btn-save">저장하고 storefront에 노출</button>
  </div>

</div>
</body>
</html>
