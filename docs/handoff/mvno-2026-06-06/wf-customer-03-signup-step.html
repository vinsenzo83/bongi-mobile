<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>③ 유심 구매 (배송지·결제 · 아정당 패턴)</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',sans-serif;background:#f8f9ff;color:#1a1a1a;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e8e6f0;padding:18px 0}
.header-inner{max-width:1280px;margin:0 auto;padding:0 30px;display:flex;align-items:center;gap:40px}
.logo{font-size:22px;font-weight:900;color:#1d4ed8;background:#dbeafe;padding:7px 14px;border-radius:8px}
.menu{display:flex;gap:32px;flex:1}
.menu a{text-decoration:none;color:#4a4a4a;font-size:14.5px;font-weight:700}
.menu a.active{color:#1d4ed8}
.header-right{display:flex;gap:18px;font-size:13px;color:#4a4a4a}
.header-right a{color:#4a4a4a;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:40px 30px}
h1{font-size:24px;font-weight:900;margin-bottom:24px}
.layout{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:flex-start}
.main-card{background:#fff;border:1.5px solid #e8e6f0;border-radius:16px;padding:32px}
.section{margin-bottom:28px}
.section-title{font-size:18px;font-weight:900;margin-bottom:18px}
.field-row{margin-bottom:18px}
.field-row .lbl{font-size:13px;font-weight:700;color:#6a6a6a;margin-bottom:8px}
.field-row .req{color:#dc2626}
.method-box{padding:18px;background:#fff;border:2px solid #1d4ed8;border-radius:12px;text-align:center;font-size:15px;font-weight:800;color:#1d4ed8;cursor:pointer}
.inp{background:#fff;border:1.5px solid #e8e6f0;padding:13px 15px;border-radius:10px;font-size:13.5px;width:100%;font-family:inherit}
.inp::placeholder{color:#bcbcbc}
.inp:focus{border-color:#1d4ed8;outline:none}
.row-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-addr{display:grid;grid-template-columns:1fr auto;gap:10px}
.btn-search{background:#1a1a1a;color:#fff;border:none;padding:0 22px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.select-row{display:flex;align-items:center;gap:8px}
.select-inp{background:#fff;border:1.5px solid #e8e6f0;padding:13px 15px;border-radius:10px;font-size:13.5px;width:100%;font-family:inherit;color:#4a4a4a;appearance:none;cursor:pointer}

.aside{background:#fff;border:1.5px solid #e8e6f0;border-radius:16px;padding:24px;position:sticky;top:20px}
.aside h3{font-size:17px;font-weight:900;margin-bottom:18px}
.amount-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px dashed #e8e6f0;margin-bottom:14px}
.amount-row .lbl{font-size:13px;color:#4a4a4a;font-weight:700}
.amount-row .val{font-size:20px;font-weight:900;color:#1d4ed8}
.consent-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#4a4a4a;margin-bottom:18px}
.consent-row .ok{width:18px;height:18px;background:#1d4ed8;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:900}
.consent-row .view{margin-left:auto;color:#6a6a6a;text-decoration:underline;font-size:11px;cursor:pointer}
.cta-pay{background:#1d4ed8;color:#fff;border:none;padding:16px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;width:100%}
.float-chat{position:fixed;right:30px;bottom:30px;width:54px;height:54px;background:#1d4ed8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;color:#fff;box-shadow:0 4px 14px rgba(29,78,216,.3)}
</style></head><body>
<div class="header">
  <div class="header-inner">
    <div class="logo">📱 봉이</div>
    <div class="menu">
      <a>개통안내</a>
      <a>요금제</a>
      <a class="active">유심구매</a>
      <a>이벤트</a>
      <a>고객지원</a>
      <a>MY정보</a>
    </div>
    <div class="header-right">
      <a>🔎 실시간사용량조회</a>
      <a>👤 로그인</a>
    </div>
  </div>
</div>

<div class="wrap">
  <h1>유심 구매 · 배송지 정보</h1>

  <div class="layout">
    <div class="main-card">
      <div class="section">
        <div class="section-title">배송 방법</div>
        <div class="method-box">📦 택배 (1~2일 배송)</div>
      </div>

      <div class="section">
        <div class="section-title">수령인 정보</div>
        <div class="row-2col">
          <div class="field-row">
            <div class="lbl">이름 <span class="req">*</span></div>
            <input class="inp" placeholder="이름을 입력해주세요" value="박서윤">
          </div>
          <div class="field-row">
            <div class="lbl">휴대폰번호 <span class="req">*</span></div>
            <input class="inp" placeholder="휴대폰번호를 '-' 빼고 입력해주세요" value="01012341234">
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">배송지</div>
        <div class="field-row">
          <div class="row-addr">
            <input class="inp" placeholder="우편번호" value="61010">
            <button class="btn-search">주소 검색</button>
          </div>
        </div>
        <div class="field-row">
          <input class="inp" placeholder="주소" value="광주광역시 동구 충장로 1">
        </div>
        <div class="field-row">
          <input class="inp" placeholder="상세주소 입력" value="111호">
        </div>
      </div>

      <div class="section">
        <div class="section-title">배송요청사항 (선택)</div>
        <div class="select-row">
          <select class="select-inp">
            <option>배송 시 요청사항 선택하기</option>
            <option>문 앞에 놓아주세요</option>
            <option>경비실에 맡겨주세요</option>
            <option>택배함에 넣어주세요</option>
            <option>배송 전 연락주세요</option>
          </select>
        </div>
      </div>
    </div>

    <aside class="aside">
      <h3>결제 금액</h3>
      <div class="amount-row">
        <div class="lbl">총 결제 금액</div>
        <div class="val">0원</div>
      </div>
      <div class="consent-row">
        <span class="ok">✓</span>
        <span>개인정보 수집 동의</span>
        <span class="view">보기</span>
      </div>
      <button class="cta-pay">결제하기</button>
      <div style="font-size:10.5px;color:#8a8a8a;line-height:1.5;margin-top:14px;text-align:center">
        ℹ️ 유심 비용 무료 · 택배비 무료<br>
        ℹ️ 배송 1~2영업일 (광주·전남 익일)
      </div>
    </aside>
  </div>
</div>

<div class="float-chat">💬</div>
</body></html>
