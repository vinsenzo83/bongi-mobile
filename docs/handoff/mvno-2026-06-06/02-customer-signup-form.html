<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>② 봉이 알뜰폰 — 가입 신청</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', sans-serif; background: #f8fafc; color: #0f172a; min-height: 100vh; padding: 24px; }
  .wrap { max-width: 680px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 28px 32px; box-shadow: 0 4px 14px rgba(0,0,0,0.04); }
  h1 { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
  .progress { display: flex; gap: 6px; margin: 20px 0 24px; }
  .progress .step { flex: 1; height: 4px; background: #e2e8f0; border-radius: 2px; }
  .progress .step.done { background: #6366f1; }
  .progress .step.active { background: linear-gradient(90deg, #6366f1, #c7d2fe); }
  .step-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 8px; }
  h2 { font-size: 17px; font-weight: 800; margin-bottom: 14px; }

  /* Step 1 — 요금제 확인 */
  .plan-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .plan-card .carrier { background: #ddd6fe; color: #5b21b6; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; display: inline-block; margin-bottom: 6px; }
  .plan-card .name { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
  .plan-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .plan-row .k { color: #94a3b8; }
  .plan-row .v { font-weight: 700; }
  .promo-box { background: #fee2e2; border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 11.5px; color: #991b1b; }

  /* Step 2 — 가입 유형 */
  .chip-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .chip-lg { padding: 18px 12px; border: 2px solid #e2e8f0; border-radius: 12px; background: #fff; cursor: pointer; text-align: center; }
  .chip-lg.active { border-color: #6366f1; background: #eef2ff; }
  .chip-lg .ic { font-size: 22px; margin-bottom: 4px; }
  .chip-lg .lbl { font-size: 12.5px; font-weight: 700; }

  /* Step 3 — 가입자 정보 */
  .field { margin-bottom: 14px; }
  .field label { font-size: 11.5px; font-weight: 700; color: #475569; display: block; margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; font-family: inherit; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gender-chips { display: flex; gap: 6px; }
  .gender-chips .g { flex: 1; padding: 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; cursor: pointer; text-align: center; font-size: 12.5px; font-weight: 600; color: #475569; }
  .gender-chips .g.active { background: #eef2ff; border-color: #6366f1; color: #6366f1; font-weight: 800; }

  /* Step 4 — 약관 */
  .terms { display: flex; flex-direction: column; gap: 6px; }
  .term { display: flex; gap: 10px; align-items: center; padding: 11px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 12.5px; }
  .term input[type=checkbox] { width: 18px; height: 18px; }
  .term .req { color: #ef4444; font-weight: 700; margin-right: 4px; }
  .term .opt { color: #94a3b8; font-weight: 600; margin-right: 4px; }
  .term-detail { color: #6366f1; text-decoration: underline; font-size: 11px; cursor: pointer; margin-left: auto; }

  /* CTA */
  .actions { display: flex; gap: 8px; margin-top: 22px; }
  .btn { flex: 1; padding: 13px; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .btn-back { background: #f1f5f9; color: #64748b; }
  .btn-next { background: #6366f1; color: #fff; }
</style>
</head>
<body>
<div class="wrap">

  <h1>가입 신청</h1>
  <p style="font-size:12px;color:#64748b">봉이 알뜰폰 · 봉이 LTE 7GB+ (KT 망)</p>

  <div class="progress">
    <div class="step done"></div>
    <div class="step done"></div>
    <div class="step active"></div>
    <div class="step"></div>
  </div>

  <!-- Step 3 — 가입자 정보 (활성 step 예시) -->
  <div class="step-label">Step 3 / 4 — 가입자 정보</div>
  <h2>가입자 정보 입력</h2>

  <div class="field">
    <label>가입자 유형</label>
    <div class="chip-row" style="grid-template-columns: repeat(4, 1fr)">
      <div class="chip-lg active"><div class="lbl">개인</div></div>
      <div class="chip-lg"><div class="lbl">개인사업자</div></div>
      <div class="chip-lg"><div class="lbl">법인사업자</div></div>
      <div class="chip-lg"><div class="lbl">외국인</div></div>
    </div>
  </div>

  <div class="row2">
    <div class="field">
      <label>이름 *</label>
      <input placeholder="김봉이">
    </div>
    <div class="field">
      <label>생년월일 *</label>
      <input type="date" value="1990-01-01">
    </div>
  </div>

  <div class="field">
    <label>성별 *</label>
    <div class="gender-chips">
      <div class="g active">남성</div>
      <div class="g">여성</div>
    </div>
  </div>

  <div class="row2">
    <div class="field">
      <label>휴대폰 (상담용) *</label>
      <input placeholder="01012345678">
    </div>
    <div class="field">
      <label>이메일 *</label>
      <input type="email" placeholder="example@email.com">
    </div>
  </div>

  <div class="field">
    <label>주소 *</label>
    <div style="display:flex;gap:6px">
      <input placeholder="우편번호" style="flex:1">
      <button style="background:#f1f5f9;border:1px solid #cbd5e1;padding:0 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer">📍 검색</button>
    </div>
    <input placeholder="상세 주소" style="margin-top:6px">
  </div>

  <!-- Step 4 preview — 약관 (시각 예시) -->
  <div style="margin-top:30px;padding-top:20px;border-top:1px dashed #e2e8f0">
    <div class="step-label">Step 4 / 4 — 약관 동의 (preview)</div>
    <h2>약관 동의</h2>
    <div class="terms">
      <label class="term"><input type="checkbox" checked> <span class="req">필수</span> 봉이 알뜰폰 이용 약관 <span class="term-detail">전문 보기 ▶</span></label>
      <label class="term"><input type="checkbox" checked> <span class="req">필수</span> 개인정보 수집·이용 동의 <span class="term-detail">전문 보기 ▶</span></label>
      <label class="term"><input type="checkbox" checked> <span class="req">필수</span> 제3자 정보 제공 동의 <span class="term-detail">전문 보기 ▶</span></label>
      <label class="term"><input type="checkbox" checked> <span class="req">필수</span> KT 망 임대 약관 <span class="term-detail">전문 보기 ▶</span></label>
      <label class="term"><input type="checkbox"> <span class="opt">선택</span> 마케팅·광고 수신 동의 <span class="term-detail">전문 보기 ▶</span></label>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-back">← 이전</button>
    <button class="btn btn-next">신청 제출 →</button>
  </div>
</div>
</body>
</html>
