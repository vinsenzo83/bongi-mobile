<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>견적 빠른 입력</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="/docs/_security.js" defer></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Pretendard Variable',-apple-system,sans-serif; background:#0f172a; color:#e2e8f0; padding:18px; }
h1 { font-size:18px; color:#f8fafc; margin-bottom:14px; letter-spacing:-0.02em; display:flex; align-items:center; gap:8px; }
.layout { display:grid; grid-template-columns:380px 1fr; gap:16px; }
@media (max-width:900px) { .layout { grid-template-columns: 1fr; } }
.card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; }
.card h2 { font-size:13px; color:#a5b4fc; font-weight:800; margin-bottom:12px; }
label { display:block; font-size:10.5px; color:#94a3b8; font-weight:700; margin-bottom:4px; margin-top:10px; letter-spacing:0.04em; }
input, select, textarea { width:100%; background:#0f172a; border:1px solid #475569; color:#e2e8f0; padding:7px 10px; border-radius:6px; font-size:12px; font-family:inherit; }
textarea { resize:vertical; min-height:60px; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
button { background:#3b82f6; color:#fff; border:none; padding:9px 16px; border-radius:6px; cursor:pointer; font-size:12.5px; font-weight:800; }
button.success { background:#22c55e; padding:11px 18px; font-size:13px; width:100%; margin-top:14px; }
button.success:disabled { opacity:0.5; cursor:not-allowed; }
.preview { background:linear-gradient(135deg,#15803d,#064e3b); border:1.5px solid #22c55e; border-radius:10px; padding:12px 14px; margin-top:12px; }
.preview .label { font-size:10px; color:#86efac; font-weight:800; }
.preview .val { font-size:18px; color:#bbf7d0; font-weight:900; margin-top:2px; }
.preview .sub { font-size:10px; color:#94a3b8; margin-top:4px; }
table { width:100%; border-collapse:collapse; font-size:11.5px; }
th { padding:7px; text-align:left; background:#0f172a; color:#94a3b8; font-size:10.5px; }
td { padding:7px; border-bottom:1px solid #334155; color:#cbd5e1; }
td.r { text-align:right; font-family:monospace; }
.badge-status { padding:2px 7px; border-radius:3px; font-size:10px; font-weight:800; }
.s-pending { background:#fbbf24; color:#1e293b; }
.s-in_progress { background:#3b82f6; color:#fff; }
.s-completed { background:#22c55e; color:#fff; }
.s-cancelled { background:#dc2626; color:#fff; }
.s-failed { background:#7f1d1d; color:#fff; }
#toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#16a34a; color:#fff; padding:10px 20px; border-radius:8px; font-weight:800; z-index:99999; opacity:0; transition:opacity 0.2s; }
</style>
</head>
<body>

<h1>📝 견적 빠른 입력 <span style="font-size:11px;color:#94a3b8;font-weight:400">콜 모드 외 직접 등록</span></h1>

<div class="layout">
  <!-- 입력 폼 -->
  <div class="card">
    <h2>새 견적 입력</h2>
    <label>📦 상품 *</label>
    <select id="f-product"><option value="">— 상품 선택 —</option></select>

    <label>🗂 DB 출처 *</label>
    <select id="f-db-source"><option value="">— 출처 선택 —</option></select>

    <div class="row2">
      <div><label>👤 고객명 *</label><input type="text" id="f-name" placeholder="홍길동"></div>
      <div><label>📞 전화 *</label><input type="text" id="f-phone" placeholder="010-1234-5678"></div>
    </div>

    <label>🏠 주소</label>
    <input type="text" id="f-address" placeholder="광주 서구 ...">

    <label>🏠 상세주소</label>
    <input type="text" id="f-address-detail" placeholder="101동 1234호">

    <div class="row2">
      <div><label>📅 계약일</label><input type="date" id="f-contract-date"></div>
      <div><label>📅 설치일</label><input type="date" id="f-install-date"></div>
    </div>

    <div class="row2">
      <div><label>💵 추가 페이백 (0~50,000)</label><input type="number" id="f-add-payback" min="0" max="50000" step="1000" value="0"></div>
      <div><label>📺 TV 대수</label><input type="number" id="f-tv" min="1" max="5" value="1"></div>
    </div>

    <label>📝 메모</label>
    <textarea id="f-notes" placeholder="상담 내용, 특이사항"></textarea>

    <!-- V5 인센티브 미리보기 -->
    <div class="preview" id="preview" style="display:none">
      <div class="label">💰 V5 인센티브 미리보기</div>
      <div class="val" id="prev-incentive">-</div>
      <div class="sub" id="prev-sub">선택한 상품의 단가 × 가중치</div>
    </div>

    <button class="success" onclick="submitSale()" id="btn-submit">✅ 견적 등록</button>
  </div>

  <!-- 본인 이번 달 list -->
  <div class="card">
    <h2>📋 본인 이번 달 견적 <span style="font-size:11px;color:#94a3b8;font-weight:400" id="my-count">-</span></h2>
    <table>
      <thead><tr>
        <th>#</th><th>상품</th><th>고객</th><th>계약일</th><th>상태</th><th class="r">페이백</th>
      </tr></thead>
      <tbody id="my-tbody"><tr><td colspan="6" style="text-align:center;color:#64748b;padding:18px">로딩 중...</td></tr></tbody>
    </table>
  </div>
</div>

<div id="toast"></div>

<script>
const TK = () => localStorage.getItem('incentive-auth-token-v1');
const fetchAuth = (u, o={}) => fetch(u, { ...o, headers: { ...(o.headers||{}), Authorization: 'Bearer ' + TK() }});
const esc = (s) => String(s ?? '').replace(/[<>&"']/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => (n||0).toLocaleString();
function showToast(m, color='#16a34a') { const t=document.getElementById('toast'); t.textContent=m; t.style.background=color; t.style.opacity=1; setTimeout(()=>t.style.opacity=0, 2500); }

let _products = [];
let _myAgent = null;

async function init() {
  if (!TK()) { document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#64748b">로그인 필요</div>'; return; }
  const today = new Date(); document.getElementById('f-contract-date').value = today.toISOString().slice(0,10);

  const [a, p, s] = await Promise.all([
    fetchAuth('/api/incentive/agents/me').then(r=>r.ok?r.json():null),
    fetchAuth('/api/incentive/products').then(r=>r.ok?r.json():null),
    fetchAuth('/api/incentive/db-sources').then(r=>r.ok?r.json():null),
  ]);
  _myAgent = a?.agent;
  _products = p?.products || [];
  // 상품 select
  const psel = document.getElementById('f-product');
  psel.innerHTML = '<option value="">— 상품 선택 —</option>' + _products.map(p => `<option value="${p.id}">${esc(p.name)} (페이백 ${fmt(p.payback)} / 리베이트 ${fmt(p.rebate)})</option>`).join('');
  // 출처 select
  const ssel = document.getElementById('f-db-source');
  ssel.innerHTML = '<option value="">— 출처 선택 —</option>' + (s?.db_sources||[]).map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  // 미리보기 갱신 hooks
  ['f-product','f-add-payback','f-tv'].forEach(id => document.getElementById(id).addEventListener('change', updatePreview));
  await loadMine();
}

function updatePreview() {
  const pid = document.getElementById('f-product').value;
  const p = _products.find(x => String(x.id) === String(pid));
  const prev = document.getElementById('preview');
  if (!p) { prev.style.display = 'none'; return; }
  const add = parseInt(document.getElementById('f-add-payback').value)||0;
  const total = (p.payback||0) + (p.rebate||0) + add;
  document.getElementById('prev-incentive').textContent = fmt(total) + '원';
  document.getElementById('prev-sub').textContent = `페이백 ${fmt(p.payback)} + 리베이트 ${fmt(p.rebate)}${add?` + 추가 ${fmt(add)}`:''} (V5 인센티브는 정산 페이지에서 확정)`;
  prev.style.display = 'block';
}

async function submitSale() {
  const product_id = document.getElementById('f-product').value;
  const db_source_id = document.getElementById('f-db-source').value;
  if (!product_id) { showToast('상품 선택', '#dc2626'); return; }
  if (!db_source_id) { showToast('DB 출처 선택', '#dc2626'); return; }
  const customer_name = document.getElementById('f-name').value.trim();
  const customer_phone = document.getElementById('f-phone').value.replace(/[^0-9]/g, '');
  if (!customer_name || !customer_phone) { showToast('고객명·전화 입력', '#dc2626'); return; }
  if (!/^01[016789][0-9]{7,8}$/.test(customer_phone)) { showToast('전화번호 형식 오류', '#dc2626'); return; }
  const add_payback = parseInt(document.getElementById('f-add-payback').value)||0;
  if (add_payback < 0 || add_payback > 50000) { showToast('추가 페이백 0~50,000', '#dc2626'); return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = '등록 중...';
  try {
    const r = await fetchAuth('/api/incentive/sales', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        product_id: parseInt(product_id),
        db_source_id: parseInt(db_source_id),
        customer_name, customer_phone,
        customer_address: document.getElementById('f-address').value.trim(),
        customer_address_detail: document.getElementById('f-address-detail').value.trim(),
        contract_date: document.getElementById('f-contract-date').value,
        installation_date: document.getElementById('f-install-date').value || null,
        add_payback,
        tv_count: parseInt(document.getElementById('f-tv').value)||1,
        notes: document.getElementById('f-notes').value.trim(),
      })
    });
    const d = await r.json();
    if (!r.ok) { showToast('실패: ' + (d.error||r.status), '#dc2626'); return; }
    showToast('✅ 견적 등록 — sale #' + d.sale.id + (d.converted_customer_ids?.length ? ` · 고객 ${d.converted_customer_ids.length}건 자동 변환` : ''));
    // 폼 초기화 (계약일은 유지)
    ['f-name','f-phone','f-address','f-address-detail','f-notes','f-install-date'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-add-payback').value = '0';
    document.getElementById('f-tv').value = '1';
    document.getElementById('preview').style.display = 'none';
    await loadMine();
  } finally { btn.disabled = false; btn.textContent = '✅ 견적 등록'; }
}

async function loadMine() {
  const ym = new Date().toISOString().slice(0,7);
  const r = await fetchAuth('/api/incentive/sales?month=' + ym);
  if (!r.ok) return;
  const d = await r.json();
  const list = d.sales || [];
  document.getElementById('my-count').textContent = `· ${list.length}건`;
  const tbody = document.getElementById('my-tbody');
  if (!list.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#64748b;padding:18px">아직 견적 없음</td></tr>'; return; }
  const ST = { pending:'대기', in_progress:'진행', completed:'완료', cancelled:'취소', failed:'실패', activated:'개통완료' };
  tbody.innerHTML = list.slice(0,20).map((s,i) => {
    const pname = s.product?.name || '-';
    const total = (s.payback_snapshot||0) + (s.rebate_snapshot||0) + (s.add_payback||0);
    return `<tr>
      <td>${i+1}</td>
      <td>${esc(pname).slice(0,18)}${pname.length>18?'…':''}</td>
      <td>${esc(s.customer_name)}</td>
      <td>${(s.contract_date||'').slice(5)}</td>
      <td><span class="badge-status s-${s.status||'pending'}">${ST[s.status]||s.status}</span></td>
      <td class="r">${fmt(total)}</td>
    </tr>`;
  }).join('');
}

init();
</script>
</body>
</html>
