[phases.setup]
nixPkgs = ["nodejs_22", "chromium"]
aptPkgs = ["libnss3", "libatk-bridge2.0-0", "libdrm2", "libxkbcommon0", "libgbm1", "libasound2"]

[phases.build]
cmds = ["npm run build", "npx playwright install --with-deps chromium"]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/.playwright"

[start]
cmd = "PLAYWRIGHT_CHROMIUM_PATH=$(find /nix -name 'chromium' -type f 2>/dev/null | head -1) NODE_PATH=/app/node_modules node server/index.js"
