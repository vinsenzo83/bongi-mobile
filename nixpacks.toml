[phases.setup]
nixPkgs = ["nodejs_22"]
aptPkgs = ["libnss3", "libatk-bridge2.0-0", "libdrm2", "libxkbcommon0", "libgbm1", "libasound2", "libx11-6", "libxcomposite1", "libxdamage1", "libxext6", "libxfixes3", "libxrandr2", "libcups2", "libpango-1.0-0", "libcairo2", "libatspi2.0-0"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "PLAYWRIGHT_BROWSERS_PATH=/app/pw-browsers npx playwright install chromium chromium-headless-shell --with-deps 2>&1 && PLAYWRIGHT_BROWSERS_PATH=/app/pw-browsers NODE_PATH=/app/node_modules node server/index.js"
