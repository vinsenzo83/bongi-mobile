name: E2E (4 roles × menus × tickets)

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run 4 roles + menus + tickets test
        env:
          E2E_BASE_URL: ${{ github.ref == 'refs/heads/master' && 'https://admin.prexymarket.com' || 'https://dev-admin.prexymarket.com' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          CI: 'true'
        run: npx playwright test tests/e2e/07-roles-menus.spec.js
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: tests/e2e/report/
          retention-days: 14
