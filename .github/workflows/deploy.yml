name: Deploy

on:
  push:
    branches: [master, main, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment by branch
        id: env
        run: |
          BR="${{ github.ref_name }}"
          if [ "$BR" = "main" ] || [ "$BR" = "master" ]; then
            echo "name=라이브" >> $GITHUB_OUTPUT
            echo "rail_env=production" >> $GITHUB_OUTPUT
          else
            echo "name=데브" >> $GITHUB_OUTPUT
            echo "rail_env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service bongi-mobile --environment ${{ steps.env.outputs.rail_env }} --ci --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify
        if: always()
        run: echo "✅ ${{ steps.env.outputs.name }} 배포 — ${{ job.status }}"
